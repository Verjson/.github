# One-off operator workflow for Verjson/.github#1540. It terminalizes three
# check-runs that App 4528902 (ai-review-authorization) created on 2026-09-22
# and never completed after their pull requests reached a terminal state. Only
# the creating App may write a check-run, so this runs from the main-only
# `ai-review-app` environment, mints a per-repository installation token, and
# refuses to touch any check-run that is not still in_progress, not owned by
# App 4528902, or not exactly one of the three reviewed identities below.
# Delete this file in the follow-up PR once the readback shows all three
# completed; it must not survive as a general-purpose check-run writer.
name: oneoff-1540-complete-orphaned-checks
on:
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: Exact operator acknowledgement recorded on #1540
        required: true
        type: string
permissions: {}
concurrency:
  group: oneoff-1540
  cancel-in-progress: false
jobs:
  complete:
    if: github.ref == 'refs/heads/main' && inputs.acknowledgement == 'COMPLETE-ORPHANED-AUTHORIZATION-CHECKS-1540'
    runs-on: ${{ fromJSON(vars.CI_LANE_PRIVILEGED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    environment: ai-review-app
    permissions: {}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target:
          - repository: verjson-git-runners
            check_run_id: 106611362849
            head_sha: 'f7e1e47d7d92443f8bf654971cd69be0c7ca9d30'
          - repository: verjson-authn
            check_run_id: 106657731199
            head_sha: '8bf961c454d7f4238d14a55954b9ec103bbf182e'
          - repository: verjson-agents
            check_run_id: 106661948598
            head_sha: '5b1705435ea1d6c8a12907a00b2541d4f5de503b'
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.AI_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.target.repository }}
          permission-checks: write
      - name: Complete the orphaned check-run with a terminal conclusion
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ matrix.target.repository }}
          CHECK_RUN_ID: ${{ matrix.target.check_run_id }}
          EXPECTED_HEAD_SHA: ${{ matrix.target.head_sha }}
        run: |
          set -euo pipefail
          [[ "$REPOSITORY" =~ ^[a-z0-9-]+$ ]] || { echo "::error::repository name is malformed"; exit 1; }
          [[ "$CHECK_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::check-run id is malformed"; exit 1; }
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::expected head sha is malformed"; exit 1; }
          path="repos/Verjson/$REPOSITORY/check-runs/$CHECK_RUN_ID"
          before="$(gh api "$path")"
          status="$(jq -r '.status // ""' <<<"$before")"
          app_id="$(jq -r '.app.id // ""' <<<"$before")"
          head_sha="$(jq -r '.head_sha // ""' <<<"$before")"
          name="$(jq -r '.name // ""' <<<"$before")"
          if [ "$status" != in_progress ] || [ "$app_id" != 4528902 ] || [ "$name" != "AI review authorization" ] || [ "$head_sha" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::$path is not the reviewed orphan (status=$status app=$app_id name=$name head=$head_sha); refusing to write"
            exit 1
          fi
          gh api -X PATCH "$path" \
            -f status=completed \
            -f conclusion=cancelled \
            -f 'output[title]=Authorization run never completed' \
            -f 'output[summary]=Terminalized by a one-off operator workflow under Verjson/.github#1540: the pull request reached a terminal state on its own while this authorization check stayed in_progress since 2026-09-22. No authorization verdict is implied.' \
            >/dev/null
          after="$(gh api "$path")"
          jq -e '.status == "completed" and .conclusion == "cancelled" and (.completed_at | type) == "string"' <<<"$after" >/dev/null \
            || { echo "::error::$path did not read back as completed/cancelled"; exit 1; }
          echo "completed $path -> $(jq -r '"\(.status)/\(.conclusion) at \(.completed_at)"' <<<"$after")"
