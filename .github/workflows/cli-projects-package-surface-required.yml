# Generated by scripts/gen-node-required-workflow.py config/cli-projects-required-node-ci.json -- do not edit.
name: CLI projects required package surface

on:
  pull_request:

permissions:
  contents: read

jobs:
  admission:
    if: github.repository == 'Verjson/verjson-cli-projects'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate the exact pull-request identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          CONSUMER_WORKFLOW_SHA256: cd938eb8886901a5689fb2d191856a0020262fede4f427ba38fa1eabbe5ab48c
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ "$EVENT_NAME" = pull_request ]
          [ "$REPOSITORY" = 'Verjson/verjson-cli-projects' ]
          [ "$HEAD_REPOSITORY" = 'Verjson/verjson-cli-projects' ]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$REF" = "refs/pull/$PR_NUMBER/merge" ]
          record="$(gh api "repos/Verjson/verjson-cli-projects/pulls/$PR_NUMBER" \
            --jq '[.number,.head.repo.full_name,.head.sha,.merge_commit_sha] | @tsv')"
          IFS=$'\t' read -r live_number live_repository live_head live_merge <<<"$record"
          [ "$live_number" = "$PR_NUMBER" ]
          [ "$live_repository" = "$HEAD_REPOSITORY" ]
          [ "$live_head" = "$HEAD_SHA" ]
          [ "$live_merge" = "$MERGE_SHA" ]
          candidate_workflow="$(mktemp)"
          trap 'rm -f -- "$candidate_workflow"' EXIT INT TERM
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/Verjson/verjson-cli-projects/contents/.github/workflows/ci.yml?ref=$HEAD_SHA" >"$candidate_workflow"
          [ "$(sha256sum "$candidate_workflow" | cut -d' ' -f1)" = "$CONSUMER_WORKFLOW_SHA256" ]

  ci:
    needs: admission
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@d91d6a73128323bf9f1aec72b565d8aac8805aaa
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      node-version: '26'
      secretless-pr: true
      approved-internal-packages: |-
        @verjson/eslint-config
        @verjson/tsconfig
      secretless-ci-script-plan: >-
        ["build","lint","test","test:contract","test:npm-config","test:package-surface","test:public-docs","test:release-v1"]

  ci-node-floor:
    needs: admission
    permissions:
      contents: read
      packages: read
      statuses: read
    uses: Verjson/.github/.github/workflows/node-ci.yml@d91d6a73128323bf9f1aec72b565d8aac8805aaa
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    with:
      node-version: '24.19.0'
      secretless-pr: true
      approved-internal-packages: |-
        @verjson/eslint-config
        @verjson/tsconfig

  package-surface:
    needs: [admission, ci, ci-node-floor]
    if: ${{ always() && needs.admission.result == 'success' && needs.ci.result == 'success' && needs.ci-node-floor.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the untrusted candidate tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: consumer
      - name: Check out the protected verifier at the required-workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Verjson/.github
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: policy
      - name: Verify and exercise the package surface
        env:
          HOME: ${{ runner.temp }}/credentialless-home
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/credentialless-npmrc
        run: python3 policy/scripts/cli-projects-package-surface.py verify consumer
