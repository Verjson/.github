# Temporary evidence-capture workflow for Verjson/.github#1339 (ADR 0077 residual
# risk). It is injected into Verjson/demo-repository as an organization REQUIRED
# workflow by a temporary ruleset, requests the job's OIDC token, and prints the
# decoded CLAIMS only -- never the token, its signature, or any secret -- so the
# exact identity shape a required workflow presents inside a private consumer
# can be recorded and turned into verifier predicates. Delete this file and the
# ruleset once the capture is recorded; it must not become a standing workflow.
name: oidc-claims-probe-1339
on:
  pull_request:
permissions:
  id-token: write
jobs:
  capture:
    # Same lane expression as the gate's private-target path, so runner_environment
    # in the captured claims is the one a real required workflow presents here.
    runs-on: ${{ fromJSON(vars.CI_LANE_UNTRUSTED || '["ubuntu-24.04"]') }}
    permissions:
      id-token: write
    steps:
      - name: Request the OIDC token and print its decoded claims only
        env:
          AUDIENCE: verjson-merge-gate-provenance-probe
        run: |
          set -euo pipefail
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo "::error::no OIDC request URL; id-token permission missing"; exit 1; }
          response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          token="$(jq -r '.value // empty' <<<"$response")"
          [ -n "$token" ] || { echo "::error::token request returned no value"; exit 1; }
          # Mask the token and its parts before anything else is printed.
          echo "::add-mask::$token"
          header="$(cut -d. -f1 <<<"$token")"; payload="$(cut -d. -f2 <<<"$token")"; signature="$(cut -d. -f3 <<<"$token")"
          echo "::add-mask::$header"; echo "::add-mask::$payload"; echo "::add-mask::$signature"
          decode() { local s="$1"; local pad=$(( (4 - ${#s} % 4) % 4 )); local padding; padding="$(printf '%*s' "$pad" '' | tr ' ' '=')"; printf '%s%s' "$s" "$padding" | tr '_-' '/+' | base64 -d; }
          echo "--- header (alg/typ/kid only)"
          decode "$header" | jq '{alg, typ, kid, x5t}'
          echo "--- claims (jti and nbf omitted; exp/iat kept as relative offsets)"
          decode "$payload" | jq '
            . as $c
            | del(.jti)
            | .exp_minus_iat = ($c.exp - $c.iat)
            | del(.exp, .iat, .nbf)
          '
          echo "--- run metadata as GitHub reports it"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg wf "$GITHUB_WORKFLOW" --arg wfref "$GITHUB_WORKFLOW_REF" --arg wfsha "$GITHUB_WORKFLOW_SHA" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" --arg sha "$GITHUB_SHA" \
            '{repository:$repo, workflow:$wf, workflow_ref:$wfref, workflow_sha:$wfsha, run_id:$run, run_attempt:$attempt, event_name:$event, ref:$ref, sha:$sha}'
