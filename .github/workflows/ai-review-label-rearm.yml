name: AI review lifecycle re-arm

on:
  pull_request_target:
    types: [labeled, ready_for_review, converted_to_draft, edited, unlabeled]

permissions:
  contents: read

jobs:
  rearm:
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/gate-rearm.yml
    secrets:
      AI_REVIEW_APP_PRIVATE_KEY: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
