name: node-release (reusable)

# Reusable release for the verJSON Node libraries: checkout (full history),
# setup-node against the @verjson registry, npm ci / build / test, then
# semantic-release. Verjson defaults to isolated self-hosted capacity while
# external callers retain a portable hosted default. Mirrors node-ci.yml.
#
# Caller (each lib's .github/workflows/release.yml):
#
#   name: Release
#   on:
#     push:
#       branches: [main]
#   jobs:
#     release:
#       uses: Verjson/.github/.github/workflows/node-release.yml@main
#       secrets: inherit          # passes NODE_AUTH_TOKEN
#       # with:
#       #   timeout-minutes: 45
#       #   cache-dependency-path: package-lock.json
#
# Cache/timeout details and caller concurrency guidance:
# docs/node-workflows.md

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version; semantic-release requires ^22.14.0 or >=24.10.0
        required: false
        type: string
        default: '24'
      timeout-minutes:
        description: Maximum release-job runtime after a runner starts it
        required: false
        type: number
        default: 30
      cache:
        description: Upload a job-scoped npm cache when cache-dependency-path matches a lockfile
        required: false
        type: boolean
        default: false
      cache-max-mb:
        description: Maximum job-scoped npm cache size to upload when cache is enabled
        required: false
        type: number
        default: 1024
      cache-dependency-path:
        description: Lockfile path or glob used to key the npm download cache
        required: false
        type: string
        default: package-lock.json
      scope:
        description: npm scope for the GitHub Packages registry (empty to skip registry auth)
        required: false
        type: string
        default: '@verjson'
      runner:
        description: Optional JSON runner labels; Verjson defaults isolated, external callers ubuntu-24.04.
        required: false
        type: string
        default: ''
    secrets:
      NODE_AUTH_TOKEN:
        description: Token to read @verjson private packages from GitHub Packages
        required: false

jobs:
  release:
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || github.repository_owner == 'Verjson' && fromJSON('["self-hosted","isolated","linux","x64"]') || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Prepare job-scoped npm cache
        if: inputs.cache
        run: echo "npm_config_cache=$RUNNER_TEMP/verjson-npm-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          # setup-node caches npm's download cache, never node_modules or build
          # output. An absent lockfile disables caching instead of failing jobs
          # in repositories that do not use npm lockfiles.
          cache: ${{ inputs.cache && hashFiles(inputs.cache-dependency-path) != '' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          package-manager-cache: false
          registry-url: ${{ inputs.scope != '' && 'https://npm.pkg.github.com' || '' }}
          scope: ${{ inputs.scope }}
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - run: npm run build
      - run: npm test
      # Check out tooling from the exact commit that defined this reusable job,
      # not from the caller or a mutable central branch.
      # GitHub's documented reusable-workflow pattern:
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#example-usage-of-job-context-workflow-identity
      - name: Check out locked release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .verjson-workflow
          sparse-checkout: .github/release-tooling
          persist-credentials: false
      - name: Install locked release tooling
        env:
          RELEASE_TOOLING_DIR: ${{ runner.temp }}/verjson-release-tooling
        run: |
          bash .verjson-workflow/.github/release-tooling/check-node-version.sh
          mkdir -p "$RELEASE_TOOLING_DIR"
          cp .verjson-workflow/.github/release-tooling/package.json "$RELEASE_TOOLING_DIR/"
          cp .verjson-workflow/.github/release-tooling/package-lock.json "$RELEASE_TOOLING_DIR/"
          rm -rf -- .verjson-workflow
          npm ci --ignore-scripts --prefix "$RELEASE_TOOLING_DIR"
      - name: Publish release
        run: '"$RELEASE_TOOLING_DIR/node_modules/.bin/semantic-release"'
        env:
          RELEASE_TOOLING_DIR: ${{ runner.temp }}/verjson-release-tooling
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bound npm cache upload
        if: always() && inputs.cache
        env:
          CACHE_MAX_MB: ${{ inputs.cache-max-mb }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/verjson-npm-cache"
          mkdir -p "$cache_dir"
          size_kb="$(du -sk "$cache_dir" | cut -f1)"
          size_mb="$(( (size_kb + 1023) / 1024 ))"
          {
            echo "### npm cache"
            echo "- scoped path: \`$cache_dir\`"
            echo "- size: ${size_mb} MB"
            echo "- upload limit: ${CACHE_MAX_MB} MB"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size_kb" -gt "$(( CACHE_MAX_MB * 1024 ))" ]; then
            echo "::warning::npm cache is ${size_mb} MB; clearing it instead of uploading more than ${CACHE_MAX_MB} MB"
            find "$cache_dir" -mindepth 1 -delete
          fi
