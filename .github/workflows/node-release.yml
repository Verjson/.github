name: node publish (reusable)

# Publish-only by construction (ADR 0069, #455). This workflow never chooses a
# version, creates a tag, or pushes a commit. The changelog contract does those
# things first; this job consumes the exact tag it is handed.

on:
  workflow_call:
    inputs:
      version:
        description: Existing SemVer tag in the expected v or stream-v namespace
        required: true
        type: string
      prefix:
        description: Exact version namespace prefix; independent from component
        required: false
        type: string
        default: v
      node-version:
        description: Node.js version used to install, build, and publish
        required: false
        type: string
        default: '24'
      timeout-minutes:
        description: Maximum publish-job runtime after a runner starts it
        required: false
        type: number
        default: 30
      cache:
        description: Upload a job-scoped npm cache when cache-dependency-path matches a lockfile
        required: false
        type: boolean
        default: false
      cache-max-mb:
        description: Maximum job-scoped npm cache size to upload when cache is enabled
        required: false
        type: number
        default: 1024
      cache-dependency-path:
        description: Lockfile path or glob used to key the npm download cache
        required: false
        type: string
        default: package-lock.json
      scope:
        description: Required lowercase npm scope for the GitHub Packages registry
        required: false
        type: string
        default: '@verjson'
      package-dirs:
        description: JSON array of normalized repository-relative package directories
        required: false
        type: string
        default: '["."]'
      deprecates:
        description: >-
          JSON array of {"name","message"} old npm package names (unscoped basenames, same
          scope as `scope`) to mark deprecated via `npm deprecate` once this release
          publishes successfully. Required on the first release after a package rename so
          retention never ages the old name out with no forwarding pointer
          (verjson-agents#987); the receiving release is the natural place to couple the
          two, since retention runs immediately after it.
        required: false
        type: string
        default: '[]'
      contract-ref:
        description: Immutable Verjson/.github commit supplying the retention implementation
        required: true
        type: string
      runner:
        description: Optional JSON runner labels; Verjson defaults general, external callers ubuntu-24.04.
        required: false
        type: string
        default: ''
    outputs:
      new-release-published:
        description: "'true' only after npm and GitHub release publication both succeed"
        value: ${{ jobs.release.outputs.new-release-published }}
      new-release-version:
        description: Published package version without its tag namespace prefix
        value: ${{ jobs.release.outputs.new-release-version }}
    secrets:
      NODE_AUTH_TOKEN:
        description: Token that can read private dependencies during npm ci
        required: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || github.repository_owner != 'Verjson' && 'ubuntu-24.04' || github.event.repository.private == true && fromJSON(vars.VERJSON_LANE_TRUSTED || vars.VERJSON_LANE_FALLBACK || '["ubuntu-24.04"]') || fromJSON(vars.VERJSON_LANE_UNTRUSTED || vars.VERJSON_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      packages: write
    outputs:
      new-release-published: ${{ steps.result.outputs.new-release-published }}
      new-release-version: ${{ steps.result.outputs.new-release-version }}
      retention-targets: ${{ steps.package-dirs.outputs.retention-targets }}
    steps:
      - name: Require the contract's exact release tag
        id: release-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREFIX: ${{ inputs.prefix }}
          SCOPE: ${{ inputs.scope }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$PREFIX" =~ ^([a-z0-9][a-z0-9._-]*-)?v$ ]]; then
            echo "::error::'$PREFIX' is not a canonical v or stream-v release namespace."
            exit 1
          fi
          package_version="${VERSION#"$PREFIX"}"
          if [ "$package_version" = "$VERSION" ] ||
            [[ ! "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not exact SemVer in namespace '$PREFIX'."
            exit 1
          fi
          if [[ ! "$SCOPE" =~ ^@[a-z0-9][a-z0-9._~-]*$ || ${#SCOPE} -gt 214 ]]; then
            echo "::error::scope must be a non-empty lowercase npm scope such as @verjson."
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null; then
            echo "::error::Could not verify tag $VERSION. The changelog snapshot must exist and GitHub's API must be reachable before publication."
            exit 1
          fi
          printf 'package-version=%s\n' "$package_version" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare job-scoped changelog tool cache
        run: |
          cache_root="$(mktemp -d "$GITHUB_WORKSPACE/.verjson-changelog-tools.XXXXXX")"
          echo "VERJSON_CHANGELOG_TOOL_CACHE=$cache_root" >> "$GITHUB_ENV"
      - name: Verify the checked-out tag and immutable release note
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(git describe --tags --exact-match HEAD)" = "$VERSION"
          test -f "CHANGELOG/$VERSION.md"
      - name: Prepare job-scoped npm cache
        if: inputs.cache
        run: echo "npm_config_cache=$RUNNER_TEMP/verjson-npm-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.cache && hashFiles(inputs.cache-dependency-path) != '' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: ${{ inputs.scope }}
      - name: Validate release package directories
        id: package-dirs
        env:
          PACKAGE_DIRS: ${{ inputs.package-dirs }}
          PACKAGE_VERSION: ${{ steps.release-tag.outputs.package-version }}
          SCOPE: ${{ inputs.scope }}
        run: |
          node - "$PACKAGE_DIRS" "$PACKAGE_VERSION" "$SCOPE" <<'NODE'
          const packageDirs = JSON.parse(process.argv[2]);
          const packageVersion = process.argv[3];
          const scope = process.argv[4];
          if (!Array.isArray(packageDirs) || packageDirs.length === 0) {
            throw new Error("package-dirs must be a non-empty JSON array");
          }
          const seen = new Set();
          for (const packageDir of packageDirs) {
            if (
              typeof packageDir !== "string" ||
              (packageDir !== "." && !/^[A-Za-z0-9._][A-Za-z0-9._-]*(\/[A-Za-z0-9._][A-Za-z0-9._-]*)*$/.test(packageDir)) ||
              (packageDir !== "." && packageDir.split("/").some((segment) => segment === "." || segment === "..")) ||
              seen.has(packageDir)
            ) {
              throw new Error(`invalid or duplicate package directory: ${packageDir}`);
            }
            seen.add(packageDir);
          }
          const targets = packageDirs.map((packageDir) => {
            const packageJson = require(require("path").resolve(packageDir, "package.json"));
            const prefix = `${scope}/`;
            if (typeof packageJson.name !== "string" || !packageJson.name.startsWith(prefix)) {
              throw new Error(`package in ${packageDir} is not owned by configured scope ${scope}`);
            }
            const name = packageJson.name.slice(prefix.length);
            if (!/^[a-z0-9][a-z0-9._-]*$/.test(name)) {
              throw new Error(`package in ${packageDir} has an invalid GitHub Packages basename`);
            }
            return {type: "npm", name, releasedVersion: packageVersion};
          });
          require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `retention-targets=${JSON.stringify(targets)}\n`);
          NODE
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - name: Prepare release package metadata
        env:
          PACKAGE_VERSION: ${{ steps.release-tag.outputs.package-version }}
        run: |
          # RELEASE_PREPARE_PACKAGES_BEGIN
          if [ -e scripts/release-prepare-packages.sh ] && [ ! -x scripts/release-prepare-packages.sh ]; then
            echo "::error::scripts/release-prepare-packages.sh exists but is not executable."
            exit 1
          fi
          if [ -x scripts/release-prepare-packages.sh ]; then
            scripts/release-prepare-packages.sh "$PACKAGE_VERSION"
          fi
          # RELEASE_PREPARE_PACKAGES_END
      - name: Stamp the dispatched package version
        env:
          PACKAGE_VERSION: ${{ steps.release-tag.outputs.package-version }}
        run: npm version "$PACKAGE_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
      - run: npm run build --if-present
      - name: Publish the exact snapshot version
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ steps.release-tag.outputs.package-version }}
          PACKAGE_DIRS_JSON: ${{ inputs.package-dirs }}
          REQUESTED_TAG: ${{ inputs.version }}
        run: |
          # RESTART_SAFE_NPM_PUBLISH_BEGIN
          pack_json="$(mktemp)"
          package_meta="$(mktemp)"
          registry_json="$(mktemp)"
          package_file=
          trap 'rm -f "$pack_json" "$package_meta" "$registry_json"; [ -z "$package_file" ] || rm -f -- "$package_file"' EXIT
          expected_version="$PACKAGE_VERSION"
          mapfile -t package_dirs < <(jq -r '.[]' <<<"$PACKAGE_DIRS_JSON")

          for package_dir in "${package_dirs[@]}"; do
            # LOCAL_PACKAGE_PATH_BEGIN
            if [ "$package_dir" = . ]; then
              package_path=.
            else
              package_path="./$package_dir"
            fi
            # LOCAL_PACKAGE_PATH_END
            [ -d "$package_path" ] \
              || { echo "::error::Configured release package directory '$package_dir' does not exist."; exit 1; }
            npm version "$expected_version" --prefix "$package_path" --no-git-tag-version \
              --ignore-scripts --allow-same-version
            npm pack "$package_path" --json --ignore-scripts >"$pack_json"
            node - "$pack_json" "$expected_version" >"$package_meta" <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const [packPath, expectedVersion] = process.argv.slice(2);
          const packed = JSON.parse(fs.readFileSync(packPath, "utf8"));
          if (!Array.isArray(packed) || packed.length !== 1) {
            throw new Error("npm pack did not describe exactly one package");
          }
          const item = packed[0];
          for (const key of ["name", "version", "integrity", "filename"]) {
            if (typeof item[key] !== "string" || item[key] === "") {
              throw new Error(`npm pack omitted ${key}`);
            }
          }
          if (item.version !== expectedVersion) {
            throw new Error(`packed version ${item.version} does not match dispatched ${expectedVersion}`);
          }
          if (!item.integrity.startsWith("sha512-")) {
            throw new Error("npm pack returned a non-sha512 integrity");
          }
          if (path.basename(item.filename) !== item.filename) {
            throw new Error("npm pack returned an unsafe filename");
          }
          process.stdout.write([item.name, item.version, item.integrity, item.filename].join("\t") + "\n");
          NODE
            IFS=$'\t' read -r package_name published_version package_integrity package_file <"$package_meta"

            if npm publish "$package_file" --ignore-scripts --registry=https://npm.pkg.github.com; then
              echo "Published $package_name@$published_version."
            else
              echo "::warning::npm publish failed; proving whether an identical immutable version already exists before continuing."
              view_stderr="$(mktemp)"
              if ! npm view "$package_name@$published_version" --json \
                --registry=https://npm.pkg.github.com >"$registry_json" 2>"$view_stderr"; then
                if grep -qE '\bE404\b' "$view_stderr"; then
                  registry_state="the registry returned 404 for it, which is not a confirmed-missing version by itself: GitHub Packages also returns 404 for a private package this job's token cannot read, so this could equally be an authorization gap rather than proof the version was never published"
                else
                  registry_state="the registry could not confirm either way (its response indicated an auth, network, or other transient error, not a confirmed-missing version)"
                fi
                cat "$view_stderr" >&2
                rm -f "$view_stderr"
                echo "::error::npm publish failed for $package_name@$published_version and $registry_state. Either way, this is expected-recoverable state, not a wedged release: tag $REQUESTED_TAG and its immutable CHANGELOG/$REQUESTED_TAG.md already exist on the default branch (changelog-release.yml completed before this job ever started, per ADR 0069's verify-then-snapshot-then-publish ordering), and re-dispatching this exact same version is safe. The dispatched caller's verify job will detect the existing tag/snapshot and skip snapshot automatically, retrying only publication."
                exit 1
              fi
              rm -f "$view_stderr"
              node - "$registry_json" "$package_name" "$published_version" "$package_integrity" <<'NODE'
          const fs = require("fs");
          const [viewPath, expectedName, expectedVersion, expectedIntegrity] = process.argv.slice(2);
          const published = JSON.parse(fs.readFileSync(viewPath, "utf8"));
          if (
            published.name !== expectedName ||
            published.version !== expectedVersion ||
            !published.dist ||
            published.dist.integrity !== expectedIntegrity
          ) {
            throw new Error("registry package identity or integrity does not match the attested release snapshot");
          }
          NODE
              echo "Registry already contains the identical $package_name@$published_version; package publication is complete."
            fi
            rm -f -- "$package_file"
            package_file=
          done
          # RESTART_SAFE_NPM_PUBLISH_END
      - name: Publish the snapshot release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          # RESTART_SAFE_GH_RELEASE_BEGIN
          snapshot="CHANGELOG/$VERSION.md"
          notes="$snapshot"
          notes_limit=125000
          if [ "$(wc -c <"$snapshot")" -gt "$notes_limit" ]; then
            temp_root="${RUNNER_TEMP:-/tmp}"
            notes="$(mktemp "$temp_root/release-notes.XXXXXX")"
            cleanup_release_notes() { rm -f -- "$notes"; }
            trap cleanup_release_notes EXIT
            head -c 120000 "$snapshot" | sed '$d' >"$notes"
            {
              printf "\n\n---\n\n"
              printf "_These notes were truncated at GitHub's 125,000-character limit. "
              printf "The complete and immutable snapshot for this release is "
              printf "[\`%s\`](%s/%s/blob/%s/%s)._\n" \
                "$snapshot" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$VERSION" "$snapshot"
            } >>"$notes"
            [ "$(wc -c <"$notes")" -le "$notes_limit" ] \
              || { echo "::error::Bounded GitHub Release notes exceed $notes_limit bytes."; exit 1; }
            echo "::notice::Release notes were truncated by bytes; the full immutable snapshot is $snapshot."
          fi
          existing_tag="$(gh release view "$VERSION" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -n "$existing_tag" ]; then
            [ "$existing_tag" = "$VERSION" ] \
              || { echo "::error::GitHub Release lookup returned unexpected tag '$existing_tag'."; exit 1; }
            gh release edit "$VERSION" --notes-file "$notes"
          else
            gh release create "$VERSION" --verify-tag --notes-file "$notes"
          fi
          # RESTART_SAFE_GH_RELEASE_END
      - name: Deprecate renamed package names
        if: inputs.deprecates != '[]'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOPE: ${{ inputs.scope }}
          DEPRECATES: ${{ inputs.deprecates }}
        run: |
          # DEPRECATE_RENAMED_PACKAGES_BEGIN
          set -euo pipefail
          entries="$(mktemp)"
          trap 'rm -f "$entries"' EXIT
          node - "$DEPRECATES" "$SCOPE" "$entries" <<'NODE'
          const fs = require("fs");
          const [raw, scope, outPath] = process.argv.slice(2);
          let parsed;
          try {
            parsed = JSON.parse(raw);
          } catch (error) {
            throw new Error(`deprecates is not valid JSON: ${error.message}`);
          }
          if (!Array.isArray(parsed)) {
            throw new Error("deprecates must be a JSON array");
          }
          const seen = new Set();
          const lines = [];
          for (const entry of parsed) {
            if (
              typeof entry !== "object" || entry === null ||
              typeof entry.name !== "string" || entry.name === "" ||
              typeof entry.message !== "string" || entry.message === "" ||
              !/^[a-z0-9][a-z0-9._-]*$/.test(entry.name)
            ) {
              throw new Error("each deprecates entry needs a non-empty basename 'name' and 'message'");
            }
            if (seen.has(entry.name)) {
              throw new Error(`duplicate deprecates entry: ${entry.name}`);
            }
            seen.add(entry.name);
            lines.push(`${scope}/${entry.name}\t${entry.message}`);
          }
          fs.writeFileSync(outPath, lines.join("\n") + (lines.length ? "\n" : ""));
          NODE
          while IFS=$'\t' read -r package_name message; do
            [ -n "$package_name" ] || continue
            echo "Deprecating $package_name: $message"
            npm deprecate "$package_name@*" "$message" --registry=https://npm.pkg.github.com
          done <"$entries"
          # DEPRECATE_RENAMED_PACKAGES_END
      - name: Report successful publication
        id: result
        env:
          PACKAGE_VERSION: ${{ steps.release-tag.outputs.package-version }}
        run: |
          echo "new-release-published=true" >> "$GITHUB_OUTPUT"
          echo "new-release-version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Bound npm cache upload
        if: always() && inputs.cache
        env:
          CACHE_MAX_MB: ${{ inputs.cache-max-mb }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/verjson-npm-cache"
          mkdir -p "$cache_dir"
          size_kb="$(du -sk "$cache_dir" | cut -f1)"
          size_mb="$(( (size_kb + 1023) / 1024 ))"
          echo "npm cache: ${size_mb} MB (upload limit: ${CACHE_MAX_MB} MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size_kb" -gt "$(( CACHE_MAX_MB * 1024 ))" ]; then
            echo "::warning::npm cache is ${size_mb} MB; clearing it instead of uploading more than ${CACHE_MAX_MB} MB"
            find "$cache_dir" -mindepth 1 -delete
          fi

  retention:
    name: Retain three numbered package releases
    needs: release
    if: needs.release.outputs.new-release-published == 'true'
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || github.repository_owner != 'Verjson' && 'ubuntu-24.04' || github.event.repository.private == true && fromJSON(vars.VERJSON_LANE_TRUSTED || vars.VERJSON_LANE_FALLBACK || '["ubuntu-24.04"]') || fromJSON(vars.VERJSON_LANE_UNTRUSTED || vars.VERJSON_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate the immutable retention contract ref
        env:
          CONTRACT_REF: ${{ inputs.contract-ref }}
        run: '[[ "$CONTRACT_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Verjson/.github
          ref: ${{ inputs.contract-ref }}
          path: .package-retention-contract
          persist-credentials: false
      - name: Delete package versions outside canonical retention
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGETS: ${{ needs.release.outputs.retention-targets }}
          # Org-wide retention window (verjson-agents#987). Defaults to the ADR
          # 0108 policy of 3 and changes nothing until a human sets this
          # variable — raising it is a storage-cost decision, not a code change.
          RETENTION_KEEP: ${{ vars.VERJSON_PACKAGE_RETENTION_KEEP || '3' }}
        run: |
          if [[ ! "$RETENTION_KEEP" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::VERJSON_PACKAGE_RETENTION_KEEP must be a positive integer, got '$RETENTION_KEEP'."
            exit 1
          fi
          python3 .package-retention-contract/scripts/package_retention.py \
            --owner "$GITHUB_REPOSITORY_OWNER" --targets "$TARGETS" --keep "$RETENTION_KEEP" --apply
