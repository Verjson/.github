name: node-release (reusable)

# RETIRED — this reusable refuses to run. ADR 0060 (#460).
#
# It ran semantic-release, which derives the version from commit subjects at
# merge time. ADR 0038 replaced that model: a release is a workflow_dispatch
# that names the version to cut, and a pinned scripts/changelog.py release
# snapshots the accumulated NEXT/ fragments into an immutable
# CHANGELOG/<version>.md. Merging main publishes nothing.
#
# Callers move to changelog-release.yml. Generate the three adoption files from
# one immutable contract commit rather than hand-writing them:
#
#   scripts/gen-changelog-caller.sh {workflow|renderer|contract-test} <sha>
#
# docs/changelog/README.md has the caller shape; docs/decisions/0038-canonical-
# changelog-contract has the reasoning.
#
# The body below is left in place so the refusal can name its replacement — a
# deleted workflow fails with "workflow not found", which points nowhere. It is
# unreachable; treat it as history, not as configuration.
#
# Cache/timeout details and caller concurrency guidance:
# docs/node-workflows.md

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version; semantic-release requires ^22.14.0 or >=24.10.0
        required: false
        type: string
        default: '24'
      timeout-minutes:
        description: Maximum release-job runtime after a runner starts it
        required: false
        type: number
        default: 30
      cache:
        description: Upload a job-scoped npm cache when cache-dependency-path matches a lockfile
        required: false
        type: boolean
        default: false
      cache-max-mb:
        description: Maximum job-scoped npm cache size to upload when cache is enabled
        required: false
        type: number
        default: 1024
      cache-dependency-path:
        description: Lockfile path or glob used to key the npm download cache
        required: false
        type: string
        default: package-lock.json
      scope:
        description: npm scope for the GitHub Packages registry (empty to skip registry auth)
        required: false
        type: string
        default: '@verjson'
      runner:
        description: Optional JSON runner labels; Verjson defaults general, external callers ubuntu-24.04.
        required: false
        type: string
        default: ''
    outputs:
      new-release-published:
        description: >-
          'true' when semantic-release published a release for this run, 'false'
          when no release was necessary. Empty when the release job failed or was
          skipped, so callers must compare against 'true' — never against 'false'.
        value: ${{ jobs.release.outputs.new-release-published }}
      new-release-version:
        description: >-
          Published version without a tag prefix (e.g. 1.4.0); empty when nothing
          was published.
        value: ${{ jobs.release.outputs.new-release-version }}
    secrets:
      NODE_AUTH_TOKEN:
        description: Token to read @verjson private packages from GitHub Packages
        required: false

jobs:
  release:
    # Runner routing is policy, not preference — see ADR 0033. In tier order:
    # an explicit `runner` input wins; a caller outside Verjson gets hosted
    # (portable, their billing); a Verjson PRIVATE repo gets the general
    # self-hosted pool; anything else — public, or an event that carries no
    # visibility — gets the ephemeral untrusted-PR pool. That last tier is
    # fail-SAFE, not a fallback: unresolved visibility must never put fork code
    # on the persistent pool. Both pools are org variables so a provider move
    # (GCP -> DigitalOcean) is a variable flip, not a PR here.
    runs-on: ${{ inputs.runner != '' && fromJSON(inputs.runner) || github.repository_owner != 'Verjson' && 'ubuntu-24.04' || github.event.repository.private == true && fromJSON(vars.VERJSON_LANE_TRUSTED || vars.VERJSON_LANE_FALLBACK || '["ubuntu-24.04"]') || fromJSON(vars.VERJSON_LANE_UNTRUSTED || vars.VERJSON_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    outputs:
      new-release-published: ${{ steps.publish.outputs.new-release-published }}
      new-release-version: ${{ steps.publish.outputs.new-release-version }}
    steps:
      # First step, unconditional, and before any checkout: the point is that
      # nothing this workflow used to do can still happen. No `if:` — a
      # condition is the one edit that would let the retired path run again
      # while the step still appears in the file.
      - name: Refuse a release derived from a merge
        env:
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_REPO: ${{ github.repository }}
        run: |
          echo "::error::node-release.yml is retired (Verjson/.github ADR 0060). $CALLER_REPO called it from a '$CALLER_EVENT' event; it ran semantic-release, which derives the version from commit subjects at merge time."
          echo "::error::Move to changelog-release.yml: a workflow_dispatch that names the version, snapshotting NEXT/ fragments into CHANGELOG/<version>.md. Generate the caller with scripts/gen-changelog-caller.sh; see docs/changelog/README.md and ADR 0038."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Prepare job-scoped npm cache
        if: inputs.cache
        run: echo "npm_config_cache=$RUNNER_TEMP/verjson-npm-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          # setup-node caches npm's download cache, never node_modules or build
          # output. An absent lockfile disables caching instead of failing jobs
          # in repositories that do not use npm lockfiles.
          cache: ${{ inputs.cache && hashFiles(inputs.cache-dependency-path) != '' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.cache-dependency-path }}
          package-manager-cache: false
          registry-url: ${{ inputs.scope != '' && 'https://npm.pkg.github.com' || '' }}
          scope: ${{ inputs.scope }}
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      - run: npm run build
      - run: npm test
      # Check out tooling from the exact commit that defined this reusable job,
      # not from the caller or a mutable central branch.
      # GitHub's documented reusable-workflow pattern:
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#example-usage-of-job-context-workflow-identity
      - name: Check out locked release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .verjson-workflow
          sparse-checkout: .github/release-tooling
          persist-credentials: false
      - name: Install locked release tooling
        env:
          RELEASE_TOOLING_DIR: ${{ runner.temp }}/verjson-release-tooling
        run: |
          bash .verjson-workflow/.github/release-tooling/check-node-version.sh
          mkdir -p "$RELEASE_TOOLING_DIR"
          cp .verjson-workflow/.github/release-tooling/package.json "$RELEASE_TOOLING_DIR/"
          cp .verjson-workflow/.github/release-tooling/package-lock.json "$RELEASE_TOOLING_DIR/"
          cp .verjson-workflow/.github/release-tooling/emit-release-outputs.mjs "$RELEASE_TOOLING_DIR/"
          rm -rf -- .verjson-workflow
          npm ci --ignore-scripts --prefix "$RELEASE_TOOLING_DIR"
      # Runs from the caller's checkout, so semantic-release still reads the
      # caller's config and history; only the invocation moves into the locked
      # tooling directory, where the runner resolves the pinned dependency and
      # reports the publication result as a job output (#244).
      - name: Publish release
        id: publish
        run: node "$RELEASE_TOOLING_DIR/emit-release-outputs.mjs"
        env:
          RELEASE_TOOLING_DIR: ${{ runner.temp }}/verjson-release-tooling
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bound npm cache upload
        if: always() && inputs.cache
        env:
          CACHE_MAX_MB: ${{ inputs.cache-max-mb }}
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/verjson-npm-cache"
          mkdir -p "$cache_dir"
          size_kb="$(du -sk "$cache_dir" | cut -f1)"
          size_mb="$(( (size_kb + 1023) / 1024 ))"
          {
            echo "### npm cache"
            echo "- scoped path: \`$cache_dir\`"
            echo "- size: ${size_mb} MB"
            echo "- upload limit: ${CACHE_MAX_MB} MB"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$size_kb" -gt "$(( CACHE_MAX_MB * 1024 ))" ]; then
            echo "::warning::npm cache is ${size_mb} MB; clearing it instead of uploading more than ${CACHE_MAX_MB} MB"
            find "$cache_dir" -mindepth 1 -delete
          fi
