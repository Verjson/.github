name: actionlint

# Lints the caller's GitHub Actions workflows deterministically, so nit classes
# the merge-gate AI reviewer used to catch by hand (inconsistent/deprecated
# action pins — e.g. #60 — and workflow-expression errors) fail pre-review for
# free. Local pull_request/push behavior from #80 is preserved; workflow_call
# exposes the same implementation to consumers (#153).
#
# The GCP self-hosted pool has no Docker socket, so actionlint is installed as a
# pinned, checksum-verified release binary rather than a container action.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
  workflow_call:
    inputs:
      github-hosted-runner:
        description: Use the fixed ubuntu-24.04 runner instead of the GCP self-hosted pool.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ${{ inputs.github-hosted-runner && 'ubuntu-24.04' || fromJSON('["self-hosted","GCP"]') }}
    env:
      ACTIONLINT_VERSION: 1.7.7
      # From actionlint_1.7.7_checksums.txt on the upstream GitHub Release.
      ACTIONLINT_SHA256: '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install actionlint (pinned release binary)
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          curl -fsSL "$url" -o "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          ./actionlint --version
      - name: Prove invalid workflows fail actionlint
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat >"$tmp/valid.yml" <<'YAML'
          name: valid
          on: push
          jobs:
            test:
              runs-on: ubuntu-24.04
              steps:
                - run: echo valid
          YAML

          cat >"$tmp/invalid-syntax.yml" <<'YAML'
          name: invalid syntax
          on: push
          jobs:
            test:
              runs-on: [ubuntu-24.04
          YAML

          expression_marker='$'
          cat >"$tmp/invalid-expression.yml" <<YAML
          name: invalid expression
          on: push
          jobs:
            test:
              runs-on: ubuntu-24.04
              steps:
                - if: ${expression_marker}{{ github.property_that_does_not_exist }}
                  run: echo unreachable
          YAML

          ./actionlint "$tmp/valid.yml"
          if ./actionlint "$tmp/invalid-syntax.yml"; then
            echo "::error::actionlint accepted malformed workflow syntax"
            exit 1
          fi
          if ./actionlint "$tmp/invalid-expression.yml"; then
            echo "::error::actionlint accepted an invalid workflow expression"
            exit 1
          fi
      - name: Run actionlint over all workflows
        env:
          REQUIRE_SHELLCHECK: ${{ inputs.github-hosted-runner }}
        run: |
          if [ "$REQUIRE_SHELLCHECK" = true ]; then
            command -v shellcheck >/dev/null || {
              echo "::error::The governed GitHub-hosted runner must provide shellcheck"
              exit 1
            }
            ./actionlint -shellcheck=shellcheck -color
          else
            ./actionlint -color
          fi
