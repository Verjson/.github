name: AI review authorization arm

# Trusted base-branch entrypoint for ADR 0079 and the organization ruleset
# workflow selected by ADR 0091. This workflow never checks out or executes
# pull-request code. The dedicated App must be installed with Checks:write; its
# identity and the immutable receipt are the AI authorization trust boundary.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, unlabeled]
  workflow_call:
    secrets:
      AI_REVIEW_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: ai-review-arm-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  arm:
    # AI remains advisory under ADR 0090. A missing credential, App outage, or
    # authorization defect must fail this job visibly without turning the
    # ruleset workflow into a veto on an otherwise-authorized human merge.
    # Exact-head App approval and terminal promotion still require successful
    # receipt-bound completion, so tolerating this job cannot grant authority.
    continue-on-error: true
    # This trusted, secret-bearing control-plane job follows the organization
    # lane contract. Fleet placement changes through variables, never by
    # hardcoding a provider or runner label in this reusable workflow.
    runs-on: ${{ fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    env:
      APP_ID: ${{ vars.AI_REVIEW_APP_ID }}
      APP_CLIENT_ID: ${{ vars.AI_REVIEW_CLIENT_ID }}
      APP_SLUG: ${{ vars.AI_REVIEW_APP_SLUG }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EVENT_ACTION: ${{ github.event.action }}
      EVENT_LABEL: ${{ github.event.label.name || '' }}
      EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_OLD_TITLE: ${{ github.event.changes.title.from || '' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      REPOSITORY_ID: ${{ github.repository_id }}
      TARGET_REPO: ${{ github.repository }}
      REVIEW_AUTHORITY: ${{ vars.AI_REVIEW_AUTHORITY || 'human' }}
      PRIMARY_PROVIDER: ${{ vars.AI_REVIEW_PRIMARY_PROVIDER || 'anthropic' }}
      PRIMARY_MODEL: ${{ vars.AI_REVIEW_PRIMARY_MODEL || 'auto' }}
      PRIMARY_BUDGET_USD: ${{ vars.AI_REVIEW_PRIMARY_BUDGET_USD || 'auto' }}
      PRIMARY_FALLBACK_MODEL: ${{ vars.AI_REVIEW_PRIMARY_FALLBACK_MODEL }}
      PRIMARY_FALLBACK_BUDGET_USD: ${{ vars.AI_REVIEW_PRIMARY_FALLBACK_BUDGET_USD }}
      REREVIEW_PROVIDER: ${{ vars.AI_REVIEW_REREVIEW_PROVIDER }}
      REREVIEW_MODEL: ${{ vars.AI_REVIEW_REREVIEW_MODEL }}
      REREVIEW_BUDGET_USD: ${{ vars.AI_REVIEW_REREVIEW_BUDGET_USD }}
      REREVIEW_FALLBACK_MODEL: ${{ vars.AI_REVIEW_REREVIEW_FALLBACK_MODEL }}
      REREVIEW_FALLBACK_BUDGET_USD: ${{ vars.AI_REVIEW_REREVIEW_FALLBACK_BUDGET_USD }}
      REQUEST_ACTOR: ${{ github.event.sender.login || github.actor }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Validate authorization App client ID
        run: |
          [[ "$APP_CLIENT_ID" =~ ^Iv[A-Za-z0-9.]{8,126}$ ]] || {
            echo "::error::AI_REVIEW_CLIENT_ID is unavailable or malformed"; exit 1;
          }

      - name: Mint dedicated authorization App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.AI_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Create exact-head authorization receipt
        id: arm
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MINTED_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || exit 1
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$REPOSITORY_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
          [[ "$APP_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::AI_REVIEW_APP_ID is unavailable"; exit 1; }
          [[ "$APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::AI_REVIEW_APP_SLUG is unavailable"; exit 1; }
          installation="$(gh api /installation)" || {
            echo "::error::could not verify the minted AI review authorization App identity"; exit 1;
          }
          minted_identity="$(jq -cer '
            {app_id:(.app_id | select(type == "number" and . > 0)),
             app_slug:(.app_slug | select(type == "string" and test("^[a-z0-9][a-z0-9-]*$")))}
          ' <<<"$installation")" || {
            echo "::error::minted AI review authorization App installation identity is malformed or incomplete"; exit 1;
          }
          minted_app_id="$(jq -r '.app_id' <<<"$minted_identity")"
          minted_app_slug="$(jq -r '.app_slug' <<<"$minted_identity")"
          token_action_app_slug="$(printenv MINTED_APP_SLUG || true)"
          if [ "$token_action_app_slug" != "$APP_SLUG" ] || [ "$minted_app_id" != "$APP_ID" ] || [ "$minted_app_slug" != "$APP_SLUG" ]; then
            echo "::error::AI review authorization App identity mismatch: expected '$APP_SLUG' ($APP_ID), token action reported '$token_action_app_slug', installation reported '$minted_app_slug' ($minted_app_id)"
            exit 1
          fi

          explicit_label_delivery=false
          if [ "$EVENT_NAME" = pull_request_target ] && [ "$EVENT_ACTION" = labeled ]; then
            label_normalized="$(jq -nr --arg raw_label "$EVENT_LABEL" '$raw_label | ascii_downcase | gsub("[ _-]+";"-")')"
            case "$label_normalized" in ai-review|re-review) ;; *) exit 0 ;; esac
            [ "${GITHUB_RUN_ATTEMPT:-}" = 1 ] || { echo "::error::label deliveries cannot be replayed by rerunning a workflow"; exit 1; }
            [[ "${GITHUB_RUN_ID:-}" =~ ^[1-9][0-9]*$ ]] || { echo "::error::label delivery run ID is malformed"; exit 1; }
            [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::protected workflow SHA is malformed"; exit 1; }
            [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::label event head is malformed"; exit 1; }
            [ "$WORKFLOW_REF" = "$TARGET_REPO/.github/workflows/ai-review-label-rearm.yml@refs/heads/$DEFAULT_BRANCH" ] || {
              echo "::error::label delivery did not enter through the separate protected label caller"; exit 1;
            }
            source_run="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/$GITHUB_RUN_ID")" || {
              echo "::error::could not authenticate label delivery identity"; exit 1;
            }
            jq -e --arg repo "$TARGET_REPO" --argjson repo_id "$REPOSITORY_ID" \
              --arg head "$EVENT_HEAD_SHA" --arg actor "$REQUEST_ACTOR" '
                .event == "pull_request_target" and .path == ".github/workflows/ai-review-label-rearm.yml" and
                .run_attempt == 1 and .head_sha == $head and
                .head_repository.full_name == $repo and .repository.id == $repo_id and
                .actor.login == $actor
              ' <<<"$source_run" >/dev/null || {
                echo "::error::label delivery source, ref, repository, or actor is not trusted"; exit 1;
              }
            explicit_label_delivery=true
          elif [ "$EVENT_NAME" != pull_request_target ]; then
            echo "::error::unsupported authorization-arm event"; exit 1
          fi

          meta="$(GH_TOKEN="$ACTIONS_TOKEN" gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" \
            --json id,state,isDraft,title,labels,headRefOid,headRepositoryOwner,autoMergeRequest)"
          state="$(jq -r '.state' <<<"$meta")"
          head_sha="$(jq -r '.headRefOid // ""' <<<"$meta")"
          head_owner="$(jq -r '.headRepositoryOwner.login // ""' <<<"$meta")"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::current PR head is unavailable"; exit 1; }
          if [ "$explicit_label_delivery" = true ] && [ "$head_sha" != "$EVENT_HEAD_SHA" ]; then
            echo "::error::label delivery head is stale"; exit 1
          fi
          [ "$state" = OPEN ] || exit 0

          held="$(jq -r '
            ([.labels[].name | ascii_upcase | gsub("[ _-]+";" ")]) as $labels
            | (.isDraft or ($labels | index("HOLD")) or ($labels | index("DO NOT MERGE")) or
               (.title | ascii_upcase | contains("DO NOT MERGE")))
            | if . then "true" else "false" end' <<<"$meta")"
          if [ "$held" = true ]; then
            if [ "$(jq -r '.autoMergeRequest != null' <<<"$meta")" = true ]; then
              pr_id="$(jq -r '.id // ""' <<<"$meta")"
              [ -n "$pr_id" ] || exit 1
              # $id is a GraphQL variable, not shell expansion.
              # shellcheck disable=SC2016
              disable_result="$(GH_TOKEN="$ACTIONS_TOKEN" gh api graphql \
                -f query='mutation($id:ID!){disablePullRequestAutoMerge(input:{pullRequestId:$id}){pullRequest{id}}}' \
                -f id="$pr_id")"
              jq -e --arg id "$pr_id" "
                (.errors? == null) and
                .data.disablePullRequestAutoMerge.pullRequest.id == \$id
              " <<<"$disable_result" >/dev/null || {
                echo "::error::GitHub did not confirm auto-merge was disabled for the expected PR"; exit 1;
              }
              disabled_meta="$(GH_TOKEN="$ACTIONS_TOKEN" gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" \
                --json id,autoMergeRequest)"
              jq -e --arg id "$pr_id" ".id == \$id and .autoMergeRequest == null" \
                <<<"$disabled_meta" >/dev/null || {
                echo "::error::authoritative PR state still reports auto-merge enabled"; exit 1;
              }
            fi
            echo "PR is held or draft; native auto-merge is disabled."
            exit 0
          fi

          explicit_rereview=false
          explicit_ai_review=false
          hold_removed=false
          select_compatible_review_policy() {
            local policy_json="$1" caller_file caller_sha256 selected_json
            caller_file="$(mktemp "${RUNNER_TEMP:-/tmp}/ai-review-caller.XXXXXX")"
            if ! GH_TOKEN="$ACTIONS_TOKEN" gh api \
              "repos/$TARGET_REPO/contents/.github/workflows/ai-review-merge.yml?ref=$DEFAULT_BRANCH" \
              -H 'Accept: application/vnd.github.raw+json' >"$caller_file"; then
              rm -f "$caller_file"
              echo "::error::could not read the protected default-branch review caller" >&2
              return 1
            fi
            caller_sha256="$(sha256sum "$caller_file" | cut -d' ' -f1)"
            rm -f "$caller_file"
            selected_json="$policy_json"
            if [ "$caller_sha256" = 39d9325e5a13b6f1cafb3237a920d1737f9e74b905e70e3ec0fcd5955a7679d6 ]; then
              selected_json="$(jq -ce '
                if .authority == "human"
                   and .provider == "anthropic"
                   and .pricing_version == "anthropic-native-v1"
                   and .fallback_model == ""
                   and .fallback_budget_usd == ""
                   and .explicit_rereview == false
                then {actor,actor_permission,budget_usd,model,pricing_version,provider}
                else error("legacy bootstrap caller accepts only ordinary human-authority Anthropic policy")
                end
              ' <<<"$policy_json")" || return 1
            fi
            printf '%s' "$selected_json" | base64 -w0 | tr '+/' '-_' | tr -d '='
          }
          [ "$explicit_label_delivery" = true ] && [ "$label_normalized" = re-review ] && explicit_rereview=true
          if [ "$explicit_rereview" = true ] && [ "${GITHUB_RUN_ATTEMPT:-1}" -ne 1 ]; then
            echo "::error::an explicit re-review requires a new authorized label event; reruns cannot spend another diagnostic pass"
            exit 1
          fi
          rereview_actor="${REQUEST_ACTOR:-}"
          rereview_label="$(jq -r '[.labels[].name | select((ascii_downcase | gsub("[ _-]+"; "-")) == "re-review")] | first // ""' <<<"$meta")"
          ai_review_label="$(jq -r '[.labels[].name | select((ascii_downcase | gsub("[ _-]+"; "-")) == "ai-review")] | first // ""' <<<"$meta")"
          authorize_ai_review_actor() {
            local actor="$1"
            if ! [[ "$actor" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]]; then
              GH_TOKEN="$ACTIONS_TOKEN" gh pr edit "$PR_NUMBER" --repo "$TARGET_REPO" --remove-label "$ai_review_label" 2>/dev/null || true
              echo "::error::AI review label actor is invalid"; return 1
            fi
            actor_permission="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/collaborators/$actor/permission" --jq '.permission // ""')" || {
              echo "::error::could not authorize AI review actor"; return 1;
            }
            case "$actor_permission" in
              admin|maintain) review_actor="$actor" ;;
              *)
                if ! GH_TOKEN="$ACTIONS_TOKEN" gh pr edit "$PR_NUMBER" --repo "$TARGET_REPO" --remove-label "$ai_review_label"; then
                  echo "::error::unauthorized AI review label could not be removed; future events remain blocked"
                fi
                echo "::error::$actor lacks maintain/admin permission for paid AI review"; return 1 ;;
            esac
          }
          authority="${REVIEW_AUTHORITY:-human}"
          case "$authority" in human|ai-approve|ai-merge) ;; *) echo "::error::AI_REVIEW_AUTHORITY must be human, ai-approve, or ai-merge"; exit 1 ;; esac
          if [ "$explicit_rereview" = true ]; then
            [ -n "$rereview_label" ] || { echo "::error::re-review event does not match current PR labels"; exit 1; }
            review_provider="${REREVIEW_PROVIDER:-}"; review_model="${REREVIEW_MODEL:-}"; review_budget_usd="${REREVIEW_BUDGET_USD:-}"
            fallback_model="${REREVIEW_FALLBACK_MODEL:-}"; fallback_budget_usd="${REREVIEW_FALLBACK_BUDGET_USD:-}"
            if [ -z "$review_provider" ] || [ -z "$review_model" ] || [ -z "$review_budget_usd" ]; then
              echo "::error::explicit re-review policy is not fully configured; refusing before paid dispatch"; exit 1
            fi
            [[ "$rereview_actor" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]] || { echo "::error::re-review actor is invalid"; exit 1; }
            actor_permission="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/collaborators/$rereview_actor/permission" --jq '.permission // ""')" || {
              echo "::error::could not authorize re-review actor"; exit 1;
            }
            case "$actor_permission" in admin|maintain) ;; *) echo "::error::$rereview_actor lacks maintain/admin permission for paid re-review"; exit 1 ;; esac
            review_actor="$rereview_actor"
          else
            review_provider="${PRIMARY_PROVIDER:-anthropic}"; review_model="${PRIMARY_MODEL:-auto}"; review_budget_usd="${PRIMARY_BUDGET_USD:-auto}"
            fallback_model="${PRIMARY_FALLBACK_MODEL:-}"; fallback_budget_usd="${PRIMARY_FALLBACK_BUDGET_USD:-}"
            review_actor=trusted-arm; actor_permission=automation
          fi
          case "$review_provider" in
            anthropic)
              # Repository-level provider selection overrides the inherited
              # organization DeepSeek cascade as one policy unit. Clear stale
              # fallback values before validating and binding the receipt.
              fallback_model=""; fallback_budget_usd=""
              review_pricing_version=anthropic-native-v1
              ;;
            openai)
              if [ "$explicit_rereview" != true ] || [ "$review_model" != gpt-5.6-luna ]; then
                echo "::error::OpenAI gpt-5.6-luna is restricted to explicit re-review"; exit 1
              fi
              fallback_model=""; fallback_budget_usd=""
              review_pricing_version=openai-luna-long-context-2026-08-08
              ;;
            deepseek)
              [ "$review_model" = deepseek-v4-pro ] && [ "$fallback_model" = deepseek-v4-flash ] || {
                echo "::error::DeepSeek cascade must be deepseek-v4-pro then deepseek-v4-flash"; exit 1;
              }
              [ -n "$fallback_budget_usd" ] || { echo "::error::DeepSeek fallback budget is required"; exit 1; }
              review_pricing_version=deepseek-v4-2026-08-10
              ;;
            *) echo "::error::unsupported review provider"; exit 1 ;;
          esac
          if [ "$review_budget_usd" != auto ] && { ! [[ "$review_budget_usd" =~ ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$ ]] || ! awk -v b="$review_budget_usd" 'BEGIN { exit !(b > 0) }'; }; then
            echo "::error::invalid review budget"; exit 1
          fi
          if [ -n "$fallback_budget_usd" ] && { ! [[ "$fallback_budget_usd" =~ ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$ ]] || ! awk -v b="$fallback_budget_usd" 'BEGIN { exit !(b > 0) }'; }; then
            echo "::error::invalid fallback review budget"; exit 1
          fi
          if [ "$explicit_label_delivery" = true ] && [ "$explicit_rereview" = false ]; then
            [ "$label_normalized" = ai-review ] || exit 0
            explicit_ai_review=true
            [ -n "$ai_review_label" ] || { echo "::error::ai-review event does not match current PR labels"; exit 1; }
            authorize_ai_review_actor "$REQUEST_ACTOR" || exit 1
          fi
          review_policy_json="$(jq -cSn --arg provider "$review_provider" --arg model "$review_model" --arg budget_usd "$review_budget_usd" \
            --arg fallback_model "$fallback_model" --arg fallback_budget_usd "$fallback_budget_usd" \
            --arg pricing_version "$review_pricing_version" --arg actor "$review_actor" --arg actor_permission "$actor_permission" --arg authority "$authority" \
            --argjson explicit_rereview "$explicit_rereview" \
            '{provider:$provider,model:$model,budget_usd:$budget_usd,fallback_model:$fallback_model,fallback_budget_usd:$fallback_budget_usd,pricing_version:$pricing_version,actor:$actor,actor_permission:$actor_permission,authority:$authority,explicit_rereview:$explicit_rereview}')"
          review_policy="$(printf '%s' "$review_policy_json" | base64 -w0 | tr '+/' '-_' | tr -d '=')"
          [[ "$review_policy" =~ ^[A-Za-z0-9_-]{1,2048}$ ]] || { echo "::error::review policy envelope is invalid"; exit 1; }
          [ "$EVENT_ACTION" = ready_for_review ] && hold_removed=true
          if [ "$EVENT_ACTION" = edited ]; then
            case "${EVENT_OLD_TITLE^^}" in *'DO NOT MERGE'*) hold_removed=true ;; *) exit 0 ;; esac
          fi
          if [ "$EVENT_ACTION" = unlabeled ]; then
            removed_normalized="$(jq -nr --arg raw_label "$EVENT_LABEL" "\$raw_label | ascii_upcase | gsub(\"[ _-]+\";\" \")")"
            case "$removed_normalized" in HOLD|'DO NOT MERGE') hold_removed=true ;; *) exit 0 ;; esac
          fi

          latest="$(gh api "repos/$TARGET_REPO/commits/$head_sha/check-runs" \
            -H 'Accept: application/vnd.github+json' --jq \
            "[.check_runs[] | select(.name == \"AI review authorization\" and .app.id == $APP_ID and .app.slug == \"$APP_SLUG\")] | sort_by(.id) | last // {}")"
          latest_id="$(jq -r '.id // ""' <<<"$latest")"
          latest_status="$(jq -r '.status // ""' <<<"$latest")"
          latest_conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
          latest_title="$(jq -r '.output.title // ""' <<<"$latest")"

          # BEGIN CROSS-RUN ORPHAN RECOVERY
          recover_orphaned_authorization() {
            local check_json="$1" check_id external_id details_url
            local scheme version receipt_repo receipt_pr receipt_head source_run_id source_attempt nonce extra
            local source_run completed_epoch now_epoch receipt_name artifacts receipt_count receipt_dir receipt_present
            local expected_review_title review_pages owned_reviews owned_count owned_status current patch

            check_id="$(jq -er '.id | select(type == "number" and . > 0)' <<<"$check_json")" || return 1
            external_id="$(jq -er '.external_id | select(type == "string")' <<<"$check_json")" || return 1
            details_url="$(jq -er '.details_url | select(type == "string")' <<<"$check_json")" || return 1
            IFS=: read -r scheme version receipt_repo receipt_pr receipt_head source_run_id source_attempt nonce extra <<<"$external_id"
            [ "$scheme" = ai-review ] && [ "$version" = v1 ] && [ -z "${extra:-}" ] || return 1
            [ "$receipt_repo" = "$TARGET_REPO" ] && [ "$receipt_pr" = "$PR_NUMBER" ] && [ "$receipt_head" = "$head_sha" ] || return 1
            [[ "$source_run_id" =~ ^[1-9][0-9]*$ ]] && [[ "$source_attempt" =~ ^[1-9][0-9]*$ ]] \
              && [[ "$nonce" =~ ^[0-9a-f]{64}$ ]] || return 1
            [ "$source_run_id" != "$GITHUB_RUN_ID" ] || return 10
            [ "$details_url" = "$GITHUB_SERVER_URL/$TARGET_REPO/actions/runs/$source_run_id" ] || return 1

            source_run="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/$source_run_id")" || return 1
            jq -e --arg repo "$TARGET_REPO" --argjson repo_id "$REPOSITORY_ID" \
              --argjson run_id "$source_run_id" --argjson attempt "$source_attempt" '
                .id == $run_id and .run_attempt == $attempt and .status == "completed" and
                .event == "pull_request_target" and .path == ".github/workflows/gate-rearm.yml" and
                .head_repository.full_name == $repo and .repository.id == $repo_id and
                (.completed_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
              ' <<<"$source_run" >/dev/null || return 10
            completed_epoch="$(date -u -d "$(jq -r '.completed_at' <<<"$source_run")" +%s)" || return 1
            now_epoch="$(date -u +%s)"
            [ "$now_epoch" -ge "$completed_epoch" ] || return 1
            # Bound API eventual consistency: a just-accepted workflow dispatch
            # may not be listable immediately after its source arm terminates.
            [ $((now_epoch - completed_epoch)) -ge 300 ] || return 10

            receipt_name="ai-review-arm-$source_run_id-$source_attempt"
            artifacts="$(GH_TOKEN="$ACTIONS_TOKEN" gh api --paginate --slurp \
              "repos/$TARGET_REPO/actions/runs/$source_run_id/artifacts?per_page=100")" || return 1
            receipt_count="$(jq -er --arg name "$receipt_name" '
              [.[].artifacts[] | select(.name == $name and .expired == false)] | length
            ' <<<"$artifacts")" || return 1
            receipt_present=false
            case "$receipt_count" in 0) ;; 1)
              receipt_present=true
              receipt_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ai-orphan-receipt.XXXXXX")" || return 1
              if ! GH_TOKEN="$ACTIONS_TOKEN" gh run download "$source_run_id" --repo "$TARGET_REPO" \
                --name "$receipt_name" --dir "$receipt_dir"; then
                rm -rf "$receipt_dir"; return 1
              fi
              jq -e --arg repo "$TARGET_REPO" --argjson pr "$PR_NUMBER" --arg head "$head_sha" \
                --argjson check "$check_id" --argjson run "$source_run_id" --argjson attempt "$source_attempt" \
                --arg external "$external_id" --arg url "$details_url" --argjson app "$APP_ID" --arg slug "$APP_SLUG" '
                  .repository == $repo and .pr_number == $pr and .head_sha == $head and
                  .check_run_id == $check and .arm_run_id == $run and .arm_run_attempt == $attempt and
                  .external_id == $external and .details_url == $url and .app_id == $app and .app_slug == $slug
                ' "$receipt_dir/receipt.json" >/dev/null || { rm -rf "$receipt_dir"; return 1; }
              rm -rf "$receipt_dir" ;;
              *) return 1 ;;
            esac

            expected_review_title="AI review authorization $check_id from arm $source_run_id.$source_attempt"
            review_pages="$(GH_TOKEN="$ACTIONS_TOKEN" gh api --paginate --slurp \
              "repos/$TARGET_REPO/actions/workflows/ai-review-merge.yml/runs?event=workflow_dispatch&per_page=100")" || return 1
            owned_reviews="$(jq -ce --arg title "$expected_review_title" --arg branch "$DEFAULT_BRANCH" --arg repo "$TARGET_REPO" '
              [.[].workflow_runs[] | select(
                .display_title == $title and .event == "workflow_dispatch" and
                .path == ".github/workflows/ai-review-merge.yml" and .head_branch == $branch and
                .head_repository.full_name == $repo and .repository.full_name == $repo
              )]
            ' <<<"$review_pages")" || return 1
            owned_count="$(jq -r 'length' <<<"$owned_reviews")"
            [ "$owned_count" -le 1 ] || return 1
            if [ "$owned_count" = 1 ]; then
              owned_status="$(jq -r '.[0].status // ""' <<<"$owned_reviews")"
              case "$owned_status" in queued|in_progress|waiting|pending|requested) return 10 ;; completed) ;; *) return 1 ;; esac
            elif [ "$receipt_present" = true ]; then
              # workflow_dispatch has no documented visibility deadline. A
              # published receipt means an accepted but not-yet-listable review
              # could still verify authority and later own this check. Absence
              # from the run listing is therefore never proof of abandonment.
              return 10
            fi

            current="$(GH_TOKEN="$GH_TOKEN" gh api "repos/$TARGET_REPO/check-runs/$check_id")" || return 1
            jq -e --argjson id "$check_id" --argjson app "$APP_ID" --arg slug "$APP_SLUG" \
              --arg external "$external_id" --arg head "$head_sha" '
                .id == $id and .app.id == $app and .app.slug == $slug and .external_id == $external and
                .head_sha == $head and .status == "in_progress" and .conclusion == null
              ' <<<"$current" >/dev/null || return 1
            patch="$(GH_TOKEN="$GH_TOKEN" gh api --method PATCH "repos/$TARGET_REPO/check-runs/$check_id" \
              -f status=completed -f conclusion=failure \
              -f 'output[title]=Orphaned authorization recovered' \
              -f "output[summary]=The source arm is terminal and no active receipt-bound review owns this exact check. Recovery run $GITHUB_RUN_ID closed it without granting authorization.")" || return 1
            jq -e --argjson id "$check_id" --argjson app "$APP_ID" --arg slug "$APP_SLUG" \
              --arg external "$external_id" '
                .id == $id and .app.id == $app and .app.slug == $slug and .external_id == $external and
                .status == "completed" and .conclusion == "failure" and .output.title == "Orphaned authorization recovered"
              ' <<<"$patch" >/dev/null || return 1
          }

          if [ "$hold_removed" = false ] && [ "$explicit_rereview" = false ] && [ "$explicit_ai_review" = false ] \
             && [ "$latest_status" = in_progress ] && [[ "$latest_id" =~ ^[1-9][0-9]*$ ]]; then
            if recover_orphaned_authorization "$latest"; then
              latest_id=''; latest_status=''; latest_conclusion=''; latest_title=''
            else
              recovery_status=$?
              if [ "$recovery_status" = 10 ]; then
                echo "Existing authorization is not provably orphaned; duplicate event is a no-op."
                exit 0
              fi
              echo "::error::pending authorization recovery state is malformed, ambiguous, or unverifiable"
              exit 1
            fi
          elif [ "$hold_removed" = false ] && [ "$explicit_rereview" = false ] && [ "$explicit_ai_review" = false ] \
               && [ "$latest_status" = completed ] && [ "$latest_conclusion" = failure ] \
               && [ "$latest_title" = 'Orphaned authorization recovered' ]; then
            # A prior recovery may have terminated after closing the orphan but
            # before creating its replacement. The exact recovery marker makes
            # a later synchronized rerun idempotently continue that lifecycle.
            jq -e --arg repo "$TARGET_REPO" --arg pr "$PR_NUMBER" --arg head "$head_sha" \
              --arg server "$GITHUB_SERVER_URL" '
                (.external_id | select(type == "string") | split(":")) as $parts |
                ($parts | length == 8) and $parts[0] == "ai-review" and $parts[1] == "v1" and
                $parts[2] == $repo and $parts[3] == $pr and $parts[4] == $head and
                ($parts[5] | test("^[1-9][0-9]*$")) and ($parts[6] | test("^[1-9][0-9]*$")) and
                ($parts[7] | test("^[0-9a-f]{64}$")) and
                .details_url == ($server + "/" + $repo + "/actions/runs/" + $parts[5])
              ' <<<"$latest" >/dev/null || {
                echo "::error::authorization recovery marker is malformed or not bound to the exact head"
                exit 1
              }
            latest_id=''; latest_status=''; latest_conclusion=''; latest_title=''
          fi
          # END CROSS-RUN ORPHAN RECOVERY
          if [ "$hold_removed" = true ] && [[ "$latest_id" =~ ^[1-9][0-9]*$ ]] && [ "$latest_conclusion" = success ]; then
            details_url="$(jq -r '.details_url // ""' <<<"$latest")"
            [[ "$details_url" =~ /actions/runs/([1-9][0-9]*)$ ]] || exit 1
            arm_run_id="${BASH_REMATCH[1]}"
            arm_run_attempt="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/$arm_run_id" --jq '.run_attempt // ""')"
            [[ "$arm_run_attempt" =~ ^[1-9][0-9]*$ ]] || exit 1
            receipt_name="ai-review-arm-$arm_run_id-$arm_run_attempt"
            receipt_count="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/$arm_run_id/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"$receipt_name\" and .expired == false)] | length")"
            [ "$receipt_count" = 1 ] || {
              echo "::error::the approved head's arm receipt expired or is ambiguous; an administrator must restore independently verified authorization without dispatching another model review"
              exit 1
            }
            receipt_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/ai-repromotion.XXXXXX")"
            trap 'rm -rf "$receipt_dir"' EXIT
            GH_TOKEN="$ACTIONS_TOKEN" gh run download "$arm_run_id" --repo "$TARGET_REPO" \
              --name "$receipt_name" --dir "$receipt_dir"
            [ -f "$receipt_dir/receipt.json" ] || exit 1
            review_policy="$(jq -er '.review_policy | select(type == "string")' "$receipt_dir/receipt.json")"
            [[ "$review_policy" =~ ^[A-Za-z0-9_-]{1,2048}$ ]] || exit 1
            [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
            GH_TOKEN="$ACTIONS_TOKEN" gh workflow run ai-privileged-merge.yml --repo "$TARGET_REPO" --ref "$DEFAULT_BRANCH" \
              -f pr_number="$PR_NUMBER" -f expected_head_sha="$head_sha" -f authorization_check_id="$latest_id" \
              -f arm_run_id="$arm_run_id" -f arm_run_attempt="$arm_run_attempt" -f review_policy="$review_policy"
            exit 0
          fi
          if [ "$hold_removed" = true ]; then
            if [[ "$latest_id" =~ ^[1-9][0-9]*$ ]] && [ "$latest_status" = in_progress ]; then
              pending_guidance='The existing AI review authorization for this exact head is still in progress. Wait for that review; do not add re-review, because it could incur a second model charge. If the linked arm run is stalled, an administrator must recover it without dispatching another model review.'
              details_url="$(jq -r '.details_url // ""' <<<"$latest")"
              if [[ "$details_url" =~ ^${GITHUB_SERVER_URL}/${TARGET_REPO}/actions/runs/([1-9][0-9]*)$ ]]; then
                arm_run_id="${BASH_REMATCH[1]}"
                arm_run="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/$arm_run_id")"
                arm_run_attempt="$(jq -r '.run_attempt // ""' <<<"$arm_run")"
                receipt_name="ai-review-arm-$arm_run_id-$arm_run_attempt"
                receipt_count="$(GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/$TARGET_REPO/actions/runs/$arm_run_id/artifacts?per_page=100" \
                  --jq "[.artifacts[] | select(.name == \"$receipt_name\" and .expired == false)] | length")"
                if jq -e --arg repo "$TARGET_REPO" '
                    .event == "pull_request_target" and
                    .path == ".github/workflows/gate-rearm.yml" and
                    .head_repository.full_name == $repo and
                    (.run_attempt | type == "number")
                  ' <<<"$arm_run" >/dev/null && [ "$receipt_count" = 1 ]; then
                  notice_body="$(printf '<!-- ai-review-hold-clear:%s -->\n%s' "$head_sha" "$pending_guidance")"
                  GH_TOKEN="$ACTIONS_TOKEN" gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" \
                    --body "$notice_body"
                  exit 0
                fi
              fi
              notice_body="$(printf '<!-- ai-review-hold-clear:%s -->\n%s' "$head_sha" \
                'The pending authorization cannot be tied to a live exact arm receipt. An administrator must recover the authorization without dispatching another model review.')"
              GH_TOKEN="$ACTIONS_TOKEN" gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" \
                --body "$notice_body"
              exit 1
            fi
            notice_body="$(printf '<!-- ai-review-hold-clear:%s -->\n%s' "$head_sha" \
              'This exact head has no successful AI review authorization. Add the re-review label only when you intentionally approve another paid review; hold removal never reruns the model automatically.')"
            GH_TOKEN="$ACTIONS_TOKEN" gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" \
              --body "$notice_body"
            exit 0
          fi
          if [ "$explicit_rereview" = false ] && [ "$explicit_ai_review" = false ] && [[ "$latest_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "Authorization already exists for $head_sha; duplicate event is a no-op."
            exit 0
          fi

          review_policy="$(select_compatible_review_policy "$review_policy_json")" || exit 1
          [[ "$review_policy" =~ ^[A-Za-z0-9_-]{1,2048}$ ]] || { echo "::error::compatible review policy envelope is invalid"; exit 1; }

          nonce="$(openssl rand -hex 32)"
          [[ "$nonce" =~ ^[0-9a-f]{64}$ ]] || exit 1
          external_id="ai-review:v1:$TARGET_REPO:$PR_NUMBER:$head_sha:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$nonce"
          details_url="$GITHUB_SERVER_URL/$TARGET_REPO/actions/runs/$GITHUB_RUN_ID"
          payload="$(jq -nc --arg name 'AI review authorization' --arg sha "$head_sha" \
            --arg external_id "$external_id" --arg url "$details_url" \
            '{name:$name,head_sha:$sha,external_id:$external_id,status:"in_progress",details_url:$url,
              output:{title:"AI review pending",summary:"Trusted review is running for this exact head."}}')"
          check="$(gh api --method POST "repos/$TARGET_REPO/check-runs" --input - <<<"$payload")"
          check_id="$(jq -r '.id // ""' <<<"$check")"
          [[ "$check_id" =~ ^[1-9][0-9]*$ ]] || exit 1
          jq -e --argjson app_id "$APP_ID" --arg slug "$APP_SLUG" --arg external_id "$external_id" \
            '.app.id == $app_id and .app.slug == $slug and .external_id == $external_id' <<<"$check" >/dev/null || exit 1

          if [ "$head_owner" != "$GITHUB_REPOSITORY_OWNER" ]; then
            gh api --method PATCH "repos/$TARGET_REPO/check-runs/$check_id" -f status=completed -f conclusion=failure \
              -f 'output[title]=Fork review requires a maintainer' \
              -f 'output[summary]=Secret-backed autonomous review is disabled for fork repositories.'
            exit 1
          fi

          receipt_dir="$RUNNER_TEMP/ai-review-arm-receipt"
          mkdir -m 700 "$receipt_dir"
          jq -nc --arg repository "$TARGET_REPO" --argjson pr_number "$PR_NUMBER" --arg head_sha "$head_sha" \
            --argjson check_run_id "$check_id" --argjson arm_run_id "$GITHUB_RUN_ID" \
            --argjson arm_run_attempt "$GITHUB_RUN_ATTEMPT" --arg nonce "$nonce" --arg external_id "$external_id" \
            --arg details_url "$details_url" --argjson app_id "$APP_ID" --arg app_slug "$APP_SLUG" \
            --arg review_policy "$review_policy" --arg delivery_event "$EVENT_NAME" --arg delivery_actor "$REQUEST_ACTOR" \
            --arg workflow_ref "$WORKFLOW_REF" --arg workflow_sha "$WORKFLOW_SHA" \
            --argjson source_bound "$explicit_label_delivery" \
            '{schema:(if $source_bound then 2 else 1 end),repository:$repository,pr_number:$pr_number,head_sha:$head_sha,check_run_id:$check_run_id,
              arm_run_id:$arm_run_id,arm_run_attempt:$arm_run_attempt,nonce:$nonce,external_id:$external_id,
              details_url:$details_url,app_id:$app_id,app_slug:$app_slug,review_policy:$review_policy}
             | if $source_bound then
                 . + {delivery_event:$delivery_event,delivery_actor:$delivery_actor,
                      workflow_ref:$workflow_ref,workflow_sha:$workflow_sha}
               else . end' >"$receipt_dir/receipt.json"
          {
            echo "check_id=$check_id"
            echo "head_sha=$head_sha"
            echo "explicit_rereview=$explicit_rereview"
            echo "explicit_ai_review=$explicit_ai_review"
            echo "receipt_name=ai-review-arm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "review_policy=$review_policy"
          } >>"$GITHUB_OUTPUT"

      - name: Upload immutable arm receipt
        if: steps.arm.outputs.check_id != ''
        id: receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.arm.outputs.receipt_name }}
          path: ${{ runner.temp }}/ai-review-arm-receipt/receipt.json
          if-no-files-found: error
          # GitHub's repository maximum keeps authorization recoverable across
          # long-lived holds without paying for another same-head model review.
          retention-days: 90

      - name: Dispatch trusted review after receipt publication
        id: dispatch
        if: steps.arm.outputs.check_id != ''
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECK_ID: ${{ steps.arm.outputs.check_id }}
          EXPECTED_HEAD_SHA: ${{ steps.arm.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$DEFAULT_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || exit 1
          fail_authorization() {
            local title="$1" summary="$2"
            GH_TOKEN="$APP_TOKEN" gh api --method PATCH "repos/$TARGET_REPO/check-runs/$CHECK_ID" \
              -f status=completed -f conclusion=failure \
              -f "output[title]=$title" -f "output[summary]=$summary"
          }
          authorization_label=''
          if [ "${{ steps.arm.outputs.explicit_rereview || false }}" = true ]; then
            authorization_label=re-review
          elif [ "${{ steps.arm.outputs.explicit_ai_review || false }}" = true ]; then
            authorization_label=ai-review
          fi
          if [ -n "$authorization_label" ]; then
            # Consuming the authorization label is a precondition for spend.
            # A failed edit is acceptable only when an authoritative reread
            # proves the label is already absent (for example, a racing event).
            gh pr edit "$PR_NUMBER" --repo "$TARGET_REPO" --remove-label "$authorization_label" 2>/dev/null || true
            if ! remaining_labels="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json labels)" ||
               ! jq -e '.labels | type == "array" and all(.[]; .name | type == "string")' <<<"$remaining_labels" >/dev/null; then
              fail_authorization 'Review label consumption unverified' \
                'The trusted arm could not verify that the authorization label was consumed; no review was dispatched.'
              exit 1
            fi
            if jq -e --arg expected "$authorization_label" \
              'any(.labels[]; (.name | ascii_downcase | gsub("[ _-]+"; "-")) == $expected)' <<<"$remaining_labels" >/dev/null; then
              fail_authorization 'Review label consumption failed' \
                'The authorization label remains applied, so dispatch was refused before provider spend.'
              exit 1
            fi
          fi
          if ! gh workflow run ai-review-merge.yml --repo "$TARGET_REPO" --ref "$DEFAULT_BRANCH" \
            -f pr_number="$PR_NUMBER" -f expected_head_sha="$EXPECTED_HEAD_SHA" \
            -f authorization_check_id="$CHECK_ID" -f arm_run_id="$GITHUB_RUN_ID" \
            -f arm_run_attempt="$GITHUB_RUN_ATTEMPT" -f explicit_rereview="${{ steps.arm.outputs.explicit_rereview || false }}" \
            -f review_policy="${{ steps.arm.outputs.review_policy }}"; then
            fail_authorization 'Review dispatch failed' \
              'The trusted review workflow could not be dispatched.'
            exit 1
          fi

      # The check-run is created before the receipt is published, so a failure
      # between the two -- an artifact-quota rejection, for example -- leaves a
      # required check pending forever: no review was dispatched, so nothing
      # else ever completes it, and ADR 0081's promotion retry deliberately
      # waits on a pending required check instead of resolving one. Give that
      # check-run a terminal state here. This can only ever write a failure, so
      # it cannot grant authorization, and it never touches a check-run that a
      # dispatched review or an earlier failure path already owns.
      - name: Complete the authorization when no review was dispatched
        if: always() && steps.arm.outputs.check_id != '' && steps.dispatch.outcome != 'success'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CHECK_ID: ${{ steps.arm.outputs.check_id }}
        run: |
          set -euo pipefail
          [[ "$CHECK_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          status="$(GH_TOKEN="$APP_TOKEN" gh api "repos/$TARGET_REPO/check-runs/$CHECK_ID" --jq '.status // ""')"
          [ "$status" = in_progress ] || exit 0
          GH_TOKEN="$APP_TOKEN" gh api --method PATCH "repos/$TARGET_REPO/check-runs/$CHECK_ID" \
            -f status=completed -f conclusion=failure \
            -f 'output[title]=Authorization receipt unavailable' \
            -f 'output[summary]=The immutable arm receipt was not published, so no trusted review was dispatched and no model charge was incurred. Rerun this arm run to recover the authorization; do not add the re-review label.'
