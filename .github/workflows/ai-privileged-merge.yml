name: AI privileged merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      source_run_id:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-privileged-merge-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  privileged_merge:
    runs-on: ${{ github.repository_owner == 'Verjson' && fromJSON(vars.VERJSON_RUNNER_ISOLATED || vars.VERJSON_RUNNER_DEFAULT || '["self-hosted","gate"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      TARGET_REPO: ${{ github.repository }}
      TARGET_OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
    steps:
      - name: Privileged merge from trusted metadata only
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::trusted merge has no ORG_ADMIN_TOKEN"
            exit 1
          fi
          if [[ ! "$TARGET_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] ||
             [ "${TARGET_REPO%%/*}" != "$TARGET_OWNER" ] ||
             [ "$TARGET_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::target repository identity mismatch"
            exit 1
          fi
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::invalid PR identity or expected head SHA"
            exit 1
          fi

          trusted_workflow_id="$(gh api repos/Verjson/.github/actions/workflows/ai-review-merge.yml --jq .id)"
          trusted_workflow_sha="$(gh api repos/Verjson/.github/commits/main --jq .sha)"
          [[ "$trusted_workflow_id" =~ ^[1-9][0-9]*$ ]] ||
            { echo "::error::trusted workflow identity is unavailable"; exit 1; }
          [[ "$trusted_workflow_sha" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::trusted workflow revision is unavailable"; exit 1; }

          newest_trusted_gate_run() {
            gh api "repos/$TARGET_REPO/actions/runs?head_sha=$EXPECTED_HEAD_SHA&event=pull_request&per_page=100" |
              jq -ce --argjson id "$trusted_workflow_id" --arg sha "$trusted_workflow_sha" '
                [.workflow_runs[] |
                  select(
                    (.workflow_id == $id) or
                    any(.referenced_workflows[]?;
                      (.path | startswith("Verjson/.github/.github/workflows/ai-review-merge.yml@")) and
                      .sha == $sha)
                  )] |
                sort_by([(.created_at // ""), .id]) |
                last // empty
              '
          }

          dispatched_gate_run() {
            local run
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || return 1
            run="$(gh api "repos/$TARGET_REPO/actions/runs/$SOURCE_RUN_ID")" || return 1
            jq -ce --argjson id "$trusted_workflow_id" --arg repo "$TARGET_REPO" '
              select(.workflow_id == $id and .event == "workflow_dispatch" and
                .repository.full_name == $repo)
            ' <<<"$run"
          }

          attestation_for_run() {
            local run_id="$1" artifacts artifact_id archive payload
            artifacts="$(gh api "repos/$TARGET_REPO/actions/runs/$run_id/artifacts?per_page=100")" || return 1
            artifact_id="$(jq -r --arg name "merge-attestation-$run_id" '
              [.artifacts[] | select(.name == $name and .expired == false)] |
              if length == 1 then .[0].id else 0 end
            ' <<<"$artifacts")"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || return 1
            archive="$RUNNER_TEMP/merge-attestation-$run_id.zip"
            gh api "repos/$TARGET_REPO/actions/artifacts/$artifact_id/zip" >"$archive" || return 1
            payload="$(unzip -p "$archive" attestation.json 2>/dev/null)" || return 1
            jq -ce --arg repo "$TARGET_REPO" --argjson pr "$PR_NUMBER" \
              --arg head "$EXPECTED_HEAD_SHA" --argjson run "$run_id" '
                select(
                  .version == 1 and .repository == $repo and .pr_number == $pr and
                  .head_sha == $head and .run_id == $run and
                  (.followups | type == "array" and length <= 50) and
                  all(.followups[]; type == "object" and
                    (.location | type == "string" and length <= 500) and
                    (.note | type == "string" and length > 0 and length <= 5000))
                )
              ' <<<"$payload"
          }

          workflow_files_changed() {
            local files
            files="$(gh api --paginate "repos/$TARGET_REPO/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[].filename')" || return 2
            grep -qE '^\.github/workflows/' <<<"$files"
          }

          for attempt in $(seq 1 80); do
            meta="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" \
              --json headRefOid,isDraft,labels,state,statusCheckRollup)"
            current_head="$(jq -r '.headRefOid // ""' <<<"$meta")"
            [ "$current_head" = "$EXPECTED_HEAD_SHA" ] ||
              { echo "::error::stale head"; exit 1; }
            [ "$(jq -r '.state // ""' <<<"$meta")" = "OPEN" ] ||
              { echo "::error::PR is no longer open"; exit 1; }
            jq -e '.isDraft | not' <<<"$meta" >/dev/null ||
              { echo "::error::PR is draft"; exit 1; }
            jq -e '([.labels[].name | ascii_upcase | gsub("[ _-]+";" ")] |
              (index("HOLD") or index("DO NOT MERGE")) | not)' <<<"$meta" >/dev/null ||
              { echo "::error::PR is held"; exit 1; }

            file_guard_rc=0
            workflow_files_changed || file_guard_rc=$?
            if [ "$file_guard_rc" -eq 2 ]; then
              echo "::error::could not inspect the complete PR file list"
              exit 1
            fi
            if [ "$file_guard_rc" -eq 0 ]; then
              echo "::notice::workflow files changed; privileged auto-merge skipped; human review and merge required"
              exit 0
            fi

            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              gate_run="$(dispatched_gate_run || true)"
            else
              gate_run="$(newest_trusted_gate_run || true)"
            fi
            provenance=pending
            if [ -n "$gate_run" ]; then
              gate_run_id="$(jq -r '.id // 0' <<<"$gate_run")"
              gate_conclusion="$(jq -r '.conclusion // "pending"' <<<"$gate_run")"
              if [ "$gate_conclusion" != "pending" ] && [ "$gate_conclusion" != "success" ]; then
                echo "::error::newest trusted gate run failed"
                exit 1
              fi
              if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
                 [ "$gate_conclusion" = "success" ] &&
                 attestation="$(attestation_for_run "$gate_run_id")"; then
                provenance=trusted
              elif [ "$gate_conclusion" = "success" ] &&
                 jq -e --arg needle "/actions/runs/$gate_run_id/" '
                   any(.statusCheckRollup[]?;
                     (.name // .context) == "gate" and
                     (.conclusion // .state) == "SUCCESS" and
                     ((.detailsUrl // "") | contains($needle)))
                 ' <<<"$meta" >/dev/null &&
                 attestation="$(attestation_for_run "$gate_run_id")"; then
                provenance=trusted
              fi
            fi

            failed="$(jq '[.statusCheckRollup[]? |
              select((.name // .context) as $n | $n != "preflight" and $n != "gate" and $n != "privileged_merge") |
              select(if .state then
                ((.state // "") | IN("SUCCESS","PENDING","EXPECTED") | not)
              else
                (.status == "COMPLETED" and ((.conclusion // "") | IN("SUCCESS","NEUTRAL","SKIPPED") | not))
              end)] | length' <<<"$meta")"
            pending="$(jq '[.statusCheckRollup[]? |
              select((.name // .context) as $n | $n != "preflight" and $n != "gate" and $n != "privileged_merge") |
              select(if .state then (.state | IN("PENDING","EXPECTED")) else .status != "COMPLETED" end)] | length' <<<"$meta")"
            [ "$failed" -eq 0 ] || { echo "::error::required check failed"; exit 1; }
            if [ "${provenance:-pending}" = trusted ] && [ "$pending" -eq 0 ]; then break; fi
            [ "$attempt" -lt 80 ] || { echo "::error::trusted gate/checks did not become green"; exit 1; }
            sleep 30
          done

          final="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" \
            --json headRefOid,isDraft,labels,state,statusCheckRollup)"
          [ "$(jq -r '.headRefOid // ""' <<<"$final")" = "$EXPECTED_HEAD_SHA" ] ||
            { echo "::error::head changed before merge"; exit 1; }
          [ "$(jq -r '.state // ""' <<<"$final")" = "OPEN" ] ||
            { echo "::error::PR closed before merge"; exit 1; }
          jq -e '.isDraft | not' <<<"$final" >/dev/null ||
            { echo "::error::PR became draft"; exit 1; }
          jq -e '([.labels[].name | ascii_upcase | gsub("[ _-]+";" ")] |
            (index("HOLD") or index("DO NOT MERGE")) | not)' <<<"$final" >/dev/null ||
            { echo "::error::PR became held"; exit 1; }
          file_guard_rc=0
          workflow_files_changed || file_guard_rc=$?
          if [ "$file_guard_rc" -eq 2 ]; then
            echo "::error::could not re-inspect the complete PR file list"
            exit 1
          fi
          if [ "$file_guard_rc" -eq 0 ]; then
            echo "::notice::workflow files changed before merge; privileged auto-merge skipped; human review and merge required"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            final_gate_run="$(dispatched_gate_run || true)"
          else
            final_gate_run="$(newest_trusted_gate_run || true)"
          fi
          [ -n "$final_gate_run" ] ||
            { echo "::error::trusted gate disappeared before merge"; exit 1; }
          final_gate_id="$(jq -r '.id // 0' <<<"$final_gate_run")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            attested_run_id="$SOURCE_RUN_ID"
            [ "$(jq -r '.conclusion // ""' <<<"$final_gate_run")" = "success" ] &&
              attestation="$(attestation_for_run "$attested_run_id")" ||
              { echo "::error::trusted dispatched gate changed before merge"; exit 1; }
          else
            attested_run_id="$final_gate_id"
            [ "$(jq -r '.conclusion // ""' <<<"$final_gate_run")" = "success" ] &&
            jq -e --arg needle "/actions/runs/$final_gate_id/" '
              any(.statusCheckRollup[]?;
                (.name // .context) == "gate" and
                (.conclusion // .state) == "SUCCESS" and
                ((.detailsUrl // "") | contains($needle)))
            ' <<<"$final" >/dev/null ||
            { echo "::error::newest trusted gate changed before merge"; exit 1; }
            attestation="$(attestation_for_run "$attested_run_id")" ||
              { echo "::error::trusted attestation changed before merge"; exit 1; }
          fi
          final_failed="$(jq '[.statusCheckRollup[]? |
            select((.name // .context) as $n | $n != "preflight" and $n != "gate" and $n != "privileged_merge") |
            select(if .state then
              ((.state // "") | IN("SUCCESS","PENDING","EXPECTED") | not)
            else
              (.status == "COMPLETED" and ((.conclusion // "") | IN("SUCCESS","NEUTRAL","SKIPPED") | not))
            end)] | length' <<<"$final")"
          final_pending="$(jq '[.statusCheckRollup[]? |
            select((.name // .context) as $n | $n != "preflight" and $n != "gate" and $n != "privileged_merge") |
            select(if .state then (.state | IN("PENDING","EXPECTED")) else .status != "COMPLETED" end)] | length' <<<"$final")"
          [ "$final_failed" -eq 0 ] && [ "$final_pending" -eq 0 ] ||
            { echo "::error::checks changed before merge"; exit 1; }

          gh pr merge "$PR_NUMBER" --repo "$TARGET_REPO" --squash --admin \
            --delete-branch --match-head-commit "$EXPECTED_HEAD_SHA"

          # The exact run-bound artifact was shape-validated twice above and is
          # data only: it is never sourced, executed, or extracted to a worktree.
          followups="$(jq -c .followups <<<"$attestation")"
          jq -c '.[]' <<<"$followups" | while IFS= read -r item; do
            location="$(jq -r .location <<<"$item")"
            note="$(jq -r .note <<<"$item")"
            marker="<!-- ai-review-followup:pr${PR_NUMBER}:$(printf '%s' "$location"$'\n'"$note" | sha256sum | cut -c1-12) -->"
            existing="$(gh issue list --repo "$TARGET_REPO" --state all --search "$marker in:body" --json number --jq 'length' 2>/dev/null || echo 0)"
            [ "$existing" -gt 0 ] && continue
            gh issue create --repo "$TARGET_REPO" \
              --title "AI-review follow-up: ${location:0:70}" \
              --body "$marker

          Non-blocking finding from merged PR #$PR_NUMBER at \`$location\`:

          $note" >/dev/null || echo "::warning::could not file follow-up for $location"
          done
