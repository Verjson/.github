name: AI privileged merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      source_run_id:
        required: true
        type: string
  workflow_call:
    # Hybrid, mirroring ai-review-merge.yml: this file is both the canonical
    # reusable AND .github's own workflow. Consumers call it as a thin caller
    # (ADR 0022) generated by scripts/gen-privileged-merge-caller.sh.
    #
    # The identity inputs are optional because the event supplies them on a
    # pull_request_target-triggered caller; the generated caller forwards them
    # explicitly with the event value winning, so the anti-TOCTOU binding to the
    # attested head holds on both paths.
    inputs:
      pr_number:
        description: PR number to merge; defaults to the caller's pull_request event
        required: false
        type: string
      expected_head_sha:
        description: Head SHA the gate attested; defaults to the caller's event
        required: false
        type: string
      source_run_id:
        description: Gate run id this continuation was dispatched from
        required: false
        type: string
      runner_labels:
        description: 'JSON array of runs-on labels for the caller''s own fleet, e.g. ["self-hosted","gate"] (required — a consumer org has no runner for Verjson''s isolated pool)'
        required: true
        type: string
    # Declared explicitly rather than relying on `secrets: inherit`. A caller
    # using inherit hands its ENTIRE secret store to a workflow that floats on
    # @main; naming the one secret needed bounds that, and a caller that cannot
    # supply it fails at the call rather than deep inside the merge.
    secrets:
      ORG_ADMIN_TOKEN:
        description: Org-scoped token with merge authority on the target repository
        required: true

permissions:
  contents: read

# Keyed by event as well as PR. Both the pull_request_target check and the
# dispatched continuation act on the same PR, and with a shared group plus
# cancel-in-progress the newer dispatch CANCELLED the older check — leaving a
# red `privileged_merge` on a PR that had merged successfully (ADR 0039).
# Separating them lets both reach a terminal state.
#
# That means both can be live at once. The state re-validation before the merge
# is NOT atomic with it, so the loser of that race is handled explicitly at the
# merge call rather than assumed away — see the comment there. Same-event runs
# still supersede each other, which is what cancel-in-progress is for.
#
# A thin caller must NOT reuse this group name. A called workflow's concurrency
# is evaluated in the caller's context, so an identical group would have the
# reusable's job contend with the caller job that invoked it. (Reasoned from
# job/group lifetimes, not reproduced — the distinct name avoids the question.)
concurrency:
  group: ai-privileged-merge-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  privileged_merge:
    # `runner_labels` first, mirroring ai-review-merge.yml: a consumer org has no
    # runner for Verjson's isolated pool, so inheriting it would queue the job
    # forever on labels nothing matches (#130). Required on workflow_call so the
    # call fails immediately with a clear message instead.
    runs-on: ${{ inputs.runner_labels && fromJSON(inputs.runner_labels) || github.repository_owner == 'Verjson' && fromJSON(vars.VERJSON_RUNNER_ISOLATED || vars.VERJSON_RUNNER_DEFAULT || '["self-hosted","gate"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      RUNNER_LABELS: ${{ inputs.runner_labels }}
      TARGET_REPO: ${{ github.repository }}
      TARGET_OWNER: ${{ github.repository_owner }}
      GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
    steps:
      - name: Privileged merge from trusted metadata only
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::trusted merge has no ORG_ADMIN_TOKEN"
            exit 1
          fi

          # Validate runner_labels HERE, not only in the generator. The generator
          # is a convenience; this workflow is the trust boundary, and
          # `required: true` guarantees only that the input was SUPPLIED, not
          # that it is a usable label array. A caller that drifted from
          # generation is precisely the threat model.
          if [ -n "${RUNNER_LABELS:-}" ]; then
            jq -e 'type == "array" and length > 0
                   and all(.[]; type == "string" and test("^[A-Za-z0-9._-]+$"))' \
              <<<"$RUNNER_LABELS" >/dev/null 2>&1 ||
              { echo "::error::runner_labels must be a non-empty JSON array of simple label strings"; exit 1; }
          fi
          if [[ ! "$TARGET_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] ||
             [ "${TARGET_REPO%%/*}" != "$TARGET_OWNER" ] ||
             [ "$TARGET_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::target repository identity mismatch"
            exit 1
          fi
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::invalid PR identity or expected head SHA"
            exit 1
          fi

          trusted_workflow_id="$(gh api repos/Verjson/.github/actions/workflows/ai-review-merge.yml --jq .id)"
          trusted_workflow_sha="$(gh api repos/Verjson/.github/commits/main --jq .sha)"
          [[ "$trusted_workflow_id" =~ ^[1-9][0-9]*$ ]] ||
            { echo "::error::trusted workflow identity is unavailable"; exit 1; }
          [[ "$trusted_workflow_sha" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::trusted workflow revision is unavailable"; exit 1; }
          trusted_repository_id="$(gh api repos/Verjson/.github --jq .id)"
          trusted_workflow_path=.github/workflows/ai-review-merge.yml
          trusted_required_url="https://api.github.com/repos/$TARGET_REPO/actions/required_workflows/"
          [[ "$trusted_repository_id" =~ ^[1-9][0-9]*$ ]] ||
            { echo "::error::trusted workflow repository is unavailable"; exit 1; }
          # Bounded wait: ~40 minutes at 30s. Overridable only so the extracted-script
          # contract tests can reach the terminal state; no workflow env sets it.
          # Every guard still runs on every iteration, so the worst a tampered
          # value could do within 1..200 is shorten the wait — fail-closed, never
          # a trust bypass — and `timeout-minutes: 45` caps the other end.
          merge_wait_attempts="${MERGE_WAIT_ATTEMPTS:-80}"
          [[ "$merge_wait_attempts" =~ ^[1-9][0-9]*$ ]] && [ "$merge_wait_attempts" -le 200 ] ||
            { echo "::error::invalid merge wait bound"; exit 1; }

          # A gate run is trusted in exactly three installation shapes: this
          # repository running its own workflow, a caller of the pinned reusable
          # workflow, and an organization-ruleset *required workflow*. The third
          # shape carries a repository-scoped workflow_id and no
          # referenced_workflows, so it is identified by its required-workflow
          # URL plus the trusted source path, and only while
          # `required_workflow_source_trusted` holds for the PR base branch.
          trusted_run_def='
            def trusted_run:
              (.workflow_id == $id) or
              any(.referenced_workflows[]?;
                (.path | startswith("Verjson/.github/.github/workflows/ai-review-merge.yml@")) and
                .sha == $sha) or
              ($required and (.path == $wfpath) and
                ((.workflow_url // "") | ltrimstr($wfurl) | test("^[0-9]+$")));
          '

          # The organization ruleset is the trust anchor for the required-workflow
          # shape: a repository admin cannot mint an Organization-sourced rule.
          # Every rule mandating a workflow at the trusted path must name the
          # trusted repository at refs/heads/main, so a same-path impostor added
          # by any other ruleset withdraws trust instead of inheriting it.
          required_workflow_source_trusted() {
            local base_ref="$1" rules
            [[ "$base_ref" =~ ^[A-Za-z0-9._/-]+$ ]] || return 1
            [[ "$base_ref" != *..* ]] || return 1
            # The "no impostor at this path" invariant is only sound over the
            # complete rule set, and this endpoint paginates. `--paginate` streams
            # one array per page and `jq -s` collects them; `--slurp` is not
            # available on the governed runner (ADR 0037). A page that is not an
            # array, or a body that yields nothing, is unusable, not empty.
            # `base_ref` goes into the path unencoded. A branch containing `/` is
            # fine for this endpoint, and any 4xx leaves the shape untrusted rather
            # than trusted, so a PR based off a branch the org ruleset does not
            # target simply falls back to the other two matchers.
            rules="$(gh api --paginate "repos/$TARGET_REPO/rules/branches/$base_ref?per_page=100" |
              jq -s '[.[] | if type == "array" then .[]
                            else error("unusable rules page") end]')" || return 1
            [ -n "$rules" ] || return 1
            jq -e --argjson repo_id "$trusted_repository_id" \
              --arg wfpath "$trusted_workflow_path" --arg owner "$TARGET_OWNER" '
                if type != "array" then false else
                  [.[] | select(.type == "workflows") | . as $rule |
                    .parameters.workflows[]? | select(.path == $wfpath) |
                    {source_type: $rule.ruleset_source_type, source: $rule.ruleset_source,
                     repository_id: .repository_id, ref: .ref}] as $entries |
                  ($entries | length) > 0 and
                  all($entries[];
                    .source_type == "Organization" and .source == $owner and
                    .repository_id == $repo_id and .ref == "refs/heads/main")
                end
              ' <<<"$rules" >/dev/null
          }

          resolve_base_ref() {
            local attempt ref
            for attempt in 1 2 3; do
              ref="$(gh api "repos/$TARGET_REPO/pulls/$PR_NUMBER" --jq .base.ref || true)"
              if [ -n "$ref" ] && [ "$ref" != "null" ]; then printf '%s' "$ref"; return 0; fi
              if [ "$attempt" -lt 3 ]; then sleep 5; fi
            done
            return 1
          }

          newest_trusted_gate_run() {
            gh api "repos/$TARGET_REPO/actions/runs?head_sha=$EXPECTED_HEAD_SHA&event=pull_request&per_page=100" |
              jq -ce --argjson id "$trusted_workflow_id" --arg sha "$trusted_workflow_sha" \
                --arg wfpath "$trusted_workflow_path" \
                --arg wfurl "$trusted_required_url" \
                --argjson required "$required_workflow_trusted" \
                "$trusted_run_def"'
                  [.workflow_runs[] | select(trusted_run)] |
                  sort_by([(.created_at // ""), .id]) |
                  last // empty
                '
          }

          # The dispatcher hands over its own gate run, which is triggered by
          # `pull_request` (or `workflow_dispatch` on a manual re-gate) — never by
          # the dispatch itself. The run must also be bound to the expected head.
          dispatched_gate_run() {
            local run
            [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || return 1
            run="$(gh api "repos/$TARGET_REPO/actions/runs/$SOURCE_RUN_ID")" || return 1
            jq -ce --argjson id "$trusted_workflow_id" --arg sha "$trusted_workflow_sha" \
              --arg wfpath "$trusted_workflow_path" \
              --arg wfurl "$trusted_required_url" \
              --argjson required "$required_workflow_trusted" \
              --arg repo "$TARGET_REPO" --arg head "$EXPECTED_HEAD_SHA" \
              "$trusted_run_def"'
                select(trusted_run and
                  (.event | IN("pull_request", "workflow_dispatch")) and
                  .repository.full_name == $repo and
                  .head_sha == $head)
              ' <<<"$run"
          }

          attestation_for_run() {
            local run_id="$1" artifacts artifact_id archive payload
            artifacts="$(gh api "repos/$TARGET_REPO/actions/runs/$run_id/artifacts?per_page=100")" || return 1
            artifact_id="$(jq -r --arg name "merge-attestation-$run_id" '
              [.artifacts[] | select(.name == $name and .expired == false)] |
              if length == 1 then .[0].id else 0 end
            ' <<<"$artifacts")"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || return 1
            archive="$RUNNER_TEMP/merge-attestation-$run_id.zip"
            gh api "repos/$TARGET_REPO/actions/artifacts/$artifact_id/zip" >"$archive" || return 1
            payload="$(unzip -p "$archive" attestation.json 2>/dev/null)" || return 1
            jq -ce --arg repo "$TARGET_REPO" --argjson pr "$PR_NUMBER" \
              --arg head "$EXPECTED_HEAD_SHA" --argjson run "$run_id" '
                select(
                  .version == 1 and .repository == $repo and .pr_number == $pr and
                  .head_sha == $head and .run_id == $run and
                  (.followups | type == "array" and length <= 50) and
                  all(.followups[]; type == "object" and
                    (.location | type == "string" and length <= 500) and
                    (.note | type == "string" and length > 0 and length <= 5000))
                )
              ' <<<"$payload"
          }

          workflow_files_changed() {
            local files
            files="$(gh api --paginate "repos/$TARGET_REPO/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[].filename')" || return 2
            grep -qE '^\.github/workflows/' <<<"$files"
          }

          base_ref="$(resolve_base_ref)" ||
            { echo "::error::could not resolve the PR base branch"; exit 1; }
          required_workflow_trusted=false
          if required_workflow_source_trusted "$base_ref"; then
            required_workflow_trusted=true
          fi

          for attempt in $(seq 1 "$merge_wait_attempts"); do
            meta="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" \
              --json headRefOid,isDraft,labels,state,statusCheckRollup)"
            current_head="$(jq -r '.headRefOid // ""' <<<"$meta")"
            [ "$current_head" = "$EXPECTED_HEAD_SHA" ] ||
              { echo "::error::stale head"; exit 1; }
            pr_state="$(jq -r '.state // ""' <<<"$meta")"
            if [ "$pr_state" = "MERGED" ]; then
              echo "::notice::PR #$PR_NUMBER is already merged at $EXPECTED_HEAD_SHA; nothing to do"
              exit 0
            fi
            [ "$pr_state" = "OPEN" ] ||
              { echo "::error::PR is no longer open"; exit 1; }
            jq -e '.isDraft | not' <<<"$meta" >/dev/null ||
              { echo "::error::PR is draft"; exit 1; }
            jq -e '([.labels[].name | ascii_upcase | gsub("[ _-]+";" ")] |
              (index("HOLD") or index("DO NOT MERGE")) | not)' <<<"$meta" >/dev/null ||
              { echo "::error::PR is held"; exit 1; }

            file_guard_rc=0
            workflow_files_changed || file_guard_rc=$?
            if [ "$file_guard_rc" -eq 2 ]; then
              echo "::error::could not inspect the complete PR file list"
              exit 1
            fi
            if [ "$file_guard_rc" -eq 0 ]; then
              echo "::notice::workflow files changed; privileged auto-merge skipped; human review and merge required"
              exit 0
            fi

            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              gate_run="$(dispatched_gate_run || true)"
            else
              gate_run="$(newest_trusted_gate_run || true)"
            fi
            provenance=pending
            if [ -n "$gate_run" ]; then
              gate_run_id="$(jq -r '.id // 0' <<<"$gate_run")"
              gate_conclusion="$(jq -r '.conclusion // "pending"' <<<"$gate_run")"
              if [ "$gate_conclusion" != "pending" ] && [ "$gate_conclusion" != "success" ]; then
                echo "::error::newest trusted gate run failed"
                exit 1
              fi
              if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] &&
                 [ "$gate_conclusion" = "success" ] &&
                 attestation="$(attestation_for_run "$gate_run_id")"; then
                provenance=trusted
              elif [ "$gate_conclusion" = "success" ] &&
                 jq -e --arg needle "/actions/runs/$gate_run_id/" '
                   any(.statusCheckRollup[]?;
                     (.name // .context) == "gate" and
                     (.conclusion // .state) == "SUCCESS" and
                     ((.detailsUrl // "") | contains($needle)))
                 ' <<<"$meta" >/dev/null &&
                 attestation="$(attestation_for_run "$gate_run_id")"; then
                provenance=trusted
              fi
            fi

            failed="$(jq '[.statusCheckRollup[]? |
              select((.name // .context) as $n | $n != "preflight" and $n != "gate" and
                $n != "privileged_merge" and
                ($n | endswith("/ privileged_merge") | not)) |
              select(if .state then
                ((.state // "") | IN("SUCCESS","PENDING","EXPECTED") | not)
              else
                (.status == "COMPLETED" and ((.conclusion // "") | IN("SUCCESS","NEUTRAL","SKIPPED") | not))
              end)] | length' <<<"$meta")"
            pending="$(jq '[.statusCheckRollup[]? |
              select((.name // .context) as $n | $n != "preflight" and $n != "gate" and
                $n != "privileged_merge" and
                ($n | endswith("/ privileged_merge") | not)) |
              select(if .state then (.state | IN("PENDING","EXPECTED")) else .status != "COMPLETED" end)] | length' <<<"$meta")"
            [ "$failed" -eq 0 ] || { echo "::error::required check failed"; exit 1; }
            if [ "${provenance:-pending}" = trusted ] && [ "$pending" -eq 0 ]; then break; fi
            [ "$attempt" -lt "$merge_wait_attempts" ] || { echo "::error::trusted gate/checks did not become green"; exit 1; }
            sleep 30
          done

          final="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" \
            --json headRefOid,isDraft,labels,state,statusCheckRollup)"
          [ "$(jq -r '.headRefOid // ""' <<<"$final")" = "$EXPECTED_HEAD_SHA" ] ||
            { echo "::error::head changed before merge"; exit 1; }
          final_state="$(jq -r '.state // ""' <<<"$final")"
          if [ "$final_state" = "MERGED" ]; then
            echo "::notice::PR #$PR_NUMBER was already merged at $EXPECTED_HEAD_SHA; nothing to do"
            exit 0
          fi
          [ "$final_state" = "OPEN" ] ||
            { echo "::error::PR closed before merge"; exit 1; }
          jq -e '.isDraft | not' <<<"$final" >/dev/null ||
            { echo "::error::PR became draft"; exit 1; }
          jq -e '([.labels[].name | ascii_upcase | gsub("[ _-]+";" ")] |
            (index("HOLD") or index("DO NOT MERGE")) | not)' <<<"$final" >/dev/null ||
            { echo "::error::PR became held"; exit 1; }
          file_guard_rc=0
          workflow_files_changed || file_guard_rc=$?
          if [ "$file_guard_rc" -eq 2 ]; then
            echo "::error::could not re-inspect the complete PR file list"
            exit 1
          fi
          if [ "$file_guard_rc" -eq 0 ]; then
            echo "::notice::workflow files changed before merge; privileged auto-merge skipped; human review and merge required"
            exit 0
          fi
          final_base_ref="$(resolve_base_ref)" ||
            { echo "::error::could not re-resolve the PR base branch"; exit 1; }
          [ "$final_base_ref" = "$base_ref" ] ||
            { echo "::error::PR base branch changed before merge"; exit 1; }
          if [ "$required_workflow_trusted" = true ]; then
            required_workflow_source_trusted "$final_base_ref" ||
              { echo "::error::required-workflow trust anchor withdrawn before merge"; exit 1; }
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            final_gate_run="$(dispatched_gate_run || true)"
          else
            final_gate_run="$(newest_trusted_gate_run || true)"
          fi
          [ -n "$final_gate_run" ] ||
            { echo "::error::trusted gate disappeared before merge"; exit 1; }
          final_gate_id="$(jq -r '.id // 0' <<<"$final_gate_run")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            attested_run_id="$SOURCE_RUN_ID"
            [ "$(jq -r '.conclusion // ""' <<<"$final_gate_run")" = "success" ] &&
              attestation="$(attestation_for_run "$attested_run_id")" ||
              { echo "::error::trusted dispatched gate changed before merge"; exit 1; }
          else
            attested_run_id="$final_gate_id"
            [ "$(jq -r '.conclusion // ""' <<<"$final_gate_run")" = "success" ] &&
            jq -e --arg needle "/actions/runs/$final_gate_id/" '
              any(.statusCheckRollup[]?;
                (.name // .context) == "gate" and
                (.conclusion // .state) == "SUCCESS" and
                ((.detailsUrl // "") | contains($needle)))
            ' <<<"$final" >/dev/null ||
            { echo "::error::newest trusted gate changed before merge"; exit 1; }
            attestation="$(attestation_for_run "$attested_run_id")" ||
              { echo "::error::trusted attestation changed before merge"; exit 1; }
          fi
          final_failed="$(jq '[.statusCheckRollup[]? |
            select((.name // .context) as $n | $n != "preflight" and $n != "gate" and
                $n != "privileged_merge" and
                ($n | endswith("/ privileged_merge") | not)) |
            select(if .state then
              ((.state // "") | IN("SUCCESS","PENDING","EXPECTED") | not)
            else
              (.status == "COMPLETED" and ((.conclusion // "") | IN("SUCCESS","NEUTRAL","SKIPPED") | not))
            end)] | length' <<<"$final")"
          final_pending="$(jq '[.statusCheckRollup[]? |
            select((.name // .context) as $n | $n != "preflight" and $n != "gate" and
                $n != "privileged_merge" and
                ($n | endswith("/ privileged_merge") | not)) |
            select(if .state then (.state | IN("PENDING","EXPECTED")) else .status != "COMPLETED" end)] | length' <<<"$final")"
          [ "$final_failed" -eq 0 ] && [ "$final_pending" -eq 0 ] ||
            { echo "::error::checks changed before merge"; exit 1; }

          # Splitting the concurrency group by event means the
          # pull_request_target check and the dispatched continuation can both be
          # live for the same PR. Everything above re-validates state, but that
          # is NOT atomic with the merge: a base-ref resolve, a paginated rules
          # call, a gate lookup and an attestation download sit in between.
          # Whichever run loses gets a legitimate --match-head-commit failure,
          # which under `set -euo pipefail` would surface as a red
          # privileged_merge on a PR that merged perfectly well — trading the
          # deterministic cancelled check this change removes for a probabilistic
          # failed one, which is harder to diagnose, not easier.
          #
          # Exactly one cause is tolerated: already MERGED at the attested head.
          if ! gh pr merge "$PR_NUMBER" --repo "$TARGET_REPO" --squash --admin \
                 --delete-branch --match-head-commit "$EXPECTED_HEAD_SHA"; then
            settled="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" \
              --json state,headRefOid 2>/dev/null)" || settled=''
            if [ -n "$settled" ] &&
               [ "$(jq -r '.state' <<<"$settled")" = "MERGED" ] &&
               [ "$(jq -r '.headRefOid' <<<"$settled")" = "$EXPECTED_HEAD_SHA" ]; then
              echo "::notice::PR #$PR_NUMBER was merged at $EXPECTED_HEAD_SHA by a concurrent trusted run; nothing to do"
              exit 0
            fi
            echo "::error::merge failed and the PR is not merged at the attested head"
            exit 1
          fi

          # The exact run-bound artifact was shape-validated twice above and is
          # data only: it is never sourced, executed, or extracted to a worktree.
          followups="$(jq -c .followups <<<"$attestation")"
          jq -c '.[]' <<<"$followups" | while IFS= read -r item; do
            location="$(jq -r .location <<<"$item")"
            note="$(jq -r .note <<<"$item")"
            marker="<!-- ai-review-followup:pr${PR_NUMBER}:$(printf '%s' "$location"$'\n'"$note" | sha256sum | cut -c1-12) -->"
            existing="$(gh issue list --repo "$TARGET_REPO" --state all --search "$marker in:body" --json number --jq 'length' 2>/dev/null || echo 0)"
            [ "$existing" -gt 0 ] && continue
            gh issue create --repo "$TARGET_REPO" \
              --title "AI-review follow-up: ${location:0:70}" \
              --body "$marker

          Non-blocking finding from merged PR #$PR_NUMBER at \`$location\`:

          $note" >/dev/null || echo "::warning::could not file follow-up for $location"
          done
