name: fleet watchdog

# Breaks merge-gate poll deadlocks on the shared self-hosted fleet.
#
# `gate` and `privileged_merge` hold a runner for tens of minutes while POLLING
# for checks they cannot influence. On a fixed pool that is a deadlock, not
# slowness — six gate jobs held all six runners on 2026-08-03 while waiting for
# CI that could not start because it needed those runners. ADR 0048 removed this
# for public targets, but 88 of 90 repositories here are private and stay on the
# fixed pool, so the deadlock is still reachable for almost all of them.
#
# Runs on the FAST LANE: this repository is public, so these minutes are free,
# and a watchdog that queued for a self-hosted runner would be waiting behind the
# exact jam it exists to clear.
#
# Ships in DRY RUN by default. It reports what it would preempt and cancels
# nothing until `watchdog_dry_run` is flipped to 'false' — see the run summary
# for a few cycles before arming it.

on:
  schedule:
    # Every 15 minutes. The poll windows it preempts are 30-40 minutes, so this
    # catches a jam within roughly half a window.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report candidates without cancelling anything
        required: false
        type: boolean
        default: true
      min_age_minutes:
        description: Only preempt poll jobs older than this
        required: false
        type: string
        default: '35'

permissions:
  contents: read

concurrency:
  group: fleet-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    # Never gate this job on the fleet it is policing.
    runs-on: ${{ fromJSON(vars.VERJSON_RUNNER_FASTLANE || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    steps:
      - name: Check out the watchdog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Sweep the fleet for poll deadlocks
        env:
          # Needs cross-repository read plus `actions: write` to cancel, which
          # `github.token` does not carry outside this repository.
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          WATCHDOG_ORG: ${{ github.repository_owner }}
          WATCHDOG_DRY_RUN: ${{ inputs.dry_run == false && 'false' || vars.VERJSON_WATCHDOG_DRY_RUN || 'true' }}
          WATCHDOG_MIN_AGE_MINUTES: ${{ inputs.min_age_minutes || '35' }}
        run: bash scripts/fleet-watchdog.sh
