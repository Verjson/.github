name: container release workflow identity canary

on:
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  probe:
    uses: ./.github/workflows/container-release.yml
    with:
      release_environment: release-app
      version: 0.0.0-workflow-identity-canary
      candidate-manifest: intentionally-invalid-after-workflow-ref-guard
      config-path: container-candidate.json
      contract-ref: ${{ github.workflow_sha }}
      release_app_client_id: ${{ vars.RELEASE_APP_CLIENT_ID }}
