name: AI review + auto-merge

# ORG-LEVEL autonomous merge gate (viager-docs ADR-018, as amended), required
# on every repo via the main-protection org ruleset.
#
# Cost-lane design (ADR-018 second amendment):
#   1. `preflight` (free, deterministic bash) updates stale branches and routes
#      each current PR into a lane on one runner assignment:
#        - fast: submodule pointer bumps (every new gitlink SHA verified to be
#          on the submodule's default branch), Renovate non-major updates
#          (bot-authored, manifest/lockfile-only diff, `update/<type>` label),
#          and deletions-only PRs. No model is invoked.
#        - ai: everything else gets a Claude review — but only AFTER the rest
#          of CI is green, so red PRs cost $0.
#        - defer: a Renovate PR whose `renovate/stability-days` age gate is
#          still pending (e.g. a replacement PR that `internalChecksFilter`
#          can't hold back). No model, no gate runner — Renovate's rebase once
#          the release ages re-enters classify for a real review.
#   2. Model tiering: routine code PRs are reviewed by Haiku; PRs touching
#      sensitive paths (authz/ABAC, payments/ledger, webhooks, secrets,
#      workflows) get the stronger default model. Turns are capped.
#   3. Reviews run on every ready-PR revision (incl. synchronize) so a
#      Renovate rebase re-fires the gate and the required check stays fresh on
#      the new head; cost stays bounded because fast-lane synchronizes invoke
#      no model and the AI lane only runs after CI is green. Re-run manually by
#      adding the `re-review` label (auto-removed) or via workflow_dispatch.
#
# Either lane produces a required validation result without administrative
# credentials. A separate pull_request_target job, loaded from the trusted base
# branch and consuming API metadata only, rechecks green CI and policy before a
# matched-head squash merge with the org-admin ruleset bypass. Humans opt a PR
# out with the `hold` label, a "DO NOT MERGE" title marker, or a draft.
#
# Cross-repo dispatch is bounded to THIS org (ADR 0020, #119). The optional
# Operators re-gate by dispatching this workflow in the repository that owns
# the PR. Cross-repository dispatch was retired by ADR 0036 because the
# unprivileged github.token is intentionally repository-scoped.
#
# Cross-ORG distribution (ADR 0022, #128): this file is ALSO a `workflow_call`
# reusable, so consumers in other orgs (e.g. tequityapp) pin it instead of
# hand-copying it — upstream fixes then reach every consumer via `@v1` and the
# shipped `scripts/ci-gate/*.test.sh` guard the shared logic once for everyone.
# The three triggers share one file: the Verjson org ruleset injects it on
# `pull_request`; an operator re-gates via `workflow_dispatch`; a cross-org
# consumer adds a thin caller that `uses:` it under `workflow_call`. When called,
# `github.repository`/`github.event`/`github.repository_owner` are inherited from
# the CALLER, so `TARGET_REPO` and the PR number resolve to the consumer's own
# repository. Consumers must
# pass only the model credentials needed for review and, if their fleet differs
# from the org gate pool, `with.runner_labels`. They must install their own
# trusted merge workflow for auto-merge; this reusable never receives their
# administrative credential from a PR event. Example caller:
#
#   # consumer repo (any org): .github/workflows/gate.yml
#   on: { pull_request: { types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled] }, workflow_dispatch: {} }
#   jobs:
#     gate:
#       uses: Verjson/.github/.github/workflows/ai-review-merge.yml@v1
#       secrets: inherit # model credentials only; never ORG_ADMIN_TOKEN
#       with: { runner_labels: '["self-hosted","gate"]' }
#
# Downstream copies must also omit any repository input and pin the target to
# the repository where the workflow executes.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review and (on pass) merge
        required: true
      allow_absent_checks:
        description: >-
          Proceed even though the PR has NO CI checks at all. Absent checks are
          normally treated as not-green (#143); set this only for a PR that is
          genuinely expected to trigger nothing (e.g. docs-only under a `paths:`
          filter). Engaging it is logged as a warning on the run.
        required: false
        type: boolean
        default: false
  workflow_call:
    # Cross-org consumers pin this reusable and pass `secrets: inherit` (ADR
    # 0022). A pull_request-triggered caller leaves pr_number empty and the
    # inherited event supplies it. `runner_labels` is REQUIRED: a consumer's org has no runner
    # for Verjson's `self-hosted,gate` pool, so omitting it would silently queue
    # the job forever on the wrong labels (#130) — requiring it fails the call
    # immediately with a clear message instead. Missing `secrets: inherit` is
    # caught by the `require_secrets` preflight step (#131).
    inputs:
      pr_number:
        description: PR number to review; defaults to the caller's pull_request event
        required: false
        type: string
      runner_labels:
        description: 'JSON array of runs-on labels for the caller''s own fleet, e.g. ["self-hosted","gate"] (required — a consumer org has no runner for Verjson''s gate pool)'
        required: true
        type: string
      allow_absent_checks:
        description: >-
          Proceed even though the PR has NO CI checks at all. Defaults to false
          (strict): absent checks are treated as not-green (#143). A consumer
          whose CI is path-filtered can set this per call; engaging it is logged
          as a warning on the run.
        required: false
        type: boolean
        default: false

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  # Label events start a workflow before job-level `if:` guards are evaluated.
  # Only gate-control changes may cancel an active review; in particular, the
  # classify step's own removal of `re-review` must not cancel its parent run.
  cancel-in-progress: >-
    ${{
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      (github.event.action == 'labeled' &&
        (github.event.label.name == 're-review' ||
         github.event.label.name == 'hold' ||
         github.event.label.name == 'DO NOT MERGE')) ||
      (github.event.action == 'unlabeled' &&
        (github.event.label.name == 'hold' || github.event.label.name == 'DO NOT MERGE'))
    }}

permissions:
  contents: read

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
  TARGET_REPO: ${{ github.repository }}

jobs:
  preflight:
    # Keep the branch current with its base BEFORE we review/merge, so a green
    # gate always means green against the *current* base — a behind-but-clean
    # branch never merges stale. Behind → update the branch (the resulting
    # synchronize starts a fresh run that steps this one aside). Conflicting →
    # first try the same update-branch merge (clears a conflict that was only
    # base drift, then steps aside like the behind path); a genuine content
    # conflict still holds and comments (can't auto-resolve). Renovate owns its
    # own rebases, so its branches are left untouched. Same opt-out guard as
    # classify.
    if: >
      github.event_name != 'pull_request_target' &&
      (github.event_name == 'workflow_dispatch' ||
      (
        (
          (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          (github.event.action == 'labeled' && github.event.label.name == 're-review') ||
          (github.event.action == 'unlabeled' &&
            (github.event.label.name == 'hold' || github.event.label.name == 'DO NOT MERGE'))
        ) &&
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.labels.*.name, 'hold') &&
        !contains(github.event.pull_request.labels.*.name, 'DO NOT MERGE') &&
        !contains(github.event.pull_request.title, 'DO NOT MERGE')
      ))
    # A workflow_call consumer sets its own fleet via `with.runner_labels`; the
    # org direct paths (pull_request/workflow_dispatch) leave it empty and route
    # org-aware (#175, ADR 0030): non-Verjson callers to GitHub-hosted
    # ubuntu-24.04. Verjson preflight always takes the untrusted lane.
    # Downstream gate uses the resolved target visibility (#225, ADR 0035).
    runs-on: ${{ inputs.runner_labels && fromJSON(inputs.runner_labels) || github.repository_owner != 'Verjson' && 'ubuntu-24.04' || fromJSON(vars.VERJSON_RUNNER_UNTRUSTED || vars.VERJSON_RUNNER_DEFAULT || '["self-hosted","general"]') }}
    # This job combines the former 10-minute freshness and classification jobs.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    outputs:
      # 'true' → this run continues to classify/review/merge. 'false' → the branch
      # was just updated; a fresh run will handle it, so downstream jobs skip.
      proceed: ${{ steps.freshness.outputs.proceed }}
      lane: ${{ steps.classify.outputs.lane }}
      reason: ${{ steps.classify.outputs.reason }}
      model: ${{ steps.classify.outputs.model }}
      budget_usd: ${{ steps.classify.outputs.budget_usd }}
      changed_lines: ${{ steps.classify.outputs.changed_lines }}
      dependency_major: ${{ steps.classify.outputs.dependency_major }}
      head_sha: ${{ steps.classify.outputs.head_sha }}
      completed_at: ${{ steps.preflight_complete.outputs.completed_at }}
      # 'false' → public target → hosted runner; 'true' or '' (unresolved,
      # fail closed) → self-hosted `gate`. See the gate job's `runs-on` (#170).
      target_private: ${{ steps.target_visibility.outputs.target_private }}
    steps:
      - name: Record preflight runner timing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          assigned_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          created_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at 2>/dev/null || true)"
          # Fail-safe epoch conversion: a bad/empty timestamp leaves the epoch
          # empty (never an empty $(( )) operand), so it degrades to "unknown"
          # instead of a fatal arithmetic syntax error aborting this required
          # diagnostic step (#106; ADR 0017 keeps diagnostics enforcement-neutral).
          assigned_epoch="$(date -u -d "$assigned_at" +%s 2>/dev/null || true)"
          created_epoch="$(date -u -d "$created_at" +%s 2>/dev/null || true)"
          if [[ -n "$created_at" && "$assigned_epoch" =~ ^[0-9]+$ && "$created_epoch" =~ ^[0-9]+$ ]]; then
            queue_seconds=$(( assigned_epoch - created_epoch ))
            echo "::notice::phase=preflight runner_assigned_at=$assigned_at workflow_created_at=$created_at initial_queue_seconds=$queue_seconds"
          else
            echo "::notice::phase=preflight runner_assigned_at=$assigned_at initial_queue_seconds=unknown"
          fi

      - name: Resolve target repo visibility (routes the gate runner, #170)
        id: target_visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `runs-on` expressions only see event/inputs context, and on the
          # workflow_dispatch re-gate path `github.event.repository` is the
          # DISPATCHING repo, not the target. Resolve the org-guarded
          # TARGET_REPO's actual visibility here so the gate job routes
          # hosted-vs-self-hosted on the target, not the dispatcher. An
          # unreadable repo emits an empty value and the gate falls back to
          # the self-hosted `gate` pool — fail closed to the operator-only
          # path, never onto a hosted runner with the wrong assumptions.
          if ! target_private="$(gh api "repos/$TARGET_REPO" --jq .private 2>"$RUNNER_TEMP/tv.err")"; then
            target_private=""
            echo "::warning::target visibility lookup failed for $TARGET_REPO (routing fail-closed to the gate pool): $(head -c 200 "$RUNNER_TEMP/tv.err" | tr -d '\n')"
          fi
          echo "target_private=$target_private" >> "$GITHUB_OUTPUT"
          echo "::notice::phase=preflight target_repo=$TARGET_REPO target_private=${target_private:-unknown}"

      - name: Update branch if behind; hold on conflict
        id: freshness
        env:
          # Event token: updates/comments only in the repository owning this run.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$TARGET_REPO"
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          # Retry the reads so a transient API blip doesn't red-gate the PR.
          pr_json() {
            for _ in 1 2 3; do
              gh pr view "$PR_NUMBER" --repo "$REPO" --json "$1" 2>/dev/null && return 0
              sleep 3
            done
            return 1
          }

          if ! meta=$(pr_json author,headRefName,baseRefName,headRefOid,mergeable); then
            echo "::warning::could not read PR metadata; proceeding without a freshness action."
            out proceed true; exit 0
          fi
          author="$(jq -r '.author.login // ""' <<<"$meta")"
          head_ref="$(jq -r '.headRefName // ""' <<<"$meta")"
          head_sha="$(jq -r '.headRefOid // ""' <<<"$meta")"
          base_ref="$(jq -r '.baseRefName // "the base branch"' <<<"$meta")"

          # Renovate rebases its own PRs on its stability schedule — leave them to
          # it. Match classify's anchored author pattern (plus the branch prefix).
          if printf '%s' "$author" | grep -qiE '^(app/)?renovate(\[bot\])?$' \
             || [ "${head_ref#renovate/}" != "$head_ref" ]; then
            echo "Renovate PR — leaving freshness to Renovate."; out proceed true; exit 0
          fi

          # mergeable is computed async; wait out UNKNOWN.
          mrg="$(jq -r '.mergeable // "UNKNOWN"' <<<"$meta")"
          for _ in 1 2 3 4 5 6; do
            [ "$mrg" != "UNKNOWN" ] && break
            sleep 5
            mrg="$(jq -r '.mergeable // "UNKNOWN"' <<<"$(pr_json mergeable || echo '{}')")"
          done
          echo "mergeable=$mrg"

          # Base conflict. Try the same non-destructive update-branch (merge base
          # into head) the BEHIND path uses BEFORE giving up: a branch reported
          # CONFLICTING purely from base drift (non-overlapping changes GitHub
          # flags pessimistically) clears once the base is merged in. Re-check
          # mergeability after; if it clears, treat it exactly like the BEHIND
          # success path — the update pushed a `synchronize`, so a fresh run
          # reviews/merges against the current base and this run steps aside
          # (proceed=false). Only a *genuine* content conflict — the update-branch
          # API fails, or mergeable is still CONFLICTING afterwards — falls
          # through to hold (fail-closed) + a single marker-guarded comment.
          if [ "$mrg" = "CONFLICTING" ]; then
            if gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/update-branch" >/dev/null 2>&1; then
              # Re-read mergeable, again waiting out the async UNKNOWN window.
              mrg="$(jq -r '.mergeable // "UNKNOWN"' <<<"$(pr_json mergeable || echo '{}')")"
              for _ in 1 2 3 4 5 6; do
                [ "$mrg" != "UNKNOWN" ] && break
                sleep 5
                mrg="$(jq -r '.mergeable // "UNKNOWN"' <<<"$(pr_json mergeable || echo '{}')")"
              done
              echo "post-update mergeable=$mrg"
              if [ "$mrg" != "CONFLICTING" ]; then
                echo "Conflict was base drift; update-branch cleared it — a fresh run will merge against the current base."
                out proceed false; exit 0
              fi
            fi
            marker="<!-- gate:branch-conflict -->"
            note="$marker This PR conflicts with \`$base_ref\`. The merge gate can't auto-update a conflicting branch — please rebase/merge \`$base_ref\` and resolve the conflicts; the gate re-fires on push."
            # Dedup only on a *successful* read: a transient read failure must not
            # look like "marker absent" and post a duplicate. If we truly can't
            # read the comments (after pr_json's retries), post anyway — a rare
            # duplicate beats never telling the human why the PR is held.
            if existing="$(pr_json comments)"; then
              jq -r '.comments[].body' <<<"$existing" 2>/dev/null | grep -qF "$marker" \
                || gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$note" || true
            else
              gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$note" || true
            fi
            echo "::error::Branch conflicts with $base_ref — holding until resolved."
            exit 1
          fi

          # Behind the base? Ask the compare API for the real commit delta — it is
          # independent of branch protection, whereas mergeStateStatus only
          # reports BEHIND when a strict "up to date" rule is set (this org's
          # ruleset is NOT strict, so a behind-but-clean branch reads CLEAN).
          # Compare against the head SHA, not the ref, so a slash in the branch
          # name can't confuse the ...-path. Behind → update the branch; the push
          # fires `synchronize`, and that fresh run reviews/merges against the
          # current base, so this run steps aside.
          behind="$(gh api "repos/$REPO/compare/$base_ref...$head_sha" --jq '.behind_by' 2>/dev/null || echo 0)"
          [[ "$behind" =~ ^[0-9]+$ ]] || behind=0
          if [ "$behind" -gt 0 ]; then
            if gh api --method PUT "repos/$REPO/pulls/$PR_NUMBER/update-branch" >/dev/null 2>&1; then
              echo "Branch was $behind commit(s) behind $base_ref; updated it — a fresh run will merge against the current base."
              out proceed false; exit 0
            fi
            echo "update-branch did not apply (race / fork / already current); proceeding."
          fi

          out proceed true

      - name: Classify PR into a lane
        id: classify
        if: steps.freshness.outputs.proceed == 'true'
        env:
          # Event token: classification reads this PR and public submodule refs.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$TARGET_REPO"
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          meta=$(gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json labels,title,isDraft,author,headRefOid,baseRefName)
          # Re-check opt-outs here too: workflow_dispatch bypasses the job if.
          # A hold is any of: a `hold`/`DO NOT MERGE` label (case- and
          # separator-insensitive, so `do-not-merge` counts — #51), a
          # `DO NOT MERGE` title marker, or draft.
          if jq -e '([.labels[].name | ascii_upcase | gsub("[ _-]+";" ")]) as $l | ($l | index("HOLD")) or ($l | index("DO NOT MERGE")) or (.title | ascii_upcase | contains("DO NOT MERGE")) or .isDraft' <<<"$meta" >/dev/null; then
            echo "PR is held (label/title/draft); no lane."
            out lane held; out reason "held by human opt-out"; out model none
            exit 0
          fi
          # `// ""` matters: without it a missing key yields the STRING "null",
          # which passes an `-z` emptiness test and is then interpolated into an
          # Actions-runs URL that matches nothing (making the absence probe look
          # clean). Downstream validates the 40-hex shape; keep the empty case
          # empty so that validation sees it.
          head_sha="$(jq -r '.headRefOid // ""' <<<"$meta")"
          out head_sha "$head_sha"
          out dependency_major false

          # Consume the re-review label so it can be re-applied later.
          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label re-review 2>/dev/null || true

          # ---- Defer: Renovate release-age gate still pending -------------
          # `internalChecksFilter: strict` holds back version *candidates* that
          # miss `minimumReleaseAge`, so no branch is raised — but a Renovate
          # *replacement* PR bypasses that candidate filter and is raised
          # immediately, carrying a pending `renovate/stability-days` status
          # until the age elapses. Reviewing or merging is impossible until
          # then, so a model review (and the long CI wait on a gate runner)
          # is pure waste that re-burns on every rebase. Defer: emit a lane no
          # downstream job runs for. Renovate's rebase once the release ages
          # fires `synchronize` and re-enters classify for a real review;
          # `workflow_dispatch` forces a review past the gate.
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ]; then
            age_pending=$(gh api "repos/$REPO/commits/$head_sha/status" \
              --jq '[.statuses[]? | select(.context == "renovate/stability-days" and .state == "pending")] | length' 2>/dev/null || echo 0)
            if [ "${age_pending:-0}" -gt 0 ]; then
              out lane defer
              out reason "Renovate release-age gate pending (renovate/stability-days) — deferring review until minimumReleaseAge elapses and Renovate rebases"
              out model none
              exit 0
            fi
          fi

          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[]' | jq -s .)
          nfiles=$(jq length <<<"$files")
          if [ "$nfiles" -eq 0 ]; then
            out lane ai; out reason "empty diff — needs a look"; out model claude-haiku-4-5
            out budget_usd 0.15
            out changed_lines 0
            exit 0
          fi

          # additions+deletions across the PR, used for the budget tier below.
          # `// 0` per file (a binary/too-large entry can omit `.changes`) and
          # `add // 0` for the whole sum keep this an integer, never null —
          # a null here would make the `-ge` test below a syntax error and
          # abort classification.
          changed_lines=$(jq '[.[].changes // 0] | add // 0' <<<"$files")
          [[ "$changed_lines" =~ ^[0-9]+$ ]] || changed_lines=0
          out changed_lines "$changed_lines"

          # Model tier for the AI lane: sensitive paths get the strong model.
          if jq -e '[.[].filename] | any(test("(^|/)\\.github/|abac|(^|/|[._-])auth|polic|payment|ledger|webhook|secret|middleware|rbac|rls"; "i"))' <<<"$files" >/dev/null; then
            model=claude-sonnet-5
            # Workflow/security reviews get the strong model and more budget. If
            # even this exhausts, the review escalates (see the ai-review job)
            # instead of failing, so the cap is a floor to escalate from, not a
            # hard wall. The 15-turn cap bounds exploration.
            budget_usd=0.50
            large_budget_usd=0.90
          else
            model=claude-haiku-4-5
            budget_usd=0.15
            large_budget_usd=0.60
          fi
          # Diff-size-keyed budget (#181, ADR 0032). The floors above are tuned
          # for a typical PR; a large diff exhausts them deterministically —
          # verjson-cli-cloud#163 (1,586 changed lines) burned $0.21 against the
          # $0.15 floor, died as `error_max_budget_usd`, and forced a ~$0.70
          # sonnet escalation on every such PR. Raise the first-pass cap for big
          # diffs so the cheap tier can actually finish. Both tiers stay strictly
          # under the escalation's $1.00, so escalation remains a real step up.
          if [ "$changed_lines" -ge 800 ]; then
            budget_usd="$large_budget_usd"
          fi
          out model "$model"
          out budget_usd "$budget_usd"

          # ---- Fast lane A: submodule pointer bump -------------------------
          # Every changed file is a gitlink hunk, and each new SHA is already
          # on the submodule's default branch (identical or behind = ancestor).
          if jq -e 'all(.[]; (.patch // "") | test("^@@[^\\n]*\\n(-Subproject commit [0-9a-f]{40}\\n?|\\+Subproject commit [0-9a-f]{40}\\n?)+$"))' <<<"$files" >/dev/null; then
            base=$(jq -r .baseRefName <<<"$meta")
            gm=$(mktemp)
            gh api "repos/$REPO/contents/.gitmodules?ref=$base" --jq .content | base64 -d > "$gm"
            ok=true
            while IFS=$'\t' read -r path sha; do
              name=$(git config -f "$gm" --list | awk -F= -v p="$path" '$2==p && $1 ~ /\.path$/ {sub(/^submodule\./,"",$1); sub(/\.path$/,"",$1); print $1; exit}')
              url=$(git config -f "$gm" --get "submodule.$name.url" || true)
              sub=$(sed -E 's#^(git@github\.com:|https://github\.com/)##; s#\.git$##; s#/*$##' <<<"$url")
              if [ -z "$sub" ]; then ok=false; echo "no submodule mapping for $path"; break; fi
              def=$(gh api "repos/$sub" --jq .default_branch)
              status=$(gh api "repos/$sub/compare/$def...$sha" --jq .status 2>/dev/null || echo unknown)
              echo "gitlink $path -> $sub@$sha vs $def: $status"
              case "$status" in identical|behind) ;; *) ok=false; break ;; esac
            done < <(jq -r '.[] | [.filename, ((.patch // "") | capture("\\+Subproject commit (?<s>[0-9a-f]{40})").s)] | @tsv' <<<"$files")
            if $ok; then
              out lane fast
              out reason "submodule pointer bump: every new gitlink SHA verified on its submodule's default branch"
              exit 0
            fi
          fi

          # ---- Fast lane B: Renovate non-major dependency update ----------
          author=$(jq -r .author.login <<<"$meta")
          if [[ "$author" =~ ^(app/)?renovate(\[bot\])?$ ]]; then
            commit_ok=$(gh api "repos/$REPO/pulls/$PR_NUMBER/commits" --paginate --jq '.[] | (.author.login // "MISSING")' \
              | jq -Rs 'split("\n") | map(select(length > 0)) | all(test("^renovate(\\[bot\\])?$"))')
            nonmajor=$(jq '.labels | map(.name) | any(test("^update/(patch|minor|pin|digest|pinDigest|lockFileMaintenance)$"))' <<<"$meta")
            # Keep the implementation aligned with the documented guarantee:
            # bot identity and labels alone are not enough for the fast lane.
            files_ok=$(jq '[.[].filename] | all(test("(^|/)(package(-lock)?\\.json|pnpm-lock\\.yaml|yarn\\.lock|bun\\.lockb?|Cargo\\.(toml|lock)|go\\.(mod|sum)|requirements[^/]*\\.txt|poetry\\.lock|pyproject\\.toml|Gemfile(\\.lock)?|composer\\.(json|lock)|gradle\\.lockfile|pom\\.xml|Chart\\.yaml|Chart\\.lock|values[^/]*\\.ya?ml|Dockerfile|\\.github/dependabot\\.yml)$"))' <<<"$files")
            if [ "$commit_ok" = true ] && [ "$nonmajor" = true ] && [ "$files_ok" = true ]; then
              out lane fast
              out reason "Renovate non-major update: bot-authored commits only, update-type label $(jq -r '.labels|map(.name)|map(select(startswith("update/")))|join(",")' <<<"$meta")"
              exit 0
            fi
            major=$(jq '.labels | map(.name) | index("update/major") != null' <<<"$meta")
            [ "$major" = true ] && out dependency_major true
            echo "renovate PR but not fast-lane eligible: commits_ok=$commit_ok nonmajor=$nonmajor files_ok=$files_ok"
          fi

          # Documentation and community-health changes have no executable
          # behavior. CI remains mandatory, but a model review adds little.
          if jq -e '[.[].filename] | all(test("(^NEXT(\\.md|/[^/]+\\.md)$|(^|/)(docs/.*|README(\\.[^/]*)?|CHANGELOG(\\.[^/]*)?|CONTRIBUTING(\\.[^/]*)?|CODE_OF_CONDUCT(\\.[^/]*)?|SECURITY(\\.[^/]*)?|SUPPORT(\\.[^/]*)?|LICENSE(\\.[^/]*)?|\\.github/(ISSUE_TEMPLATE/.*|PULL_REQUEST_TEMPLATE\\.md|FUNDING\\.yml))$)"; "i"))' <<<"$files" >/dev/null; then
            out lane fast
            out reason "documentation/community-health-only change ($nfiles file(s)); CI must still pass"
            exit 0
          fi

          # ---- Fast lane C: deletions-only ---------------------------------
          if jq -e 'all(.[]; .status == "removed")' <<<"$files" >/dev/null; then
            out lane fast
            out reason "deletions-only PR ($nfiles file(s) removed, no content added); CI must still pass"
            exit 0
          fi

          out lane ai
          out reason "code change — AI review required (model: $model)"

      - name: Record preflight completion
        id: preflight_complete
        if: always()
        run: |
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "completed_at=$completed_at" >> "$GITHUB_OUTPUT"
          echo "::notice::phase=preflight completed_at=$completed_at lane=${{ steps.classify.outputs.lane || 'none' }} proceed=${{ steps.freshness.outputs.proceed || 'unknown' }}"

  gate:
    needs: preflight
    if: needs.preflight.outputs.lane == 'fast' || needs.preflight.outputs.lane == 'ai'
    # A workflow_call consumer sets its own fleet via `with.runner_labels`; the
    # org direct paths leave it empty. Non-Verjson callers run on GitHub-hosted
    # ubuntu-24.04. Verjson targets use the default or untrusted lane variable
    # from preflight visibility; both currently select the permissive `general`
    # pool (#204, ADR 0035).
    runs-on: ${{ inputs.runner_labels && fromJSON(inputs.runner_labels) || github.repository_owner != 'Verjson' && 'ubuntu-24.04' || needs.preflight.outputs.target_private == 'true' && fromJSON(vars.VERJSON_RUNNER_DEFAULT || '["self-hosted","general"]') || fromJSON(vars.VERJSON_RUNNER_UNTRUSTED || vars.VERJSON_RUNNER_DEFAULT || '["self-hosted","general"]') }}
    # Fast retains its former 45-minute merge ceiling. AI gets one bounded
    # aggregate ceiling for the 30-minute CI wait + the former 45-minute review
    # allowance + checkout/debounce/submit/recheck buffer.
    timeout-minutes: ${{ needs.preflight.outputs.lane == 'ai' && 80 || 45 }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    env:
      LANE: ${{ needs.preflight.outputs.lane }}
      LANE_REASON: ${{ needs.preflight.outputs.reason }}
      EXPECTED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
    steps:
      - name: Record gate runner timing
        env:
          PREFLIGHT_COMPLETED_AT: ${{ needs.preflight.outputs.completed_at }}
        run: |
          set -uo pipefail
          assigned_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Fail-safe epoch conversion (see the preflight step): an unparseable
          # or empty PREFLIGHT_COMPLETED_AT degrades to "unknown" rather than an
          # arithmetic syntax error aborting this required step (#106; ADR 0017).
          assigned_epoch="$(date -u -d "$assigned_at" +%s 2>/dev/null || true)"
          completed_epoch="$(date -u -d "$PREFLIGHT_COMPLETED_AT" +%s 2>/dev/null || true)"
          if [[ -n "$PREFLIGHT_COMPLETED_AT" && "$assigned_epoch" =~ ^[0-9]+$ && "$completed_epoch" =~ ^[0-9]+$ ]]; then
            queue_seconds=$(( assigned_epoch - completed_epoch ))
            echo "::notice::phase=gate runner_assigned_at=$assigned_at preflight_completed_at=$PREFLIGHT_COMPLETED_AT transition_queue_seconds=$queue_seconds lane=$LANE"
          else
            echo "::notice::phase=gate runner_assigned_at=$assigned_at transition_queue_seconds=unknown lane=$LANE"
          fi

      # CI-first: never pay for a model review of a PR that fails its own CI.
      # The fast lane keeps its existing 40-minute ceiling; the AI lane keeps
      # its existing 30-minute pre-review ceiling. This is the only long CI wait.
      - name: Wait once for the rest of CI to be green
        id: ci_wait
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_ABSENT_CHECKS: ${{ inputs.allow_absent_checks || false }}
        run: |
          set -euo pipefail
          started_epoch="$(date +%s)"
          max_attempts=60
          [ "$LANE" = "fast" ] && max_attempts=80
          echo "::notice::phase=ci-wait started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) lane=$LANE max_attempts=$max_attempts poll_seconds=30"
          # Everything below is anchored to the reviewed head: an unfiltered runs
          # query would match every recent run in the repo and blame this PR for
          # another commit's startup failure. The head can't appear mid-run, so
          # fail immediately rather than poll (the merge step refuses an empty
          # EXPECTED_HEAD_SHA too — nothing could merge anyway).
          # Validate the SHAPE, not just emptiness: a failed `jq -r .headRefOid`
          # yields the literal string "null", which is non-empty, and
          # `...?head_sha=null` returns zero runs — the probe would then report
          # "no startup failures" about a commit it never looked at. This value
          # is interpolated into an API URL, so it must be a bare 40-hex SHA.
          if ! [[ "${EXPECTED_HEAD_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::phase=ci-wait result=unknown-head lane=$LANE"
            echo "No usable head SHA was resolved for PR #$PR_NUMBER (got '${EXPECTED_HEAD_SHA:-<empty>}', expected a 40-character commit SHA); CI state cannot be attributed to a commit. Not reviewing or merging."
            exit 1
          fi
          checks=0
          checks_probe=unread
          probe=unread
          # A workflow whose `paths:` filter does not match never runs and emits
          # NO check run (unlike a job-level `if:`, which reports SKIPPED). Such
          # a PR can never accumulate checks, so polling it for the full window
          # only burns a self-hosted runner before failing. Once the rollup is
          # empty AND the runs API confirms zero runs for this head, a short
          # grace period is enough to call it: give real checks time to register,
          # then decide. 10 polls (~5 min) — registration is not instant and the
          # runs API can lag the check API, so the window has to be wide enough
          # that a merely SLOW check is never mistaken for an absent one. The
          # `runs_seen == 0` conjunct is what keeps it cheap: a check run implies
          # a workflow run, so this only fires when nothing was triggered at all.
          no_checks_grace_attempts=10
          # Absent checks are NOT green (#143), so this is a hard stop by
          # default. Name the escape hatch in the same breath: `hold`/draft only
          # prevent merging, so without this line a legitimately check-free PR
          # (docs-only under a `paths:` filter) has no path forward at all.
          no_checks_remediation="PR #$PR_NUMBER reported no CI checks at all for $EXPECTED_HEAD_SHA, and no workflow runs were triggered for that commit. Absent checks are treated as NOT green (#143): either the PR's workflows never triggered (commonly a 'paths:' filter that does not match this PR's files), or they died before producing a check run. Fix the workflow trigger, or add a required check, and push again. If this PR is genuinely expected to have no CI, re-run the gate with the explicit opt-out: gh workflow run ai-review-merge.yml --repo $TARGET_REPO -f pr_number=$PR_NUMBER -f allow_absent_checks=true"
          for i in $(seq 1 "$max_attempts"); do
            # Reset per iteration: a probe that failed on attempt 1 must not
            # still be labelling attempt 60's genuine pending timeout as
            # "probe-unavailable" and sending people to check API reachability.
            probe=unread
            checks_probe=unread
            # Read only repository-scoped REST resources. `gh pr view` expands
            # statusCheckRollup through nested GraphQL commit fields that a
            # correctly scoped GitHub App token cannot always read (#248).
            # `gh api --paginate` streams one JSON document per page. Slurp
            # those documents with jq because runner images can lag the GitHub
            # CLI release that introduced its native slurp flag (#248). Commit
            # statuses are newest-first, so retain only the first observation
            # for each context.
            checks_rc=0
            statuses_rc=0
            rollup_rc=0
            check_pages=$(gh api --paginate \
                "repos/$TARGET_REPO/commits/$EXPECTED_HEAD_SHA/check-runs?per_page=100" 2>/dev/null |
              jq -s -c '.') || checks_rc=$?
            status_pages=$(gh api --paginate \
                "repos/$TARGET_REPO/commits/$EXPECTED_HEAD_SHA/status?per_page=100" 2>/dev/null |
              jq -s -c '.') || statuses_rc=$?
            if [ "$checks_rc" -eq 0 ] && [ "$statuses_rc" -eq 0 ]; then
              rollup=$(jq -c '
                 if ((.checks | type) != "array" or
                     (.statuses | type) != "array" or
                     (.checks | length) == 0 or
                     (.statuses | length) == 0 or
                     ([.checks[] |
                       select((.check_runs | type) != "array")] | length) != 0 or
                     ([.statuses[] |
                       select((.statuses | type) != "array")] | length) != 0)
                 then error("unusable CI status API response")
                 else
                 ([.checks[] | .check_runs[] |
                   {name,
                    status: ((.status // "") | ascii_upcase),
                    conclusion: (if .conclusion == null then null
                                 else (.conclusion | ascii_upcase) end)}] +
                  ([.statuses[] | .statuses[] |
                    {context, state: ((.state // "") | ascii_upcase)}] |
                   reduce .[] as $status
                     ([]; if any(.[]; .context == $status.context)
                          then . else . + [$status] end))) |
                 [.[] | select((.name // .context) as $n |
                   $n != "preflight" and $n != "gate" and
                   $n != "freshness" and $n != "classify" and
                   $n != "ai-review" and $n != "ai-merge" and
                   $n != "review" and $n != "dispatch-merge" and
                   $n != "privileged_merge")]
                 end
               ' <<<"{\"checks\":$check_pages,\"statuses\":$status_pages}" 2>/dev/null) || rollup_rc=$?
            else
              rollup_rc=1
            fi
            if [ "$checks_rc" -ne 0 ] || [ "$statuses_rc" -ne 0 ] || [ "$rollup_rc" -ne 0 ]; then
              checks_probe=unavailable
              elapsed=$(( $(date +%s) - started_epoch ))
              echo "::warning::phase=ci-wait result=checks-unavailable elapsed_seconds=$elapsed attempt=$i/$max_attempts head=$EXPECTED_HEAD_SHA checks_endpoint_rc=$checks_rc statuses_endpoint_rc=$statuses_rc aggregate_shape_rc=$rollup_rc gh_version=$(gh --version 2>/dev/null | head -n 1 | tr ' ' '_' || echo unavailable)"
              sleep 30
              continue
            fi
            checks_probe=ok
            # Rollup mixes CheckRuns (name/status/conclusion) with commit
            # StatusContexts like renovate/stability-days (context/state) —
            # treating a context's null .status as pending hangs the gate.
            # GitHub can expose COMPLETED before it populates conclusion. That
            # transient snapshot is pending/inconclusive, not a terminal failure.
            # Once populated, only SUCCESS, NEUTRAL, or SKIPPED are green.
            # Commit StatusContexts retain their SUCCESS/PENDING/EXPECTED states;
            # every other state fails closed.
            failed=$(jq '[.[] | select(
              if .state then
                ((.state // "") | IN("SUCCESS","PENDING","EXPECTED") | not)
              else
                (.status == "COMPLETED" and (.conclusion // "") != "" and ((.conclusion // "") | IN("SUCCESS","NEUTRAL","SKIPPED") | not))
              end
            )] | length' <<<"$rollup")
            pending=$(jq -r '[.[] | select(if .state then (.state | IN("PENDING","EXPECTED")) else (.status != "COMPLETED" or (.conclusion // "") == "") end) | "\(.name // .context)=\(.state // .status)"] | join(", ")' <<<"$rollup")
            checks=$(jq 'length' <<<"$rollup")
            if [ "$failed" -gt 0 ]; then
              elapsed=$(( $(date +%s) - started_epoch ))
              echo "::error::phase=ci-wait result=failed elapsed_seconds=$elapsed lane=$LANE"
              echo "CI failed checks: $(jq -c '[.[] | select(if .state then ((.state // "") | IN("SUCCESS","PENDING","EXPECTED") | not) else (.status == "COMPLETED" and (.conclusion // "") != "" and ((.conclusion // "") | IN("SUCCESS","NEUTRAL","SKIPPED") | not)) end) | {name: (.name // .context // "<unnamed>"), state: (.state // null), status: (.status // null), conclusion: (.conclusion // null)}]' <<<"$rollup")"
              echo "CI is red for PR #$PR_NUMBER — not reviewing or merging."
              exit 1
            fi
            if [ -z "$pending" ]; then
              # Nothing left pending — but before calling it green, probe for the
              # failure mode the rollup cannot express: a workflow that died with
              # `startup_failure` (unresolvable action ref, unparseable YAML)
              # never produces a check run, so it is invisible here (#143). An
              # unreadable probe is inconclusive, never green — retry it.
              # A non-zero exit is only ONE way this probe fails. A proxy or edge
              # cache can answer 2xx with an HTML error page, and a truncated
              # body parses as nothing. Swallowing jq's error (`|| echo ""`)
              # turns any of those into an empty startup-failure list — which is
              # byte-identical to "nothing failed at startup", i.e. the very
              # fail-open this probe exists to close. So: keep jq's exit status,
              # assert the payload SHAPE before trusting it, and route every
              # failure to `unavailable`. Inconclusive is never clean.
              #
              # One jq pass does all three jobs (assert shape, count runs, list
              # startup failures) — the empty-rollup path probes on EVERY poll,
              # so this stays one subprocess per attempt. The explicit `ok`
              # marker, not jq's exit status, is the test: jq handed an empty
              # body reads zero documents, emits nothing and still exits 0.
              #
              # The verdict is a COUNT, never the names string. `name` is
              # nullable in the runs schema and `[null] | join(", ")` is "" —
              # so a run that died parsing its own YAML (the #143 scenario, and
              # the likeliest case for GitHub to report no name) would read as
              # "nothing failed startup". Names are log text only.
              #
              # `runs_seen` excludes the gate's OWN run: the gate is itself a
              # workflow run on this head, so an unfiltered count is never zero
              # and the "nothing was ever triggered" shortcut below would be
              # unreachable. The rollup filter strips the gate's check NAMES but
              # nothing strips its run. Matching on run id (not name) also holds
              # for a cross-org `workflow_call`, where the run is the caller's.
              probe=unavailable
              runs_seen=0
              startup_count=0
              broken=""
              if runs_json=$(gh api "repos/$TARGET_REPO/actions/runs?head_sha=$EXPECTED_HEAD_SHA&per_page=100" 2>/dev/null) &&
                 probe_out=$(jq -r '
                   ((env.GITHUB_RUN_ID // "") | tonumber? // -1) as $self
                   | if (has("workflow_runs") and (.workflow_runs | type == "array")) then
                     ([.workflow_runs[]
                       | select(((.conclusion // "") | ascii_downcase) == "startup_failure")]) as $bad
                     | "ok\t\(.workflow_runs | map(select(.id != $self)) | length)\t\($bad | length)\t\([$bad[] | .name // "<unnamed>"] | unique | join(", "))"
                   else "unusable" end' <<<"$runs_json" 2>/dev/null); then
                IFS=$'\t' read -r probe_marker probe_runs probe_startup probe_broken <<<"$probe_out" || true
                if [ "${probe_marker:-}" = "ok" ]; then
                  probe=ok
                  runs_seen="$probe_runs"
                  startup_count="$probe_startup"
                  broken="$probe_broken"
                fi
              fi
              if [ "$probe" != "ok" ]; then
                elapsed=$(( $(date +%s) - started_epoch ))
                echo "::warning::phase=ci-wait result=probe-unavailable elapsed_seconds=$elapsed attempt=$i/$max_attempts head=$EXPECTED_HEAD_SHA"
                sleep 30
                continue
              fi
              if [ "$startup_count" -gt 0 ]; then
                elapsed=$(( $(date +%s) - started_epoch ))
                echo "::error::phase=ci-wait result=startup-failure elapsed_seconds=$elapsed lane=$LANE head=$EXPECTED_HEAD_SHA workflows=$broken"
                echo "Workflow(s) [$broken] failed at startup on $EXPECTED_HEAD_SHA and produced no check run — CI never ran. Not reviewing or merging."
                # A startup_failure run is a permanent fact about this SHA: it is
                # never retried and never re-concluded, so fixing the workflow
                # upstream does NOT clear it and re-running the gate on the same
                # head will hit this again. Say what actually unblocks it.
                echo "This run is permanent for $EXPECTED_HEAD_SHA — re-running the gate will not clear it. Fix the workflow (usually an unresolvable action ref or unparseable YAML), then push a new commit so CI evaluates a fresh head; alternatively delete the stale startup_failure run for this SHA."
                exit 1
              fi
              # Absence of a check is NOT a passing check (#143). A workflow that
              # dies at startup emits no check run at all, so the filtered rollup
              # can be EMPTY while nothing was ever built, tested or linted.
              # An empty rollup is never green: keep polling and, if it stays
              # empty for the whole window, fail closed with result=no-checks.
              if [ "$checks" -eq 0 ]; then
                elapsed=$(( $(date +%s) - started_epoch ))
                # Decide early rather than polling to the ceiling: no checks in
                # the rollup AND zero workflow runs for this head means nothing
                # was ever triggered (typically an unmatched `paths:` filter), a
                # state that cannot change without a push. Keep a short grace
                # period so a check that is merely slow to register still wins.
                if [ "$runs_seen" -eq 0 ] && [ "$i" -ge "$no_checks_grace_attempts" ]; then
                  if [ "${ALLOW_ABSENT_CHECKS:-false}" = "true" ]; then
                    echo "::warning::phase=ci-wait result=no-checks-allowed elapsed_seconds=$elapsed attempts=$i lane=$LANE head=$EXPECTED_HEAD_SHA"
                    echo "PR #$PR_NUMBER has no CI checks for $EXPECTED_HEAD_SHA and no workflow runs were triggered. Proceeding ONLY because allow_absent_checks=true was explicitly set for this run (#143)."
                    exit 0
                  fi
                  echo "::error::phase=ci-wait result=no-checks elapsed_seconds=$elapsed attempts=$i lane=$LANE head=$EXPECTED_HEAD_SHA"
                  echo "$no_checks_remediation"
                  exit 1
                fi
                echo "phase=ci-wait elapsed_seconds=$elapsed attempt=$i/$max_attempts checks=0 runs=$runs_seen pending=<none-reported>"
                sleep 30
                continue
              fi
              elapsed=$(( $(date +%s) - started_epoch ))
              echo "::notice::phase=ci-wait result=green elapsed_seconds=$elapsed attempts=$i checks=$checks lane=$LANE"
              exit 0
            fi
            elapsed=$(( $(date +%s) - started_epoch ))
            echo "phase=ci-wait elapsed_seconds=$elapsed attempt=$i/$max_attempts pending=$pending"
            sleep 30
          done
          elapsed=$(( $(date +%s) - started_epoch ))
          # Name the reason the window ran out, so "fail closed" is never a
          # silent hang: an unverifiable probe, no checks at all, or real pending
          # work are three different problems with three different fixes.
          if [ "$checks_probe" != "ok" ]; then
            echo "::error::phase=ci-wait result=checks-unavailable elapsed_seconds=$elapsed lane=$LANE head=$EXPECTED_HEAD_SHA"
            echo "Could not read and validate repository check runs and commit statuses for $EXPECTED_HEAD_SHA. Failing closed; re-run the gate once both APIs return usable pages."
            exit 1
          fi
          if [ "$probe" = "unavailable" ]; then
            echo "::error::phase=ci-wait result=probe-unavailable elapsed_seconds=$elapsed lane=$LANE head=$EXPECTED_HEAD_SHA"
            echo "Could not read the workflow runs for $EXPECTED_HEAD_SHA, so a startup_failure (which produces no check run) could not be ruled out. Failing closed; re-run the gate once the API is reachable."
            exit 1
          fi
          if [ "$checks" -eq 0 ]; then
            if [ "${ALLOW_ABSENT_CHECKS:-false}" = "true" ]; then
              echo "::warning::phase=ci-wait result=no-checks-allowed elapsed_seconds=$elapsed lane=$LANE head=$EXPECTED_HEAD_SHA"
              echo "PR #$PR_NUMBER still reports no CI checks for $EXPECTED_HEAD_SHA. Proceeding ONLY because allow_absent_checks=true was explicitly set for this run (#143)."
              exit 0
            fi
            echo "::error::phase=ci-wait result=no-checks elapsed_seconds=$elapsed lane=$LANE head=$EXPECTED_HEAD_SHA"
            echo "$no_checks_remediation"
            exit 1
          fi
          echo "::error::phase=ci-wait result=timeout elapsed_seconds=$elapsed lane=$LANE pending=$pending"
          exit 1

      - name: Checkout PR head
        if: needs.preflight.outputs.lane == 'ai'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ needs.preflight.outputs.head_sha }}
          token: ${{ github.token }}
          fetch-depth: 2

      # Cost/latency optimization (#120): when main is active a green PR keeps
      # getting a base-merge from preflight, which re-fires `synchronize` and
      # re-pays a full model review even though the PR's own net diff is
      # unchanged. Compute the PR's base..head patch-id (stable across
      # base-merges/rebases) and, if it byte-matches the patch-id embedded in the
      # most recent APPROVAL marker, reuse that approval and skip the model. This
      # is PURELY an optimization on an already-approved, unchanged diff: it
      # never merges by itself — the unchanged authoritative merge-recheck below
      # still re-verifies head/CI/hold/draft and does the squash. Every unknown
      # (no merge-base, empty diff, missing/old/blocking-only marker) falls
      # through to the full review — fail-closed.
      - name: Decide whether to skip re-review (unchanged diff)
        id: rereview
        if: needs.preflight.outputs.lane == 'ai'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub runs `run:` under `bash -e`, and `set -uo pipefail` does NOT
          # clear that. Explicitly disable errexit so a transient or no-match
          # git/gh/grep non-zero — e.g. `grep` finding no prior marker on a
          # first-review PR — degrades to "do not skip" instead of aborting this
          # required gate step and blocking every merge org-wide
          # (Verjson/.github#124). This step must never fail closed.
          set +e
          set -uo pipefail
          skip=false
          patch_id=""
          approved_head=""

          # 1. Current PR net patch-id. The depth-2 checkout lacks the base, so
          #    fetch it and use the merge-base; patch-id --stable is invariant to
          #    later base-merges/rebases. Any failure -> patch_id stays empty
          #    (UNKNOWN) -> never skip.
          base_ref="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json baseRefName --jq .baseRefName 2>/dev/null || true)"
          if [ -n "$base_ref" ]; then
            git fetch --no-tags --depth 50 origin "$base_ref" 2>/dev/null || git fetch --no-tags origin "$base_ref" 2>/dev/null || true
            mb="$(git merge-base "origin/$base_ref" HEAD 2>/dev/null || true)"
            if [ -z "$mb" ]; then
              git fetch --no-tags --unshallow origin "$base_ref" 2>/dev/null || true
              mb="$(git merge-base "origin/$base_ref" HEAD 2>/dev/null || true)"
            fi
            if [ -n "$mb" ]; then
              diff="$(git diff "$mb" HEAD 2>/dev/null || true)"
              # An empty net diff (no real change) is UNKNOWN, not a match.
              if [ -n "$diff" ]; then
                patch_id="$(printf '%s\n' "$diff" | git patch-id --stable | awk '{print $1}')"
              fi
            fi
          fi

          # 2. Patch-id embedded in the most recent APPROVAL marker. Only an
          #    APPROVED review, or the self-gate's "approved verdict" comment
          #    fallback, qualifies — a blocking/inconclusive record that also
          #    carries the marker must NOT authorize a skip. Newest wins.
          # The marker is only trustworthy if the gate/bot itself posted it.
          # ORG_ADMIN_TOKEN's own identity is the account that submits the
          # deterministic review/approval, so restrict BOTH the approved-review
          # and approved-comment selects to that login. Without this, any PR
          # author could post a comment carrying a forged marker plus the
          # (locally computable) patch-id and skip the paid review entirely
          # (fail-open). No gate identity -> no skip.
          prior_patch=""
          gate_login="$(gh api user --jq '.login' 2>/dev/null || true)"
          if [ -n "$patch_id" ] && [ -n "$gate_login" ]; then
            prdata="$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json reviews,comments 2>/dev/null || echo '{}')"
            winner="$(jq -r --arg gate "$gate_login" '
              [ (.reviews[]?  | select(.state == "APPROVED" and .author.login == $gate)                               | {t: .submittedAt, b: .body}),
                (.comments[]? | select(.author.login == $gate and (.body | contains("Merge gate: approved verdict"))) | {t: .createdAt,  b: .body}) ]
              | map(select(.b != null and (.b | test("ai-review-head:"))))
              | sort_by(.t) | reverse | (.[0].b // "")
            ' <<<"$prdata" 2>/dev/null || true)"
            prior_patch="$(printf '%s' "$winner" | grep -oE 'patchid:[^ ]+' | head -n1 | cut -d: -f2)"
            approved_head="$(printf '%s' "$winner" | grep -oE 'ai-review-head:[^ ]+' | head -n1 | cut -d: -f2)"
          fi

          # 3. Skip ONLY on a non-empty exact match against a prior approval.
          if [ -n "$patch_id" ] && [ -n "$prior_patch" ] && [ "$patch_id" = "$prior_patch" ]; then
            skip=true
          fi

          {
            echo "skip_model=$skip"
            echo "patch_id=$patch_id"
          } >> "$GITHUB_OUTPUT"

          if [ "$skip" = true ]; then
            echo "::notice::phase=rereview result=skip patch_id=$patch_id approved_head=$approved_head"
            # Synthesize the approved verdict the deterministic submit + merge
            # recheck consume, so the skip path runs exactly like a normal
            # approve (blocking=false) — the merge only happens through the
            # unchanged recheck.
            summary="re-review skipped: PR net diff unchanged since ${approved_head:-a prior approval} (patch-id match)"
            verdict="$(jq -cn --arg s "$summary" '{blocking:false,summary:$s,review_first:[],findings:[],followups:[]}')"
            {
              echo "skip_verdict<<VERDICT_EOF"
              printf '%s\n' "$verdict"
              echo "VERDICT_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::notice::phase=rereview result=review patch_id=${patch_id:-unknown}"
          fi

      - name: Prepare bounded review context
        id: prep
        if: needs.preflight.outputs.lane == 'ai' && steps.rereview.outputs.skip_model != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENCY_MAJOR: ${{ needs.preflight.outputs.dependency_major }}
        run: |
          set -euo pipefail
          mkdir -p .ai-review
          gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" \
            --json title,body,author,labels,baseRefName,headRefName,additions,deletions,changedFiles \
            > .ai-review/pr.json
          gh pr diff "$PR_NUMBER" --repo "$TARGET_REPO" > .ai-review/pr.full.diff

          # Elide generated lockfiles from the review payload. A lockfile is a
          # derived artifact — the reviewer scrutinizes the manifest
          # (package.json, Cargo.toml, …), never the machine-generated lock. An
          # 8k-line package-lock in the diff once consumed the whole review
          # budget and produced a no-verdict, fail-closed run on an
          # otherwise-small PR (Verjson/.github#110). Keep the full diff on disk
          # for reference; hand the model the filtered diff plus a note of what
          # was dropped so it still scrutinizes the manifest counterpart.
          LOCK_RE='(^|/)(package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?|Cargo\.lock|go\.sum|poetry\.lock|composer\.lock|gradle\.lockfile|Gemfile\.lock)$'
          awk -v re="$LOCK_RE" '
            /^diff --git / { p = $4; sub(/^b\//, "", p); keep = (p !~ re) }
            keep
          ' .ai-review/pr.full.diff > .ai-review/pr.diff
          elided_lockfiles="$(awk -v re="$LOCK_RE" '
            /^diff --git / { p = $4; sub(/^b\//, "", p);
              if (p ~ re) out = out (out == "" ? "" : ", ") p }
            END { print out }
          ' .ai-review/pr.full.diff)"

          # Debounce synchronize bursts. Concurrency cancels an older run, and
          # this SHA check ensures a superseded revision never reaches Claude.
          sleep 30
          current=$(gh pr view "$PR_NUMBER" --repo "$TARGET_REPO" --json headRefOid --jq .headRefOid)
          [ "$current" = "${{ needs.preflight.outputs.head_sha }}" ] || {
            echo "PR head moved to $current during debounce; a newer run will review it."
            exit 1
          }

          # Compose the review prompt once. Both the first pass and, if it runs
          # out of budget/turns, the escalation pass reuse it verbatim so the
          # two reviews never drift. The economy instruction (read the diff,
          # then only the files a finding depends on) keeps the agentic loop
          # from wandering the tree and burning tokens on context resends.
          major_note=""
          if [ "$DEPENDENCY_MAJOR" = "true" ]; then
            major_note="This is a major dependency update. Also inspect the changed dependency version and repository evidence for breaking changes, deprecations, migrations, and security-relevant fixes."
          fi
          lockfile_note=""
          if [ -n "$elided_lockfiles" ]; then
            lockfile_note="Generated lockfile(s) were omitted from the diff to conserve review budget: ${elided_lockfiles}. Their manifest changes (package.json, Cargo.toml, requirements, etc.) ARE in the diff — review those; do not open or request the lockfile itself."
          fi
          {
            echo "review_prompt<<PROMPT_EOF"
            cat <<EOF
          You are the autonomous merge gate for ${TARGET_REPO}.
          Review PR #${PR_NUMBER} in ${TARGET_REPO}.
          Metadata is in .ai-review/pr.json and the diff (with generated
          lockfiles elided) is in .ai-review/pr.diff. Read those two files
          first, then open only the
          specific repository files a potential finding actually depends on —
          be economical and do not broadly explore the tree.

          Review for, in priority order:
          1. Correctness bugs and behavioral regressions.
          2. Security: authn/authz changes, tenant isolation, secret
             handling, input validation at boundaries, injection.
          3. Money-handling invariants (integer minor units, double-entry
             balance, idempotency, provider-confirmed amounts only).
          4. Missing or weakened tests for changed behavior.
          Style-only nits are not blocking; mention at most briefly.

          ${major_note}

          ${lockfile_note}

          Return the required JSON verdict as soon as you can support it. Do
          not call GitHub or submit a review yourself. Set blocking=true only
          for real defects. Each blocking finding (in "findings") must include
          file:line, why it is wrong, and a concrete failure scenario. Keep
          summary concise.

          Also return "review_first": the specific file:line hunks a human
          should eyeball first, highest blast-radius first, each with a one-line
          reason it is load-bearing. This is MANDATORY (must be non-empty) when
          the diff touches a sensitive area — authn/authz, RBAC/ABAC, secrets,
          IAM/OIDC, database migrations, money-handling, or CI / rulesets /
          branch protection — so the human's eye lands on the exact lines that
          matter even when the verdict is to approve. For a low-risk diff (docs,
          formatting, a trivial change) it may be empty.

          Also return "followups": substantive but non-blocking findings — real
          bugs or improvements that do not justify blocking this merge, each as
          {location, note}. These are filed as tracking issues when the PR
          merges, so nothing worth doing is lost. Do NOT put pure style /
          formatting / naming nitpicks here; mention those (at most briefly) in
          the summary only. Empty when there is nothing substantive to follow up.

          Be skeptical but calibrated: block on real defects, not
          hypotheticals. A docs-only PR with sane content should simply be
          approved.
          EOF
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      # TEMPORARY shim (#179): the isolated runner image base-d1c4376 ships no
      # `unzip`, and claude-code-action's Bun install extracts a zip with it —
      # without this every model invocation dies with exit 127 and the gate
      # fail-closes with no verdict. The ephemeral child container grants the
      # runner user passwordless sudo, and the container is destroyed after the
      # job. Remove when Verjson/verjson-github-runner#72 publishes an image
      # that carries unzip and the pool template rolls forward.
      - name: Ensure unzip for claude-code-action (isolated image gap, #179)
        if: needs.preflight.outputs.lane == 'ai' && steps.rereview.outputs.skip_model != 'true'
        run: |
          command -v unzip >/dev/null 2>&1 && exit 0
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip

      - name: Record model phase start
        id: model_timing
        if: needs.preflight.outputs.lane == 'ai' && steps.rereview.outputs.skip_model != 'true'
        run: |
          started_epoch="$(date +%s)"
          echo "started_epoch=$started_epoch" >> "$GITHUB_OUTPUT"
          echo "::notice::phase=model started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) model=${{ needs.preflight.outputs.model }} budget_usd=${{ needs.preflight.outputs.budget_usd }}"

      - name: Claude review (merge gate)
        id: claude
        if: needs.preflight.outputs.lane == 'ai' && steps.rereview.outputs.skip_model != 'true'
        # Do not fail the job on budget/turn exhaustion — the next step
        # inspects the (empty) verdict and escalates instead of dying here.
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # Renovate opens PRs as a bot actor; without this the action
          # refuses to run (majors and non-standard bot PRs reach this lane).
          allowed_bots: "renovate,renovate[bot],mend[bot]"
          prompt: ${{ steps.prep.outputs.review_prompt }}
          claude_args: |
            --model ${{ needs.preflight.outputs.model }}
            --max-turns 15
            --max-budget-usd ${{ needs.preflight.outputs.budget_usd }}
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"summary":{"type":"string"},"review_first":{"type":"array","items":{"type":"object","properties":{"location":{"type":"string"},"why":{"type":"string"}},"required":["location","why"],"additionalProperties":false}},"findings":{"type":"array","items":{"type":"string"}},"followups":{"type":"array","items":{"type":"object","properties":{"location":{"type":"string"},"note":{"type":"string"}},"required":["location","note"],"additionalProperties":false}}},"required":["blocking","summary","review_first","findings","followups"],"additionalProperties":false}'
            --allowedTools "Read,Grep,Glob"

      # Budget/turn exhaustion returns an empty structured_output (subtype
      # error_max_budget_usd / error_max_turns) — a signal the PR is bigger than
      # the cheap tier, NOT a review failure. Escalate to the strongest model
      # with a larger budget. A fresh pass (not --resume): the first session's
      # state may not survive into a second action invocation, and a resume that
      # errored would strand the very PR we are trying to unblock. Runs only when
      # the first pass produced no verdict, so the common case never reaches here.
      - name: Escalate review when the first pass ran out of budget or turns
        id: claude_retry
        if: needs.preflight.outputs.lane == 'ai' && steps.rereview.outputs.skip_model != 'true' && steps.claude.outputs.structured_output == ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "renovate,renovate[bot],mend[bot]"
          prompt: ${{ steps.prep.outputs.review_prompt }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
            --max-budget-usd 1.00
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"summary":{"type":"string"},"review_first":{"type":"array","items":{"type":"object","properties":{"location":{"type":"string"},"why":{"type":"string"}},"required":["location","why"],"additionalProperties":false}},"findings":{"type":"array","items":{"type":"string"}},"followups":{"type":"array","items":{"type":"object","properties":{"location":{"type":"string"},"note":{"type":"string"}},"required":["location","note"],"additionalProperties":false}}},"required":["blocking","summary","review_first","findings","followups"],"additionalProperties":false}'
            --allowedTools "Read,Grep,Glob"

      # One more bounded attempt when BOTH prior passes produced no verdict.
      # error_max_structured_output_retries is a *transient* failure of the model
      # to emit the tool call (distinct from budget/turns), and it has struck the
      # first pass and the escalation in the same run (#64). Because the flakes are
      # roughly independent, a third strong-tier attempt clears it far more often
      # than not — before the deterministic submit fails closed. Still fail-closed
      # if this also comes back empty. Guarded on BOTH prior outputs being empty so
      # a clean first (or second) pass never reaches here.
      - name: Second escalation when both prior passes produced no verdict (#64)
        id: claude_retry2
        if: needs.preflight.outputs.lane == 'ai' && steps.rereview.outputs.skip_model != 'true' && steps.claude.outputs.structured_output == '' && steps.claude_retry.outputs.structured_output == ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "renovate,renovate[bot],mend[bot]"
          prompt: ${{ steps.prep.outputs.review_prompt }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
            --max-budget-usd 1.00
            --json-schema '{"type":"object","properties":{"blocking":{"type":"boolean"},"summary":{"type":"string"},"review_first":{"type":"array","items":{"type":"object","properties":{"location":{"type":"string"},"why":{"type":"string"}},"required":["location","why"],"additionalProperties":false}},"findings":{"type":"array","items":{"type":"string"}},"followups":{"type":"array","items":{"type":"object","properties":{"location":{"type":"string"},"note":{"type":"string"}},"required":["location","note"],"additionalProperties":false}}},"required":["blocking","summary","review_first","findings","followups"],"additionalProperties":false}'
            --allowedTools "Read,Grep,Glob"

      - name: Record model retry outcome
        id: retry_outcome
        if: always() && needs.preflight.outputs.lane == 'ai'
        env:
          STARTED_EPOCH: ${{ steps.model_timing.outputs.started_epoch }}
          FIRST_VERDICT: ${{ steps.claude.outputs.structured_output != '' }}
          RETRY1_VERDICT: ${{ steps.claude_retry.outputs.structured_output != '' }}
          RETRY2_VERDICT: ${{ steps.claude_retry2.outputs.structured_output != '' }}
          RETRY1_CONCLUSION: ${{ steps.claude_retry.conclusion }}
          RETRY2_CONCLUSION: ${{ steps.claude_retry2.conclusion }}
          # Per-pass SDK transcripts, so the gate can name budget exhaustion
          # itself instead of leaving the action's raw `error_max_budget_usd`
          # annotation as the only signal (#181, ADR 0032).
          EXEC_FILE_1: ${{ steps.claude.outputs.execution_file }}
          EXEC_FILE_2: ${{ steps.claude_retry.outputs.execution_file }}
          EXEC_FILE_3: ${{ steps.claude_retry2.outputs.execution_file }}
        run: |
          elapsed=unknown
          if [[ "$STARTED_EPOCH" =~ ^[0-9]+$ ]]; then
            elapsed=$(( $(date +%s) - STARTED_EPOCH ))
          fi
          # Did any pass stop because it ran out of money? The transcript is an
          # array of SDK messages whose final `result` carries the subtype. A
          # missing, unset or unparseable file degrades to "no" — this step is
          # `always()` bookkeeping and must never fail the gate, and a false
          # positive would tell a maintainer to split a PR that is not oversized.
          budget_exhausted=false
          for f in "${EXEC_FILE_1:-}" "${EXEC_FILE_2:-}" "${EXEC_FILE_3:-}"; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            subtype=$(jq -r '(if type == "array" then (map(select(.type == "result")) | last) else . end).subtype // ""' "$f" 2>/dev/null || echo "")
            [ "$subtype" = "error_max_budget_usd" ] && budget_exhausted=true
          done
          echo "budget_exhausted=$budget_exhausted" >> "$GITHUB_OUTPUT"
          # Say in words what the red `error_max_budget_usd` annotation means in
          # this run. The action emits it at failure level even when a later
          # pass succeeds, which is exactly what made verjson-cli-cloud#163 read
          # as an unexplained gate failure.
          if [ "$budget_exhausted" = true ]; then
            if [ "$FIRST_VERDICT" = true ] || [ "$RETRY1_VERDICT" = true ] || [ "$RETRY2_VERDICT" = true ]; then
              echo "::notice::phase=model budget_exhausted=true outcome=recovered — a review pass hit its cost cap (the red error_max_budget_usd annotation above is expected); a later pass produced the verdict and this run is NOT blocked by it."
            else
              echo "::error::phase=model budget_exhausted=true outcome=blocked — every review pass hit its cost cap. This PR is larger than the review budget; the gate blocks it and requests human review."
            fi
          fi
          echo "::notice::phase=model elapsed_seconds=$elapsed first_verdict=$FIRST_VERDICT retry1_conclusion=$RETRY1_CONCLUSION retry1_verdict=$RETRY1_VERDICT retry2_conclusion=$RETRY2_CONCLUSION retry2_verdict=$RETRY2_VERDICT budget_exhausted=$budget_exhausted"

      - name: Submit deterministic PR review
        id: submit
        if: needs.preflight.outputs.lane == 'ai'
        env:
          GH_TOKEN: ${{ github.token }}
          # On a base-merge-only re-fire (#120) the model never ran; reuse the
          # synthesized approved verdict from the rereview step. Otherwise prefer
          # the latest non-empty model verdict: second escalation, then first
          # escalation, then the cheap first pass.
          VERDICT: ${{ steps.rereview.outputs.skip_model == 'true' && steps.rereview.outputs.skip_verdict || (steps.claude_retry2.outputs.structured_output != '' && steps.claude_retry2.outputs.structured_output || (steps.claude_retry.outputs.structured_output != '' && steps.claude_retry.outputs.structured_output || steps.claude.outputs.structured_output)) }}
          # Passed via env (not inline ${{ }}) so the block is plain bash and can
          # be extracted and unit-tested (scripts/ci-gate/review-comment.test.sh).
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          MODEL: ${{ needs.preflight.outputs.model }}
          # PR net patch-id (#120), embedded in the approval marker so a future
          # base-merge re-fire can detect an unchanged diff and skip the model.
          PATCH_ID: ${{ steps.rereview.outputs.patch_id }}
          # #181: only chooses the no-verdict wording (budget-exceeded vs
          # generic). Never gates whether the merge is blocked — an unset or
          # garbage value degrades to the generic message, still fail-closed.
          BUDGET_EXHAUSTED: ${{ steps.retry_outcome.outputs.budget_exhausted }}
          CHANGED_LINES: ${{ needs.preflight.outputs.changed_lines }}
          BUDGET_USD: ${{ needs.preflight.outputs.budget_usd }}
        run: |
          set -euo pipefail
          # Neither pass produced a verdict (budget/turn exhaustion or a hard
          # error on both attempts). Fail closed — never merge unreviewed — but
          # leave an explained, actionable record and flag for a human instead
          # of dying on the action's cryptic "did not return structured_output".
          #
          # The blank check is load-bearing and must come FIRST (#181, ADR 0032):
          # when all three passes return no structured output, VERDICT is the
          # EMPTY STRING, and `jq -e` on empty input produces no output and exits
          # 0 — so `! jq -e ...` was false, this guard never fired, and the step
          # fell through to `--approve` and exited 0, green-lighting the merge of
          # a PR that was never reviewed. Only a malformed-but-non-empty verdict
          # (jq exit 4) ever reached the fail-closed branch.
          if [ -z "${VERDICT//[[:space:]]/}" ] || ! jq -e '.blocking | type == "boolean"' <<<"$VERDICT" >/dev/null 2>&1; then
            gh pr edit "$PR_NUMBER" --repo "$TARGET_REPO" --add-label ai-review-inconclusive 2>/dev/null || true
            # A budget-exhausted review is a legible outcome, not an opaque
            # `error_max_budget_usd`: name the cause, the diff size and the cap
            # so the maintainer knows the PR is oversized rather than broken.
            # The flag only chooses the wording — every branch here blocks.
            heading="⚠️ **Merge gate: review could not complete**"
            detail="The automated review produced no verdict across all three passes (budget/turn exhaustion, or the model failed to return a structured verdict on every attempt)."
            if [ "${BUDGET_EXHAUSTED:-}" = "true" ]; then
              heading="⚠️ **Merge gate: budget-exceeded — human review required**"
              detail="At least one review pass ended in \`error_max_budget_usd\`, and no pass produced a verdict. The diff (~${CHANGED_LINES:-unknown} changed lines) is larger than the first-pass review budget (\$${BUDGET_USD:-unknown}) and the \$1.00 escalations could not finish it either. This is a **budget-exceeded** outcome, not a review failure — split the PR into smaller, independently reviewable changes, or review it by hand."
            fi
            gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "$heading

          $detail This PR was **not** auto-merged. A maintainer should review and merge it manually."
            exit 1
          fi
          # Expose the verdict so this gate job can file follow-up issues for the
          # non-blocking findings once (and only if) the PR actually merges.
          {
            echo "verdict<<VERDICT_EOF"
            printf '%s\n' "$VERDICT"
            echo "VERDICT_EOF"
          } >>"$GITHUB_OUTPUT"
          body=$(jq -r '
            .summary
            + (if ((.review_first // []) | length) > 0
               then "\n\n**👀 Review these first**\n"
                    + (.review_first | map("- `" + .location + "` — " + .why) | join("\n"))
               else "" end)
            + (if ((.findings // []) | length) > 0
               then "\n\n**Findings**\n" + (.findings | map("- " + .) | join("\n"))
               else "" end)
            + (if ((.followups // []) | length) > 0
               then "\n\n**Follow-ups** (filed as issues on merge)\n"
                    + (.followups | map("- `" + .location + "` — " + .note) | join("\n"))
               else "" end)
          ' <<<"$VERDICT")
          body="$body

          <!-- ai-review-head:${HEAD_SHA} patchid:${PATCH_ID:-} model:${MODEL} -->
          <!-- ai-review-run:${GITHUB_RUN_ID} -->"
          if [ "$(jq -r .blocking <<<"$VERDICT")" = true ]; then
            # A token may be the PR author's identity. GitHub forbids a user
            # reviewing their own PR, but the non-zero result must still block
            # the admin merge and leave an auditable record.
            gh pr review "$PR_NUMBER" --repo "$TARGET_REPO" --request-changes --body "$body" \
              || gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "🚫 **Merge gate: blocking verdict**

            $body"
            exit 1
          fi
          if ! approval_error=$(gh pr review "$PR_NUMBER" --repo "$TARGET_REPO" --approve --body "$body" 2>&1); then
            case "$approval_error" in
              "Can not approve your own pull request" \
                | "GraphQL: Can not approve your own pull request (addPullRequestReview)" \
                | "GraphQL: GitHub Actions is not permitted to approve pull requests. (addPullRequestReview)" \
                | "failed to create review: GraphQL: GitHub Actions is not permitted to approve pull requests. (addPullRequestReview)") ;;
              *) echo "$approval_error" >&2; exit 1 ;;
            esac
            # The required gate check remains the enforcement
            # mechanism. A comment is the only GitHub-permitted audit record
            # when GitHub rejects self-approval or repository policy disables
            # Actions-authored approvals.
            gh pr comment "$PR_NUMBER" --repo "$TARGET_REPO" --body "✅ **Merge gate: approved verdict**

            $body"
          fi

      - name: Build trusted merge attestation
        env:
          VERDICT: ${{ steps.submit.outputs.verdict }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/merge-attestation"
          rm -rf "$dir"
          mkdir -m 700 "$dir"
          followups='[]'
          if [ -n "${VERDICT:-}" ]; then
            followups="$(jq -c '.followups // []' <<<"$VERDICT")"
          fi
          jq -n \
            --arg repository "$TARGET_REPO" \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson followups "$followups" \
            '{version:1, repository:$repository, pr_number:$pr_number,
              head_sha:$head_sha, run_id:$run_id, followups:$followups}' \
            >"$dir/attestation.json"

      - name: Upload trusted merge attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: merge-attestation-${{ github.run_id }}
          path: ${{ runner.temp }}/merge-attestation/attestation.json
          retention-days: 1
          if-no-files-found: error

      # --- CI telemetry (best-effort). Every step is `continue-on-error` so it
      # can NEVER fail or block the gate, and it stays dormant until
      # OTEL_EXPORTER_OTLP_ENDPOINT is set — the composite action no-ops without
      # an endpoint. Emits one CiTelemetryPayload for the review. See ADR 0004
      # and docs/ci-telemetry.md.
      - name: Fetch telemetry helper scripts
        if: always() && needs.preflight.outputs.lane == 'ai'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: Verjson/.github
          ref: main
          path: .gate-tools
          sparse-checkout: scripts/ci-telemetry
          sparse-checkout-cone-mode: false

      - name: Build ai-review telemetry payload
        if: always() && needs.preflight.outputs.lane == 'ai'
        continue-on-error: true
        env:
          VERDICT_JSON: ${{ steps.claude_retry2.outputs.structured_output != '' && steps.claude_retry2.outputs.structured_output || (steps.claude_retry.outputs.structured_output != '' && steps.claude_retry.outputs.structured_output || steps.claude.outputs.structured_output) }}
          EXECUTION_FILE: ${{ steps.claude_retry2.outputs.execution_file != '' && steps.claude_retry2.outputs.execution_file || (steps.claude_retry.outputs.execution_file != '' && steps.claude_retry.outputs.execution_file || steps.claude.outputs.execution_file) }}
          ACTION_CONCLUSION: ${{ steps.claude_retry2.conclusion != 'skipped' && steps.claude_retry2.conclusion || (steps.claude_retry.conclusion != 'skipped' && steps.claude_retry.conclusion || steps.claude.conclusion) }}
          LANE: ${{ needs.preflight.outputs.lane }}
          LANE_REASON: ${{ needs.preflight.outputs.reason }}
          MODEL: ${{ needs.preflight.outputs.model }}
          BUDGET_USD: ${{ needs.preflight.outputs.budget_usd }}
          DEPENDENCY_MAJOR: ${{ needs.preflight.outputs.dependency_major }}
        run: |
          set -uo pipefail    # deliberately no -e: telemetry must never abort
          mkdir -p .telemetry
          exec_summary=$(.gate-tools/scripts/ci-telemetry/parse-claude-execution.sh "${EXECUTION_FILE:-}" 2>/dev/null || echo '{}')
          verdict_blocking=null
          findings_count=null
          if [ -n "${VERDICT_JSON:-}" ] && jq -e . >/dev/null 2>&1 <<<"$VERDICT_JSON"; then
            verdict_blocking=$(jq -c '.blocking // null' <<<"$VERDICT_JSON")
            findings_count=$(jq -c '(.findings // []) | length' <<<"$VERDICT_JSON")
          fi
          jq -n \
            --arg repository "$TARGET_REPO" \
            --arg workflow_name "$GITHUB_WORKFLOW" \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg lane "${LANE:-}" \
            --arg lane_reason "${LANE_REASON:-}" \
            --arg model_selected "${MODEL:-}" \
            --arg action_conclusion "${ACTION_CONCLUSION:-}" \
            --argjson budget_usd "${BUDGET_USD:-0}" \
            --argjson dependency_major "${DEPENDENCY_MAJOR:-false}" \
            --argjson verdict_blocking "$verdict_blocking" \
            --argjson findings_count "$findings_count" \
            --argjson exec "$exec_summary" \
            '{
              schema_version: 1,
              verjson_project: "verjson",
              repository: $repository,
              workflow_name: $workflow_name,
              job_name: "ai-review",
              event_name: $event_name,
              lane: $lane,
              review_type: "ai",
              lane_reason: (if $lane_reason == "" then null else $lane_reason end),
              model_selected: (if $model_selected == "" then null else $model_selected end),
              budget_usd: $budget_usd,
              dependency_major: $dependency_major,
              verdict_blocking: $verdict_blocking,
              findings_count: $findings_count,
              action_conclusion: (if $action_conclusion == "" then null else $action_conclusion end),
              execution_file_present: ($exec.execution_file_present // false),
              execution_file_parse_ok: ($exec.execution_file_parse_ok // false),
              total_cost_usd: ($exec.total_cost_usd // null),
              total_turns: ($exec.num_turns // null)
            }' > .telemetry/ai-review.json

      # NOTE: OTLP emit temporarily removed. `uses: Verjson/verjson-observability`
      # resolves on the gce runners but NOT on gha-meta-1 (used for this repo's
      # own PRs + workflow_dispatch), and `uses:` resolution at job-setup is not
      # guarded by continue-on-error, so it failed the whole ai-review job on
      # meta. The payload is still built above (dormant). Re-add the emit step
      # once the meta runner can resolve the private action AND the OTLP
      # endpoint is provisioned (see docs/ci-telemetry.md, ADR 0004).

      - name: Authoritative merge recheck and squash-merge
        id: merge
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_ABSENT_CHECKS: ${{ inputs.allow_absent_checks || false }}
        run: |
          set -euo pipefail
          REPO="$TARGET_REPO"
          merge_started_epoch="$(date +%s)"
          echo "::notice::phase=merge-recheck started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) lane=$LANE expected_head=$EXPECTED_HEAD_SHA"
          # Re-check the opt-outs at merge time — the authoritative hold gate:
          # a `hold`/`DO NOT MERGE` label added after classification must still
          # stop the merge. Match is case- and separator-insensitive so a
          # `DO NOT MERGE` *label* (not just the title marker) holds too — #51.
          meta=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels,title,isDraft,state,headRefOid)
          if jq -e '([.labels[].name | ascii_upcase | gsub("[ _-]+";" ")]) as $l | ($l | index("HOLD")) or ($l | index("DO NOT MERGE")) or (.title | ascii_upcase | contains("DO NOT MERGE")) or .isDraft' <<<"$meta" >/dev/null; then
            echo "PR #$PR_NUMBER is held (label/title/draft); not merging."
            exit 0
          fi
          if [ "$(jq -r .state <<<"$meta")" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is no longer open; nothing to do."
            exit 0
          fi
          current_head="$(jq -r '.headRefOid // ""' <<<"$meta")"
          if [ -z "$EXPECTED_HEAD_SHA" ] || [ "$current_head" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::phase=merge-recheck result=head-changed expected=$EXPECTED_HEAD_SHA current=$current_head"
            exit 1
          fi

          # One immediate, authoritative CI snapshot. There is deliberately no
          # second polling loop after model spend: pending, red, or inconclusive
          # state fails closed and a later event/re-run can attempt the new head.
          checks_rc=0
          statuses_rc=0
          rollup_rc=0
          check_pages=$(gh api --paginate \
              "repos/$REPO/commits/$EXPECTED_HEAD_SHA/check-runs?per_page=100" 2>/dev/null |
            jq -s -c '.') || checks_rc=$?
          status_pages=$(gh api --paginate \
              "repos/$REPO/commits/$EXPECTED_HEAD_SHA/status?per_page=100" 2>/dev/null |
            jq -s -c '.') || statuses_rc=$?
          if [ "$checks_rc" -eq 0 ] && [ "$statuses_rc" -eq 0 ]; then
            rollup=$(jq -c '
               if ((.checks | type) != "array" or
                   (.statuses | type) != "array" or
                   (.checks | length) == 0 or
                   (.statuses | length) == 0 or
                   ([.checks[] |
                     select((.check_runs | type) != "array")] | length) != 0 or
                   ([.statuses[] |
                     select((.statuses | type) != "array")] | length) != 0)
               then error("unusable CI status API response")
               else
               ([.checks[] | .check_runs[] |
                 {name,
                  status: ((.status // "") | ascii_upcase),
                  conclusion: (if .conclusion == null then null
                               else (.conclusion | ascii_upcase) end)}] +
                ([.statuses[] | .statuses[] |
                  {context, state: ((.state // "") | ascii_upcase)}] |
                 reduce .[] as $status
                   ([]; if any(.[]; .context == $status.context)
                        then . else . + [$status] end))) |
               [.[] | select((.name // .context) as $n |
                 $n != "preflight" and $n != "gate" and
                 $n != "freshness" and $n != "classify" and
                 $n != "ai-review" and $n != "ai-merge" and
                 $n != "review" and $n != "dispatch-merge" and
                 $n != "privileged_merge")]
               end
             ' <<<"{\"checks\":$check_pages,\"statuses\":$status_pages}" 2>/dev/null) || rollup_rc=$?
          else
            rollup_rc=1
          fi
          if [ "$checks_rc" -ne 0 ] || [ "$statuses_rc" -ne 0 ] || [ "$rollup_rc" -ne 0 ]; then
            echo "::error::phase=merge-recheck result=checks-unavailable elapsed_seconds=$(( $(date +%s) - merge_started_epoch )) head=$EXPECTED_HEAD_SHA checks_endpoint_rc=$checks_rc statuses_endpoint_rc=$statuses_rc aggregate_shape_rc=$rollup_rc gh_version=$(gh --version 2>/dev/null | head -n 1 | tr ' ' '_' || echo unavailable)"
            exit 1
          fi
          failed=$(jq '[.[] | select(
            if .state then
              ((.state // "") | IN("SUCCESS","PENDING","EXPECTED") | not)
            else
              (.status == "COMPLETED" and (.conclusion // "") != "" and ((.conclusion // "") | IN("SUCCESS","NEUTRAL","SKIPPED") | not))
            end
          )] | length' <<<"$rollup")
          pending=$(jq -r '[.[] | select(if .state then (.state | IN("PENDING","EXPECTED")) else (.status != "COMPLETED" or (.conclusion // "") == "") end) | "\(.name // .context)=\(.state // .status)"] | join(", ")' <<<"$rollup")
          if [ "$failed" -gt 0 ]; then
            echo "::error::phase=merge-recheck result=failed elapsed_seconds=$(( $(date +%s) - merge_started_epoch ))"
            jq -r '.[] | select(if .state then ((.state // "") | IN("SUCCESS","PENDING","EXPECTED") | not) else (.status == "COMPLETED" and (.conclusion // "") != "" and ((.conclusion // "") | IN("SUCCESS","NEUTRAL","SKIPPED") | not)) end) | (.name // .context)' <<<"$rollup"
            exit 1
          fi
          if [ -n "$pending" ]; then
            echo "::error::phase=merge-recheck result=pending elapsed_seconds=$(( $(date +%s) - merge_started_epoch )) pending=$pending"
            exit 1
          fi
          # Fail closed on ABSENT CI, not just red or pending CI (#143). This
          # snapshot is authoritative and irreversible (it squash-merges), so it
          # repeats both absence checks the ci-wait step makes rather than
          # trusting that earlier snapshot: an empty post-filter rollup means no
          # check ever reported, and a `startup_failure` run produces no check
          # run at all. An unreadable probe is inconclusive — also fail closed;
          # a later event re-runs the gate.
          # Same order as ci-wait (probe → startup-failure → no-checks) so the
          # two steps give the SAME diagnosis for the same repo state: probing
          # first lets an absent-check PR be reported as the actionable
          # `startup-failure` rather than the generic `no-checks`.
          #
          # The probe mirrors ci-wait's hardening: keep jq's exit status instead
          # of `|| echo ""`, and require the shape assertion to produce `true`
          # (jq exits 0 on an empty body). A 2xx carrying an HTML error page or a
          # truncated payload must read as INCONCLUSIVE — reading it as "no
          # startup failures" is what let an unbuilt PR merge (#143).
          #
          # Unlike ci-wait, this step has already paid for the model review, so a
          # single transient API blip must not throw that away and demand a
          # manual workflow_dispatch: retry a bounded few times, then fail closed.
          # Same jq pass, same field order and same COUNT-based verdict as
          # ci-wait: `name` is nullable, and `[null] | join(", ")` is "", so a
          # name-keyed test would merge a PR whose workflow died parsing its own
          # YAML. Names are log text only. Any divergence between the wait rule
          # and the merge rule is the original bug class (#143). The run count is
          # read into `_` rather than dropped from the jq output on purpose: the
          # two programs must stay diffable field-for-field. Only ci-wait needs
          # the count (for its "nothing was triggered" shortcut).
          broken=""
          startup_count=0
          probe=unavailable
          for probe_attempt in 1 2 3; do
            if runs_json=$(gh api "repos/$REPO/actions/runs?head_sha=$EXPECTED_HEAD_SHA&per_page=100" 2>/dev/null) &&
               probe_out=$(jq -r '
                 ((env.GITHUB_RUN_ID // "") | tonumber? // -1) as $self
                 | if (has("workflow_runs") and (.workflow_runs | type == "array")) then
                   ([.workflow_runs[]
                     | select(((.conclusion // "") | ascii_downcase) == "startup_failure")]) as $bad
                   | "ok\t\(.workflow_runs | map(select(.id != $self)) | length)\t\($bad | length)\t\([$bad[] | .name // "<unnamed>"] | unique | join(", "))"
                 else "unusable" end' <<<"$runs_json" 2>/dev/null) &&
               IFS=$'\t' read -r probe_marker _ probe_startup probe_broken <<<"$probe_out" &&
               [ "${probe_marker:-}" = "ok" ]; then
              probe=ok
              startup_count="$probe_startup"
              broken="$probe_broken"
              break
            fi
            echo "::warning::phase=merge-recheck result=probe-retry attempt=$probe_attempt/3 head=$EXPECTED_HEAD_SHA"
            if [ "$probe_attempt" -lt 3 ]; then sleep 5; fi
          done
          if [ "$probe" != "ok" ]; then
            echo "::error::phase=merge-recheck result=probe-unavailable elapsed_seconds=$(( $(date +%s) - merge_started_epoch )) head=$EXPECTED_HEAD_SHA"
            echo "Could not read the workflow runs for $EXPECTED_HEAD_SHA after 3 attempts, so a startup_failure (which produces no check run) could not be ruled out. Not merging; a later gate event will retry."
            exit 1
          fi
          if [ "$startup_count" -gt 0 ]; then
            echo "::error::phase=merge-recheck result=startup-failure elapsed_seconds=$(( $(date +%s) - merge_started_epoch )) head=$EXPECTED_HEAD_SHA workflows=$broken"
            echo "Workflow(s) [$broken] failed at startup on $EXPECTED_HEAD_SHA and produced no check run — CI never ran. Not merging."
            echo "This run is permanent for $EXPECTED_HEAD_SHA — re-running the gate will not clear it. Fix the workflow, then push a new commit; alternatively delete the stale startup_failure run for this SHA."
            exit 1
          fi
          if [ "$(jq 'length' <<<"$rollup")" -eq 0 ]; then
            if [ "${ALLOW_ABSENT_CHECKS:-false}" = "true" ]; then
              echo "::warning::phase=merge-recheck result=no-checks-allowed elapsed_seconds=$(( $(date +%s) - merge_started_epoch )) head=$EXPECTED_HEAD_SHA"
              echo "PR #$PR_NUMBER has no CI checks for $EXPECTED_HEAD_SHA. Merging ONLY because allow_absent_checks=true was explicitly set for this run (#143)."
            else
              echo "::error::phase=merge-recheck result=no-checks elapsed_seconds=$(( $(date +%s) - merge_started_epoch )) head=$EXPECTED_HEAD_SHA"
              echo "PR #$PR_NUMBER reported no CI checks at all for $EXPECTED_HEAD_SHA; absent checks are not green. Not merging."
              exit 1
            fi
          fi
          if [ "$LANE" = "fast" ]; then
            # Audit trail: the fast lane's written record replaces the AI review.
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "✅ **Merge gate: fast lane** (no AI review needed) — ${LANE_REASON}. All CI checks green; squash-merging." || true
          fi
          echo "All checks green and head unchanged; merging PR #$PR_NUMBER (lane: $LANE)."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --admin --delete-branch \
            --match-head-commit "$EXPECTED_HEAD_SHA"
          echo "::notice::phase=merge result=merged elapsed_seconds=$(( $(date +%s) - merge_started_epoch )) lane=$LANE"

  dispatch-merge:
    needs: [preflight, gate]
    if: needs.gate.result == 'success'
    runs-on: ${{ github.repository_owner == 'Verjson' && fromJSON(vars.VERJSON_RUNNER_ISOLATED || vars.VERJSON_RUNNER_DEFAULT || '["self-hosted","gate"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      EXPECTED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      TARGET_REPO: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Dispatch fixed trusted merge continuation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] ||
            { echo "::error::invalid repository identity"; exit 1; }
          [ "$TARGET_REPO" = "$GITHUB_REPOSITORY" ] ||
            { echo "::error::repository identity mismatch"; exit 1; }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
            { echo "::error::invalid PR number"; exit 1; }
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::invalid expected head"; exit 1; }
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
            { echo "::error::invalid source run"; exit 1; }
          trusted_path="$(
            gh api --paginate "repos/$TARGET_REPO/actions/workflows" \
              --jq '.workflows[] | select(.path == ".github/workflows/ai-privileged-merge.yml") | .path'
          )"
          if [ -z "$trusted_path" ]; then
            echo "::notice::No trusted privileged merge continuation is installed; validation is green, but this PR requires human merge."
            exit 0
          fi
          [ "$trusted_path" = ".github/workflows/ai-privileged-merge.yml" ] ||
            { echo "::error::trusted workflow identity mismatch"; exit 1; }
          gh workflow run ai-privileged-merge.yml --repo "$TARGET_REPO" \
            -f pr_number="$PR_NUMBER" \
            -f expected_head_sha="$EXPECTED_HEAD_SHA" \
            -f source_run_id="$SOURCE_RUN_ID"
