name: runner-admission-reconcile

# Reconciles ADR 0033 runner routing against live org runner-group admission
# (#189). Routing picks a lane from repository visibility; only org settings
# decide whether a repository can be ASSIGNED that lane, and nothing kept the two
# honest — which is how #182 and #192 happened, and why a newly created
# repository still queues forever with no check run.
#
# GitHub has no way to fail a job at startup because no runner matches; a job
# simply queues. So this detects the condition on a schedule instead, before it
# surfaces as someone's wedged PR.
#
# Observe-and-report: it reuses the durable #820 issue and never mutates runner
# groups or creates tracker churn. Pool admission is the org admin's security
# boundary (ADR 0031, 0033) — a scheduled job is the wrong thing to hold that pen.

on:
  schedule:
    # Daily, off the top of the hour to avoid the stampede.
    - cron: '43 7 * * *'

# Least privilege: read the repo, write an issue. No contents: write, no
# pull-requests: write — this cannot alter code or merge anything.
permissions:
  contents: read
  issues: write

concurrency:
  group: runner-admission-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    # The fast lane, and NOT the general pool this job exists to watch (#401).
    # On 2026-08-05 the pool moved into a runner group that denied public
    # repositories, and this repository is public: every `[self-hosted, general]`
    # job here queued indefinitely — including this one, whose 10:16 run never
    # started. The monitor for "a repository cannot reach its lane" cannot itself
    # depend on reaching that lane, or it goes silent in exactly the outage it is
    # supposed to report. Hosted is also the safer host for ORG_ADMIN_TOKEN: this
    # is scheduled default-branch code with no fork input, on an ephemeral runner.
    runs-on: ${{ fromJSON(vars.VERJSON_RUNNER_FASTLANE || '["ubuntu-24.04"]') }}
    defaults:
      run:
        working-directory: .runner-admission-reconcile-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    timeout-minutes: 15
    steps:
      - name: Check out the runner admission reconciler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Schedule resolves this to the immutable default-branch SHA for the run.
          ref: ${{ github.sha }}
          path: .runner-admission-reconcile-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
          persist-credentials: false

      - name: Reconcile runner admission against routing policy
        id: reconcile
        env:
          # Reading org runner groups needs org scope. The default GITHUB_TOKEN
          # is repo-scoped and 403s, which the script reports as UNDETERMINED
          # rather than as a clean org.
          GH_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          ORG: ${{ github.repository_owner }}
          # Lane LABELS are already a variable flip rather than a pull request
          # (see the `runs-on` comments in node-ci.yml). The group NAME was the
          # half left in code, so the GCP→DigitalOcean move renamed the group out
          # from under the reconciler and it resolved nothing — the #266 failure
          # by name instead of by id. The fallbacks keep this zero-config until a
          # rename actually happens.
          GENERAL_GROUP_NAME: ${{ vars.VERJSON_RUNNER_GENERAL_GROUP || 'DigitalOcean' }}
          # Deliberately no fallback: the untrusted lane resolves to the general
          # pool today, so nothing reads this, and the last name it carried
          # (`isolated`) names a group deleted on 2026-07-31.
          UNTRUSTED_GROUP_NAME: ${{ vars.VERJSON_RUNNER_UNTRUSTED_GROUP }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=Missing ORG_ADMIN_TOKEN::Cannot read org runner groups without an org-scoped token. Failing rather than reporting an unverified org as clean."
            exit 1
          fi
          set +e
          report="$(bash scripts/ci-gate/runner-admission-reconcile.sh 2>&1)"
          code=$?
          set -e
          # Outputs first, summary second. `set -e` is back on, so a failing
          # summary write would otherwise abort before `code` is published and
          # BOTH downstream steps would skip on their `if:` conditions — the job
          # goes red, but the drift it found is silently dropped.
          {
            echo 'report<<REPORT_EOF'
            printf '%s\n' "$report"
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
          # The script's contract is exactly 0 (clean), 1 (drift), 2 (could not
          # look). Anything else is a crash, and a crash previously fell through
          # to the unconditional `exit 0` below: job green, drift step skipped,
          # nothing filed — the monitor silently reporting an unexamined org as
          # fine. That is the same blind spot #266 fixed inside the script, so
          # the wrapper closes it too rather than trusting the script never to
          # exit 127 or abort under `set -u`.
          case "$code" in
            0|1)
              ;;
            2)
              # "I could not look": loud, and NOT drift worth filing an issue about.
              echo "::error title=Runner admission undetermined::Could not read the org; not reporting this as clean."
              exit 1
              ;;
            *)
              echo "::error title=Runner admission crashed::Reconciler exited $code, outside its documented 0/1/2 contract. Treating as undetermined rather than clean."
              exit 1
              ;;
          esac
          exit 0

      - name: Reopen or update the durable drift issue
        if: steps.reconcile.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.reconcile.outputs.report }}
          MARKER: '<!-- runner-admission-drift -->'
          DRIFT_ISSUE: '820'
        run: |
          set -euo pipefail
          body="$(printf '%s\n\n%s\n' "$REPORT" "$MARKER")"
          state="$(gh issue view "$DRIFT_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --json state --jq '.state')"
          if [ "$state" = 'CLOSED' ]; then
            gh issue reopen "$DRIFT_ISSUE" --repo "$GITHUB_REPOSITORY"
          elif [ "$state" != 'OPEN' ]; then
            echo "::error title=Runner admission report target invalid::Issue #$DRIFT_ISSUE returned state '$state'."
            exit 1
          fi
          comments="$(gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/issues/$DRIFT_ISSUE/comments?per_page=100" \
            --jq '.[] | {id,body}')"
          comment_ids="$(jq -sr --arg marker "$MARKER" \
            '[.[] | select((.body | type) == "string" and (.body | contains($marker))) | .id]' \
            <<<"$comments")"
          comment_count="$(jq -r 'length' <<<"$comment_ids")"
          if [ "$comment_count" = '0' ]; then
            gh api --method POST "/repos/$GITHUB_REPOSITORY/issues/$DRIFT_ISSUE/comments" \
              -f body="$body" >/dev/null
          elif [ "$comment_count" = '1' ]; then
            comment_id="$(jq -er '.[0]' <<<"$comment_ids")"
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -f body="$body" >/dev/null
          else
            echo "::error title=Runner admission report target ambiguous::Issue #$DRIFT_ISSUE has $comment_count report comments; refusing to update an arbitrary one."
            exit 1
          fi
          echo "::warning title=Runner admission drift::Updated durable issue #$DRIFT_ISSUE"

      - name: Close the durable drift issue once the org is clean again
        if: steps.reconcile.outputs.code == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFT_ISSUE: '820'
        run: |
          set -euo pipefail
          state="$(gh issue view "$DRIFT_ISSUE" --repo "$GITHUB_REPOSITORY" \
            --json state --jq '.state')"
          if [ "$state" = 'OPEN' ]; then
            gh issue close "$DRIFT_ISSUE" --repo "$GITHUB_REPOSITORY" \
              --comment 'Runner admission is reconciled again — every active repository is admitted to its selected group, all lanes have online capacity, no runner sits in the default group, and GitHub-hosted larger-runner inventory exactly matches the reviewed allowlist.'
          elif [ "$state" != 'CLOSED' ]; then
            echo "::error title=Runner admission report target invalid::Issue #$DRIFT_ISSUE returned state '$state'."
            exit 1
          fi

      - name: Remove the isolated runner-admission checkout
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        run: rm -rf ".runner-admission-reconcile-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}"
