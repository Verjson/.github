name: actionlint reusable-call contract

# A real, intentionally narrow caller for the reusable contract introduced by
# #153. This repository calls its current revision so its Verjson runner policy
# is exercised; external consumers should pin an immutable release.
on:
  pull_request:
    paths:
      - '.github/workflows/actionlint-reusable-contract.yml'

permissions:
  contents: read

jobs:
  actionlint:
    uses: ./.github/workflows/actionlint.yml
