name: actionlint reusable-call contract

# A real, intentionally narrow caller for the reusable contract introduced by
# #153. The implementation ref is the immutable commit that first exposed
# workflow_call; changing this fixture is the explicit act that re-runs it.
on:
  pull_request:
    paths:
      - '.github/workflows/actionlint-reusable-contract.yml'

permissions:
  contents: read

jobs:
  actionlint:
    uses: Verjson/.github/.github/workflows/actionlint.yml@bfecdd0111582d0ddada558e6b4d0cadd9b488bd
    with:
      github-hosted-runner: true
