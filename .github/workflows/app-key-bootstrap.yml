name: Seal environment App bootstrap keys
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seal:
    if: ${{ github.repository == 'Verjson/.github' && github.repository_id == '1269388380' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned sealed-box implementation
        run: |
          python3.12 -m venv "$RUNNER_TEMP/bootstrap-venv"
          "$RUNNER_TEMP/bootstrap-venv/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: -r scripts/app-key-bootstrap-requirements.txt
      - name: Seal the three reviewed destinations
        env:
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          MERGE_APP_PRIVATE_KEY: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
          AI_REVIEW_APP_PRIVATE_KEY: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
        run: '"$RUNNER_TEMP/bootstrap-venv/bin/python" scripts/app-key-bootstrap.py seal --output "$RUNNER_TEMP/app-key-bootstrap/sealed-keys.json"'
      - name: Retain ciphertext only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-key-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-key-bootstrap/sealed-keys.json
          if-no-files-found: error
          retention-days: 1
