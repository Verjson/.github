name: Debug Ubuntu AppArmor bubblewrap runner

on:
  workflow_dispatch:
  push:
    branches: [debug/apparmor-runner]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Diagnose packaged AppArmor profile loading
        shell: bash
        run: |
          set -u
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes apparmor apparmor-profiles bubblewrap

          root="/run/verjson-apparmor-debug-${GITHUB_RUN_ID}"
          profile="$root/bwrap-userns-restrict"
          source_profile="/usr/share/apparmor/extra-profiles/bwrap-userns-restrict"
          sudo install -d -o root -g root -m 0755 "$root"
          sudo install -o root -g root -m 0400 "$source_profile" "$profile"
          trap 'sudo /sbin/apparmor_parser --remove "$profile" >/dev/null 2>&1 || true; sudo rm -rf -- "$root"' EXIT

          uname -a
          sudo aa-status || true
          dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package} ${Version} ${Architecture}\n' apparmor apparmor-profiles bubblewrap
          printf '%s\n' '--- pathname parser load ---'
          sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/nonexistent \
            /sbin/apparmor_parser --replace "$profile" >/tmp/apparmor-pathname.out 2>&1
          pathname_status=$?
          printf 'pathname_status=%s\n' "$pathname_status"
          sed -n '1,120p' /tmp/apparmor-pathname.out

          printf '%s\n' '--- descriptor parser load ---'
          sudo /usr/bin/python3 - "$profile" <<'PY'
          import os
          import sys

          profile = os.open(sys.argv[1], os.O_RDONLY | os.O_CLOEXEC)
          parser = os.open("/sbin/apparmor_parser", os.O_RDONLY | os.O_CLOEXEC)
          os.set_inheritable(profile, True)
          os.set_inheritable(parser, True)
          os.execve(
              parser,
              ("apparmor_parser", "--replace", f"/proc/self/fd/{profile}"),
              {"PATH": "/usr/sbin:/usr/bin:/sbin:/bin", "HOME": "/nonexistent"},
          )
          PY
          descriptor_status=$?
          printf 'descriptor_status=%s\n' "$descriptor_status"

          printf '%s\n' '--- kernel/profile state ---'
          sudo aa-status || true
          sudo dmesg --color=never | tail -80 || true
          bwrap --ro-bind / / --unshare-user --unshare-pid true
      - name: Checkout canonical workflow source
        uses: actions/checkout@v5
      - name: Run canonical sandbox acquirer and report installed package
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/node-ci.yml').read_text(encoding='utf-8')
          start = workflow.index('sandbox_acquirer_source() {')
          body = workflow.index("/usr/bin/cat <<'PY'\\n", start) + len("/usr/bin/cat <<'PY'\\n")
          end = workflow.index('\\n          PY', body)
          Path('/tmp/verjson-sandbox-acquirer.py').write_text(
              textwrap.dedent(workflow[body:end]), encoding='utf-8'
          )
          PY
          sudo /usr/bin/python3 -I /tmp/verjson-sandbox-acquirer.py
          dpkg-query -W -f='${db:Status-Abbrev} ${binary:Package} ${Version} ${Architecture}\\n' \\
            apparmor apparmor-profiles bubblewrap
          sudo stat -c '%U %G %a %n' \\
            /run/verjson-compatibility-sandbox \\
            /run/verjson-compatibility-sandbox/bwrap-userns-restrict
