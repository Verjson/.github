name: Main-only App key environment admission

on:
  workflow_call:
    inputs:
      role:
        required: true
        type: string
      environment:
        required: true
        type: string
    secrets:
      AI_REVIEW_APP_PRIVATE_KEY:
        required: false

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify the caller's main-only role environment before key-job admission
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ROLE: ${{ inputs.role }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "$ROLE" in release|merge|ai-review) ;; *) exit 1 ;; esac
          [ "$ENVIRONMENT" = "$ROLE-app" ]
          [ "$REF" = refs/heads/main ]
          [ "$DEFAULT_BRANCH" = main ]
          environment_record=$(gh api "repos/$REPOSITORY/environments/$ENVIRONMENT")
          jq -e --arg name "$ENVIRONMENT" '
            .name == $name and (.id | type == "number" and . > 0) and
            .deployment_branch_policy.protected_branches == false and
            .deployment_branch_policy.custom_branch_policies == true
          ' <<<"$environment_record" >/dev/null
          policies=$(gh api "repos/$REPOSITORY/environments/$ENVIRONMENT/deployment-branch-policies?per_page=100")
          jq -e '
            .total_count == 1 and (.branch_policies | length) == 1 and
            .branch_policies[0].name == "main" and
            .branch_policies[0].type == "branch"
          ' <<<"$policies" >/dev/null

  validate-ai-review-key:
    if: ${{ inputs.role == 'ai-review' }}
    needs: validate
    runs-on: ${{ fromJSON(vars.CI_LANE_TRUSTED || vars.CI_LANE_FALLBACK || '["ubuntu-24.04"]') }}
    timeout-minutes: 2
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Resolve executing trusted workflow revision
        id: trusted-revision
        env:
          EXECUTING_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: echo "sha=$EXECUTING_WORKFLOW_SHA" >>"$GITHUB_OUTPUT"
      - name: Check out immutable AI review key validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ steps.trusted-revision.outputs.sha }}
          path: .gate-trust
          sparse-checkout: scripts/ci-gate/validate-ai-review-app-key.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate the resolved AI review App private key
        env:
          AI_REVIEW_APP_PRIVATE_KEY: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
        run: bash .gate-trust/scripts/ci-gate/validate-ai-review-app-key.sh
