# actionlint config — declares the self-hosted runner labels that may appear in
# a `runs-on`, so the [runner-label] check doesn't false-positive on our custom
# pools (actionlint only knows GitHub-hosted labels; see #80).
#
# This is the ORGANIZATION-WIDE default policy, not this repo's own: every
# consumer of the reusable `actionlint.yml` sparse-checks this exact file
# (`.verjson-actionlint-policy/.github/actionlint.yaml`) unless it passes
# `config-file`. So the list is the union of labels any Verjson workflow may
# route on — NOT a mirror of what `.github`'s own workflows use, and not a
# mirror of the live fleet.
#
# It used to also declare labels no runner carries: `GCP`, `gate`, `meta`,
# `isolated`. Declaring a dead label is worse than omitting it. A job routed at
# one is not rejected — GitHub queues it forever with no check-run diagnostic —
# and lint stayed green the whole time, so the only signal was a pull request
# that never finished. `Verjson/verjson-identity-lifecycle`'s `generated-docs`
# job sat exactly there on `[self-hosted, GCP]` until `35c1efa1` (#401). Undeclaring them turns
# that silence into a lint failure naming the file and line, which is how the
# #365 long tail gets found rather than waited on.
#
#   - `pwsh` is omitted although 8 runners carry it: no workflow routes on it, and
#     this list is what a workflow may SELECT, not an inventory of the fleet.
#     Declaring it would be the same defect as the dead labels, inverted.
#   - `docker`/`manish` are omitted as before: no Verjson workflow targets them.
#     `docker` is not a real lane at all (ADR 0040); `manish` is a real pool that
#     a repo using it declares in its own config.
#
# Keep in sync with docs/runner-routing.md / ADR 0030 if routing changes, and
# with the live fleet — `runner-admission-reconcile` is what checks that a lane
# still has runners, because no static file can.
self-hosted-runner:
  labels:
    - general # provider-neutral persistent pool (DigitalOcean group)

# GitHub Cloud exposes these workflow-identity properties for reusable jobs so
# they can check out files co-located with the called workflow. actionlint 1.7.7
# (and current 1.7.12) has not added them to its static job-context schema yet.
# https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#example-usage-of-job-context-workflow-identity
paths:
  .github/workflows/actionlint.yml:
    ignore:
      - '^property "workflow_repository" is not defined in object type \{container: \{id: string; network: string\}; services: \{string => \{id: string; network: string; ports: \{string => string\}\}\}; status: string\}$'
      - '^property "workflow_sha" is not defined in object type \{container: \{id: string; network: string\}; services: \{string => \{id: string; network: string; ports: \{string => string\}\}\}; status: string\}$'
  .github/workflows/ai-privileged-merge.yml:
    ignore:
      - '^property "workflow_repository" is not defined in object type \{container: \{id: string; network: string\}; services: \{string => \{id: string; network: string; ports: \{string => string\}\}\}; status: string\}$'
      - '^property "workflow_sha" is not defined in object type \{container: \{id: string; network: string\}; services: \{string => \{id: string; network: string; ports: \{string => string\}\}\}; status: string\}$'
  .github/workflows/node-release.yml:
    ignore:
      - '^property "workflow_repository" is not defined in object type \{container: \{id: string; network: string\}; services: \{string => \{id: string; network: string; ports: \{string => string\}\}\}; status: string\}$'
      - '^property "workflow_sha" is not defined in object type \{container: \{id: string; network: string\}; services: \{string => \{id: string; network: string; ports: \{string => string\}\}\}; status: string\}$'
