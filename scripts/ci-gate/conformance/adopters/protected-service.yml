# Synthetic adopter for the protected variant of the contract.
#
# It exists because `node-ci-protected.yml` declares inputs `node-ci.yml` does
# not — `event-name` among them — and a fixture written for one contract binds
# nothing for the other. The harness routes each fixture by the contract its
# `uses:` names rather than running every fixture against every contract.
name: CI (protected)
on:
  pull_request_target:
permissions:
  contents: read
  statuses: read
jobs:
  build-test:
    uses: Verjson/.github/.github/workflows/node-ci-protected.yml@CONFORMANCE
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    with:
      node-version: '24.20.0'
      package-manager: npm
      event-name: ${{ github.event_name }}
      head-repository: ${{ github.event.pull_request.head.repo.full_name }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      secretless-pr: true
      secretless-ci-script-plan: '["verify:ci"]'
