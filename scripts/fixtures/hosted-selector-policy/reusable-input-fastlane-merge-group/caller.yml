    branches: [main]
  pull_request:
  merge_group:
jobs:
  delegated:
    uses: Verjson/.github/.github/workflows/node-ci.yml@0123456789abcdef0123456789abcdef01234567
    with:
      runner: ${{ vars.CI_RUNNER_FASTLANE || '["ubuntu-24.04"]' }}
