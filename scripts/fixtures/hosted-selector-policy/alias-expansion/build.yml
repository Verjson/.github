# A YAML alias bomb. Tiny on disk and unbounded on expansion, so a file-size cap
# does not guard it. GitHub Actions does not support anchors in workflows at
# all, which makes refusing them both safe and correct here.
name: build
on: workflow_dispatch
x: &a ["lol","lol","lol","lol","lol","lol","lol","lol","lol"]
y: &b [*a,*a,*a,*a,*a,*a,*a,*a,*a]
z: &c [*b,*b,*b,*b,*b,*b,*b,*b,*b]
w: &d [*c,*c,*c,*c,*c,*c,*c,*c,*c]
v: &e [*d,*d,*d,*d,*d,*d,*d,*d,*d]
u: &f [*e,*e,*e,*e,*e,*e,*e,*e,*e]
t: &g [*f,*f,*f,*f,*f,*f,*f,*f,*f]
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - run: npm run dist
