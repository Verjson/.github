# A chain that stops at its own lane variable. An organization that set only
# CI_LANE_FALLBACK resolves this to an EMPTY runs-on, and GitHub queues an
# unplaceable job forever with no check-run diagnostic (#401).
name: ci
on: pull_request
jobs:
  build:
    runs-on: ${{ fromJSON(vars.CI_LANE_TRUSTED) }}
    steps:
      - run: npm test
